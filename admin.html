/* ---- v3 layout: fits phones, tablets and desktops ---- */

<script>const API_URL="https://script.google.com/macros/s/AKfycbyeEFNwCWYiNGrHQ1HJ03GCp01aTGHJk8W6-jIzyCswecSlQXuMibNyk7F7h0-l3Uy1/exec";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* the passkey lives in memory only: reloading the page always asks for it again */
const A={pk:"",step:"login",pkIn:"",msg:"",busy:false,busyMsg:"",list:[],warns:[],limits:{maxMesses:20,live:0},tab:"pending",view:"messes",
  arm:"",q:"",sort:"new",poll:null,copied:"",det:{},open:{},pan:{},note:null,health:null,delIn:"",set:false,npk:"",npk2:"",first:true,
  log:null,logBusy:false,ann:false,annArm:false,updated:null,f:{en:"",ee:"",enote:"",es:"",eb:"",as:"",ab:""}};
const ORDER=["pending","active","suspended","rejected","deleted"];
const COLORS={pending:"#b45309",active:"#15803d",suspended:"#b91c1c",rejected:"#9a3412",deleted:"#667873"};
try{const t=localStorage.getItem("adminTheme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}
function toggleTheme(){
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur==="dark"||(!cur&&matchMedia("(prefers-color-scheme:dark)").matches);
  const t=dark?"light":"dark";document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("adminTheme",t)}catch(e){}
}
async function api(body){
  const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  return r.json();
}
async function call(body){
  try{return await api(Object.assign({passkey:A.pk},body))}
  catch(e){return {ok:false,error:"Network error. Check your connection."}}
}
function signOut(m){
  clearInterval(A.poll);
  Object.assign(A,{pk:"",step:"login",pkIn:"",msg:m||"",busy:false,list:[],warns:[],arm:"",q:"",det:{},open:{},pan:{},note:null,health:null,delIn:"",set:false,npk:"",npk2:"",first:true,log:null,ann:false,annArm:false,view:"messes"});
  document.title="Mess Meal Manager Admin Panel";render();
}
async function login(){
  const pk=A.pkIn.trim();
  if(!pk){A.msg="Enter the passkey.";render();return}
  A.busy=true;A.msg="";A.pk=pk;render();
  const j=await call({action:"ownerCheck"});A.busy=false;
  if(!j||!j.ok){A.pk="";A.msg=(j&&j.error)||"Could not sign in.";render();return}
  A.step="in";A.pkIn="";await refresh();
  clearInterval(A.poll);A.poll=setInterval(()=>{if(A.pk&&!document.hidden&&!A.busy&&!(A.health&&A.health.running))refresh(true)},30000);
}
async function refresh(quiet){
  const j=await call({action:"ownerList"});
  if(j&&j.ok){
    A.list=j.messes||[];A.warns=j.warnings||[];A.limits=j.limits||A.limits;A.updated=new Date();
    if(A.first){A.first=false;A.tab=A.list.some(m=>m.status==="pending")?"pending":"all"}
  }
  else if(j&&j.error==="Incorrect passkey"){signOut("Incorrect passkey.");return}
  else if(j&&!quiet)setNote("bad",j.error||"Could not load.");
  render();
}
function setNote(t,m,extra){A.note=Object.assign({t:t,m:m},extra||{})}
function clearNote(){A.note=null;render()}
function setView(v){A.view=v;A.arm="";if(v==="activity")loadLog();else render()}
async function loadLog(){
  A.logBusy=true;render();
  const j=await call({action:"ownerLog",n:100});A.logBusy=false;
  if(j&&j.ok)A.log=j.log||[];else setNote("bad",(j&&j.error)||"Could not load the activity log.");
  render();
}
const LBL={ownerApprove:"Approve",ownerReject:"Reject",ownerSuspend:"Suspend",ownerResume:"Resume",ownerDelete:"Delete",ownerResetPassword:"Reset the admin password of"};
const YES={ownerApprove:"Yes, approve",ownerReject:"Yes, reject",ownerSuspend:"Yes, suspend",ownerResume:"Yes, resume",ownerDelete:"Delete forever",ownerResetPassword:"Yes, reset"};
const CLS={ownerApprove:"ok",ownerReject:"bad",ownerSuspend:"warn",ownerResume:"ok",ownerDelete:"bad",ownerResetPassword:"warn"};
const norm=s=>String(s||"").trim().toLowerCase().replace(/\s+/g,"-");
async function act(action,code){
  const key=action+":"+code;
  if(A.arm!==key){A.arm=key;A.delIn="";render();return}
  if(action==="ownerDelete"&&norm(A.delIn)!==code)return;
  const m=A.list.find(x=>x.code===code)||{name:code};
  A.arm="";A.busy=true;A.busyMsg=action==="ownerApprove"?"Creating the spreadsheet for "+m.name+". This can take up to 30 seconds…":"Working…";A.note=null;render();
  const j=await call({action:action,code:code,confirm:A.delIn});A.busy=false;A.delIn="";
  if(!j||!j.ok)setNote("bad",(j&&j.error)||"That did not work.");
  else if(action==="ownerApprove"){
    setNote(j.emailed===false?"warn":"ok",m.name+" is approved and its spreadsheet was created."+(j.emailed===false?" The approval email could not be sent, so tell the admin the code: "+code+".":" The admin was emailed."),j.sheetUrl?{link:j.sheetUrl,linkText:"Open sheet"}:null);
    delete A.det[code];
  }
  else if(action==="ownerDelete"){setNote("ok",m.name+" was deleted. Its spreadsheet is in the Drive trash for about 30 days.");delete A.det[code];delete A.open[code]}
  else if(action==="ownerResetPassword"){
    if(j.emailed)setNote("ok","A temporary password was emailed to the admin of "+m.name+".");
    else setNote("warn","The email could not be sent. Temporary password for "+m.name+": "+j.temp,{copy:j.temp});
  }
  else setNote("ok",({ownerReject:"Request rejected.",ownerSuspend:m.name+" is suspended. Its members cannot sign in.",ownerResume:m.name+" is active again."})[action]||"Done.");
  A.log=null;
  await refresh();
}
function cancel(){A.arm="";A.delIn="";A.annArm=false;render()}
function copyText(text,key){
  const done=()=>{A.copied=key;render();setTimeout(()=>{if(A.copied===key){A.copied="";render()}},1500)};
  try{navigator.clipboard.writeText(text).then(done,done)}catch(e){done()}
}
const invite=code=>location.href.split(/[?#]/)[0].replace(/[^\/]*$/,"")+"index.html?m="+encodeURIComponent(code);
async function loadDetail(code,action){
  A.det[code]={loading:true};render();
  const j=await call({action:action||"ownerDetail",code:code});
  if(j&&j.ok){A.det[code]={data:j.stats};if(action==="ownerRepair")setNote("ok",j.created?"A new empty data sheet was created and linked (the old one could not be found).":"Checked and repaired. Everything is in place.")}
  else{A.det[code]={err:(j&&j.error)||"Could not check this mess."};if(action==="ownerRepair")setNote("bad",A.det[code].err)}
  A.log=null;
  if(action==="ownerRepair")await refresh();else render();
}
function toggle(code){
  A.open[code]=!A.open[code];
  if(A.open[code]&&!A.det[code]){const m=A.list.find(x=>x.code===code);if(m&&(m.status==="active"||m.status==="suspended")){loadDetail(code);return}else A.det[code]={data:{basic:true,issues:[]}}}
  render();
}
function openPanel(code,kind){
  const m=A.list.find(x=>x.code===code);if(!m)return;
  A.pan[code]=A.pan[code]===kind?null:kind;
  if(A.pan[code]==="edit"){A.f.en=m.name;A.f.ee=m.email||"";A.f.enote=m.note||""}
  if(A.pan[code]==="mail"){A.f.es="";A.f.eb=""}
  render();
}
async function saveEdit(code){
  const m=A.list.find(x=>x.code===code);if(!m)return;
  A.busy=true;A.busyMsg="Saving…";render();
  let j=await call({action:"ownerEdit",code:code,name:A.f.en,email:A.f.ee});
  if(j&&j.ok&&A.f.enote!==(m.note||""))j=await call({action:"ownerNote",code:code,note:A.f.enote});
  A.busy=false;
  if(j&&j.ok){setNote("ok","Saved changes to "+A.f.en.trim()+".");A.pan[code]=null;A.log=null}
  else setNote("bad",(j&&j.error)||"Could not save.");
  await refresh();
}
async function sendMail(code){
  if(!A.f.es.trim()||!A.f.eb.trim()){setNote("bad","Write a subject and a message.");render();return}
  A.busy=true;A.busyMsg="Sending…";render();
  const j=await call({action:"ownerEmail",code:code,subject:A.f.es,body:A.f.eb});A.busy=false;
  if(j&&j.ok){setNote("ok","Email sent to the admin.");A.pan[code]=null;A.log=null}else setNote("bad",(j&&j.error)||"Could not send the email.");
  render();
}
async function sendAnnounce(){
  if(!A.f.as.trim()||!A.f.ab.trim()){setNote("bad","Write a subject and a message.");render();return}
  const n=new Set(A.list.filter(m=>(m.status==="active"||m.status==="suspended")&&m.email).map(m=>m.email)).size;
  if(!A.annArm){A.annArm=true;render();return}
  A.annArm=false;A.busy=true;A.busyMsg="Sending to "+n+" admins…";render();
  const j=await call({action:"ownerAnnounce",subject:A.f.as,body:A.f.ab});A.busy=false;
  if(j&&j.ok){setNote(j.failed?"warn":"ok","Announcement sent to "+j.sent+" admin"+(j.sent===1?"":"s")+(j.failed?" ("+j.failed+" failed)":"")+".");A.ann=false;A.f.as=A.f.ab="";A.log=null}
  else setNote("bad",(j&&j.error)||"Could not send the announcement.");
  render();
}
async function checkAll(){
  const live=A.list.filter(m=>m.status==="active"||m.status==="suspended");
  if(!live.length){setNote("warn","There are no approved messes to check yet.");render();return}
  A.health={running:true,done:0,total:live.length,rows:[]};render();
  for(const m of live){
    const j=await call({action:"ownerDetail",code:m.code});
    const s=j&&j.ok?j.stats:{ok:false,issues:[(j&&j.error)||"Could not check."]};
    A.det[m.code]={data:s};
    A.health.rows.push({m:m,s:s});A.health.done++;render();
  }
  A.health.running=false;render();
}
function exportCsv(){
  const rows=[["code","name","email","status","requested","note","sheet"]].concat(A.list.map(m=>[m.code,m.name,m.email,m.status,m.createdAt,m.note||"",m.sheetUrl||""]));
  const csv=rows.map(r=>r.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));
  a.download="messes-"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso).getTime())/60000);if(!(m>=0))return "";if(m<1)return "just now";if(m<60)return m+" min ago";if(m<1440)return Math.round(m/60)+" h ago";return Math.round(m/1440)+" d ago"};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const num=n=>Number(n||0).toLocaleString(undefined,{maximumFractionDigits:2});
const day=iso=>{const d=new Date(iso);return isNaN(d)?"":d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"})};
const hm=d=>d?d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";

function detail(m){

  }
  const live=m.status==="active"||m.status==="suspended",c=esc(m.code),pan=A.pan[m.code];

  let form="";
  if(pan==="edit")form=`<div class="form" style="margin-top:12px"><label for="en">Mess name</label><input id="en" maxlength="40" value="${esc(A.f.en)}" oninput="A.f.en=this.value"><label for="ee">Admin email</label><input id="ee" type="email" autocapitalize="off" value="${esc(A.f.ee)}" oninput="A.f.ee=this.value"><label for="enote">Private note (only you see this)</label><input id="enote" maxlength="300" value="${esc(A.f.enote)}" oninput="A.f.enote=this.value"><div class="acts"><button ${A.busy?"disabled":""} onclick="saveEdit('${c}')">Save changes</button><button class="ghost" onclick="openPanel('${c}','edit')">Cancel</button></div></div>`;
  if(pan==="mail")form=`<div class="form" style="margin-top:12px"><label for="es">Subject</label><input id="es" maxlength="120" value="${esc(A.f.es)}" oninput="A.f.es=this.value"><label for="eb">Message to ${esc(m.email)}</label><textarea id="eb" maxlength="2000" oninput="A.f.eb=this.value">${esc(A.f.eb)}</textarea><div class="acts"><button ${A.busy?"disabled":""} onclick="sendMail('${c}')">Send email</button><button class="ghost" onclick="openPanel('${c}','mail')">Cancel</button></div></div>`;
  return `<div class="detail"><p class="info"><b>Admin email:</b> ${esc(m.email||"No email")}<br><b>Requested:</b> ${esc(day(m.createdAt))} (${esc(ago(m.createdAt))})<br><b>Mess code:</b> ${c}</p>${m.note?`<p class="info"><b>Your note:</b> ${esc(m.note)}</p>`:""}${body}
  <div class="acts">${link}<button class="ghost" onclick="copyText(invite('${c}'),'inv:${c}')">${A.copied==="inv:"+m.code?"Link copied":"Copy invite link"}</button><button class="ghost" onclick="openPanel('${c}','edit')">Edit</button>${m.email?`<button class="ghost" onclick="openPanel('${c}','mail')">Email admin</button>`:""}${live?`<button class="ghost" ${A.busy?"disabled":""} onclick="loadDetail('${c}','ownerRepair')">Repair</button><button class="ghost" ${A.busy?"disabled":""} onclick="act('ownerResetPassword','${c}')">Reset password</button>`:""}</div>${form}</div>`;
}
function card(m){
  const i=A.arm.indexOf(":"),armAct=i>0&&A.arm.slice(i+1)===m.code?A.arm.slice(0,i):"";
  let b="";
  if(m.status==="pending")b=ab("Approve","ok","ownerApprove",m.code)+ab("Reject","ghost","ownerReject",m.code);
  else if(m.status==="active")b=ab("Suspend","ghost","ownerSuspend",m.code)+ab("Delete","ghost","ownerDelete",m.code);
  else if(m.status==="suspended")b=ab("Resume","ok","ownerResume",m.code)+ab("Delete","ghost","ownerDelete",m.code);
  else if(m.status==="rejected")b=ab("Approve anyway","ghost","ownerApprove",m.code)+ab("Delete","ghost","ownerDelete",m.code);
  if(m.status!=="pending")b+=`<button class="ghost" onclick="toggle('${esc(m.code)}')" aria-expanded="${!!A.open[m.code]}">${A.open[m.code]?"Hide details":"Details"}</button>`;
  const nm=m.name||"?",h=hue(nm);
  let conf="";
  if(armAct==="ownerDelete")conf=`<div class="confirm" role="alert"><span style="flex:1 1 100%">Delete ${esc(nm)} forever? Its spreadsheet goes to the Drive trash and members lose access. Type <b>${esc(m.code)}</b> to confirm.</span><input id="dc" autocomplete="off" autocapitalize="off" placeholder="${esc(m.code)}" value="${esc(A.delIn)}" oninput="A.delIn=this.value;render()"><div class="acts"><button class="bad" ${A.busy||norm(A.delIn)!==m.code?"disabled":""} onclick="act('ownerDelete','${esc(m.code)}')">${YES.ownerDelete}</button><button class="ghost" onclick="cancel()">Cancel</button></div></div>`;
  else if(armAct)conf=`<div class="confirm" role="alert"><span>${LBL[armAct]} ${esc(nm)}?</span><div class="acts"><button class="${CLS[armAct]}" ${A.busy?"disabled":""} onclick="act('${armAct}','${esc(m.code)}')">${YES[armAct]}</button><button class="ghost" onclick="cancel()">Cancel</button></div></div>`;
  return `<div class="card ${esc(m.status)} ${A.open[m.code]?"open":""}"><div class="row"><div class="av" style="background:linear-gradient(135deg,hsl(${h} 62% 38%),hsl(${(h+40)%360} 66% 48%))">${esc(nm.trim().charAt(0).toUpperCase())}</div>
  <div class="who"><div class="name">${esc(nm)}</div><div class="sub">${esc(m.email||"No email")}</div></div><span class="badge b-${esc(m.status)}">${esc(m.status)}</span></div>
  <div class="meta"><button class="code" style="font-weight:600" onclick="copyText('${esc(m.code)}','c:${esc(m.code)}')" title="Copy code">${esc(m.code)} <small>${A.copied==="c:"+m.code?"Copied":"Tap to copy"}</small></button><span class="sub">Requested ${esc(ago(m.createdAt))}</span></div>
  ${m.note&&!A.open[m.code]?`<span class="tag">📝 ${esc(m.note)}</span>`:""}
  ${conf||(b?`<div class="acts" style="margin-top:12px">${b}</div>`:"")}${A.open[m.code]?detail(m):""}</div>`;
}
async function savePasskey(){
  if(A.npk.length<6){setNote("bad","The new passkey must be at least 6 characters.");render();return}
  if(A.npk!==A.npk2){setNote("bad","The two passkeys do not match.");render();return}
  A.busy=true;A.busyMsg="Saving…";render();
  const j=await call({action:"ownerPasskey",newPasskey:A.npk});A.busy=false;
  if(j&&j.ok){A.pk=A.npk;A.npk=A.npk2="";A.set=false;A.log=null;setNote("ok","Passkey changed. Use the new one next time you sign in.")}
  else setNote("bad",(j&&j.error)||"Could not change the passkey.");
  render();
}
function healthPanel(){
  const h=A.health;if(!h)return "";
  const bad=h.rows.filter(r=>!r.s.ok||(r.s.issues&&r.s.issues.some(x=>!/No members/.test(x)))).length;
  const head=h.running?`<span class="spin"></span>Checking ${h.done}/${h.total}…`:(bad?`⚠ ${bad} of ${h.total} need attention`:`✓ All ${h.total} messes are healthy`);
  const rows=h.rows.map(r=>{const ok=r.s.ok&&!(r.s.issues&&r.s.issues.length);return `<div class="r"><span>${ok?"✅":(r.s.ok?"ℹ️":"⚠️")}</span><div><b>${esc(r.m.name)}</b> <span class="sub">${esc(r.m.code)}</span>${ok?`<small>${num(r.s.members)} members · ${num(r.s.mealDays)} meal days · ${num(r.s.stories)} live stories</small>`:`<small>${esc((r.s.issues||[]).join(" "))}</small>`}</div></div>`}).join("");
  return `<div class="health"><h3>${head}</h3>${rows}${h.running?"":`<div class="acts" style="margin-top:10px"><button class="ghost" onclick="A.health=null;render()">Close</button></div>`}</div>`;
}
function noteBox(){
  return (A.note?`<div class="note ${esc(A.note.t)}" role="status"><span class="t">${esc(A.note.m)}${A.note.link?` <a href="${esc(A.note.link)}" target="_blank" rel="noopener">${esc(A.note.linkText||"Open")}</a>`:""}${A.note.copy?` <button class="ghost mini" style="margin-left:6px" onclick="copyText('${esc(A.note.copy)}','tmp')">${A.copied==="tmp"?"Copied":"Copy"}</button>`:""}</span><button class="x" aria-label="Dismiss" onclick="clearNote()">×</button></div>`:"")+

/* ---- Messes view ---- */
function messesView(){
  const L=A.list,cnt=s=>L.filter(m=>m.status===s).length;
  const tabs=[["all","All",L.filter(m=>m.status!=="deleted").length],["pending","Pending",cnt("pending")],["active","Active",cnt("active")],["suspended","Suspended",cnt("suspended")],["rejected","Rejected",cnt("rejected")],["deleted","Deleted",cnt("deleted")]];
  const q=A.q.trim().toLowerCase();
  let list=L.filter(m=>A.tab==="all"?m.status!=="deleted":m.status===A.tab).filter(m=>!q||[m.name,m.email,m.code,m.note].some(v=>String(v||"").toLowerCase().includes(q)));
  list=list.slice().sort((x,y)=>A.sort==="name"?String(x.name).localeCompare(String(y.name)):A.sort==="old"?(x.createdAt<y.createdAt?-1:1):(x.createdAt<y.createdAt?1:-1));

    <div class="cap"><div class="l"><span>Live messes</span><b>${live} / ${max}</b></div><div class="meter ${live>=max?"full":""}"><i style="width:${pct}%"></i></div></div>
    ${A.warns.length?`<div class="warns" role="alert"><b>Needs attention</b><ul>${A.warns.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`:""}
    <div class="tools"><button class="ghost" ${A.busy||(A.health&&A.health.running)?"disabled":""} onclick="checkAll()">✔ Check all</button><button class="ghost" onclick="A.ann=!A.ann;A.annArm=false;render()">📣 Announce</button><button class="ghost" onclick="exportCsv()">⬇ Export CSV</button></div></div>`;
  const main=`<div>${announcePanel()}${healthPanel()}
    <div class="chips" role="tablist">${tabs.map(t=>`<button class="chip ${A.tab===t[0]?"on":""}" role="tab" aria-selected="${A.tab===t[0]}" onclick="A.tab='${t[0]}';A.arm='';render()">${t[1]}<b>${t[2]}</b></button>`).join("")}</div>
    <div class="sortrow"><div class="search"><i>🔎</i><input id="q" type="search" placeholder="Search name, email, code or note ( / )" value="${esc(A.q)}" oninput="A.q=this.value;render()"></div><select aria-label="Sort" onchange="A.sort=this.value;render()"><option value="new" ${A.sort==="new"?"selected":""}>Newest</option><option value="old" ${A.sort==="old"?"selected":""}>Oldest</option><option value="name" ${A.sort==="name"?"selected":""}>Name A-Z</option></select></div>
    ${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty"><div class="big">${A.tab==="pending"&&!q?"🎉":"🍽️"}</div><p><b>${q?"No matches":A.tab==="pending"?"All caught up":"Nothing here yet"}</b></p><p class="mu">${q?"Try a different name, email or code.":A.tab==="pending"?"New mess requests will show up here.":"Messes will appear here as you manage them."}</p></div>`}</div>`;
  return `<div class="layout">${aside}${main}</div>`;

/* ---- Insights view ---- */
function requestsChart(){
  const days=[],now=new Date();now.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){const d=new Date(now);d.setDate(d.getDate()-i);days.push({d:d,n:0})}
  A.list.forEach(m=>{const t=new Date(m.createdAt);if(isNaN(t))return;t.setHours(0,0,0,0);const k=days.find(x=>x.d.getTime()===t.getTime());if(k)k.n++});
  const max=Math.max(1,...days.map(x=>x.n)),bw=16,gap=4.6,H=70;
  const bars=days.map((x,i)=>{const h=Math.max(2,Math.round(x.n/max*H));const X=i*(bw+gap)+2;return `<rect class="${x.n?"":"z"}" x="${X}" y="${H-h+4}" width="${bw}" height="${h}" rx="3"><title>${esc(x.d.toLocaleDateString())}: ${x.n}</title></rect>${x.n?`<text x="${X+bw/2}" y="${H-h+1}" text-anchor="middle">${x.n}</text>`:""}`}).join("");
  const total=days.reduce((s,x)=>s+x.n,0);
  return `<h3>Requests, last 14 days</h3><p class="sub" style="margin:0">${total} request${total===1?"":"s"}</p><svg class="chart" viewBox="0 0 290 94" role="img" aria-label="Requests per day for the last 14 days">${bars}<text x="2" y="92">${esc(days[0].d.toLocaleDateString(undefined,{month:"short",day:"numeric"}))}</text><text x="288" y="92" text-anchor="end">Today</text></svg>`;
}
function insightsView(){
  const L=A.list,tot=L.length;

  const sum=k=>stats.reduce((a,x)=>a+(Number(x.s[k])||0),0);
  const liveN=L.filter(m=>m.status==="active"||m.status==="suspended").length;
  const top=stats.slice().sort((a,b)=>(b.s.members||0)-(a.s.members||0)).slice(0,6),topMax=Math.max(1,...top.map(x=>x.s.members||0));
  const totals=stats.length?`<div class="tot"><div><b>${num(sum("members"))}</b><span>Members</span></div><div><b>${num(sum("mealDays"))}</b><span>Meal days logged</span></div><div><b>${num(sum("paid"))}</b><span>Collected</span></div><div><b>${num(sum("bought"))}</b><span>Spent on bazar</span></div><div><b>${num(sum("stories"))}</b><span>Live stories</span></div></div><p class="sub" style="margin:10px 0 0">Based on ${stats.length} of ${liveN} approved messes.</p>`:`<p class="sub" style="margin:6px 0 0">Run a check to see member, meal and money totals across every mess.</p>`;
  return `<div class="layout"><div class="aside"><div class="panel"><h3>Platform totals</h3>${totals}<div class="acts" style="margin-top:12px"><button class="ghost" ${A.busy||(A.health&&A.health.running)?"disabled":""} onclick="checkAll().then(()=>{A.view='insights';render()})">${stats.length?"Refresh numbers":"✔ Check all messes"}</button></div></div>${healthPanel()}</div>
  <div><div class="panel">${requestsChart()}</div>
  <div class="panel"><h3>Status split</h3><div class="split" role="img" aria-label="Messes by status">${split.map(x=>`<i style="width:${x.n/tot*100}%;background:${COLORS[x.s]}" title="${esc(x.s)}: ${x.n}"></i>`).join("")}</div><div class="legend">${split.map(x=>`<span style="--c:${COLORS[x.s]}">${esc(x.s)} ${x.n}</span>`).join("")||"No messes yet"}</div></div>
  <div class="panel"><h3>Biggest messes</h3>${top.length?`<ul class="rank">${top.map(x=>`<li><span class="n">${esc(x.m.name)}</span><span class="bar2"><i style="width:${(x.s.members||0)/topMax*100}%"></i></span><b>${num(x.s.members)}</b></li>`).join("")}</ul>`:`<p class="sub" style="margin:6px 0 0">Appears after a check.</p>`}</div></div></div>`;
}
/* ---- Activity view ---- */
const ICON={request:"📨",approve:"✅",reject:"🚫",suspend:"⏸",resume:"▶️",delete:"🗑",repair:"🛠",password:"🔑",edit:"✏️",email:"✉️",announce:"📣",passkey:"🔐"};
const TXT={request:"New request",approve:"Approved",reject:"Rejected",suspend:"Suspended",resume:"Resumed",delete:"Deleted",repair:"Repaired",password:"Password reset",edit:"Edited",email:"Emailed admin",announce:"Announcement sent",passkey:"Passkey changed"};
function activityView(){
  let body;
  if(A.logBusy&&!A.log)body=`<p class="info"><span class="spin"></span>Loading activity…</p>`;
  else if(!A.log||!A.log.length)body=`<div class="empty"><div class="big">🕘</div><p><b>No activity yet</b></p><p class="mu">Approvals, edits and other actions you take will be listed here.</p></div>`;
  else body=`<ul class="log">${A.log.map(e=>`<li><span class="ic">${ICON[e.action]||"•"}</span><div class="tx"><b>${esc(TXT[e.action]||e.action)}${e.name?" · "+esc(e.name):""}</b><small>${esc(e.detail||"")}${e.detail?" · ":""}${esc(ago(e.time))}</small></div></li>`).join("")}</ul>`;
  return `<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Activity</h3><button class="ghost mini" ${A.logBusy?"disabled":""} onclick="loadLog()">↻ Refresh</button></div>${body}</div>`;
}
function render(){
  const a=$("#app"),f=document.activeElement,keep=f&&["q","pk","npk","npk2","dc","en","ee","enote","es","eb","as","ab"].includes(f.id)?{id:f.id,s:f.selectionStart}:null;
  const pend=A.list.filter(m=>m.status==="pending").length;
  if(A.step==="in")document.title=(pend?"("+pend+") ":"")+"Mess admin";
  if(A.step==="login")a.innerHTML=`<div class="gate"><div class="gatecard"><div class="gatehead"><div class="lock">🔐</div><h1>Site owner</h1><p>Approve and manage every mess.</p></div>
  <div class="gatebody"><input id="pk" type="password" autocomplete="current-password" placeholder="Owner passkey" value="${esc(A.pkIn)}" oninput="A.pkIn=this.value" onkeydown="if(event.key==='Enter')login()"><div class="err" role="status">${esc(A.msg)}</div><button style="width:100%;padding:13px" onclick="login()" ${A.busy?"disabled":""}>${A.busy?"Checking…":"Unlock"}</button></div></div></div>`;
  else{
    const views=[["messes","🍽️","Messes"],["insights","📊","Insights"],["activity","🕘","Activity"]];
    a.innerHTML=`<div class="bar"><div class="top"><div><h1>Mess admin${pend?`<span class="pill" title="Pending requests">${pend}</span>`:""}</h1>${A.updated?`<p class="upd">Updated ${esc(hm(A.updated))}</p>`:""}</div><div class="icons"><button class="ghost" aria-label="Refresh" onclick="refresh()">↻</button><button class="ghost" aria-label="Switch light or dark theme" onclick="toggleTheme()">🌓</button><button class="ghost" aria-label="Settings" onclick="A.set=!A.set;render()">⚙</button><button class="ghost" onclick="signOut()" aria-label="Sign out">⎋<span class="lbl"> Sign out</span></button></div></div></div>
    <div style="height:12px"></div>
    <nav class="seg" role="tablist" aria-label="Sections">${views.map(v=>`<button role="tab" class="${A.view===v[0]?"on":""}" aria-label="${v[2]}" title="${v[2]}" aria-selected="${A.view===v[0]}" onclick="setView('${v[0]}')">${v[1]}<span class="lbl"> ${v[2]}</span></button>`).join("")}</nav>
    ${A.set?`<div class="setcard"><h3>Change passkey</h3><p class="sub">This is the passkey you use to open this panel.</p><input id="npk" type="password" autocomplete="new-password" placeholder="New passkey (6+ characters)" value="${esc(A.npk)}" oninput="A.npk=this.value"><input id="npk2" type="password" autocomplete="new-password" placeholder="Repeat new passkey" value="${esc(A.npk2)}" oninput="A.npk2=this.value" onkeydown="if(event.key==='Enter')savePasskey()"><div class="acts"><button ${A.busy?"disabled":""} onclick="savePasskey()">Save passkey</button><button class="ghost" onclick="A.set=false;A.npk=A.npk2='';render()">Cancel</button></div></div>`:""}
    ${noteBox()}
    ${A.view==="messes"?messesView():A.view==="insights"?insightsView():activityView()}`;
  }
  if(keep){const e=document.getElementById(keep.id);if(e){e.focus();try{e.setSelectionRange(keep.s,keep.s)}catch(_){}}}
}
document.addEventListener("keydown",e=>{
  if(A.step!=="in")return;
  const t=e.target&&e.target.tagName;
  if(e.key==="/"&&t!=="INPUT"&&t!=="TEXTAREA"&&t!=="SELECT"){const q=document.getElementById("q");if(q){e.preventDefault();q.focus()}}
  else if(e.key==="Escape"&&(A.arm||A.annArm)){cancel()}
});
render();
</script></body></html>
