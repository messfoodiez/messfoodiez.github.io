<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mess Meal Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#1b2433;--mu:#6b778c;--bd:#dfe4ee;--pr:#1f3a68;--ac:#c9a227;--ok:#1a8f5a;--bad:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f141d;--card:#18202d;--tx:#e8edf5;--mu:#93a0b5;--bd:#2a3547;--pr:#6f93d6;--ac:#e0b93a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(135deg,#142a4d,#1f3a68);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:17px;margin:0;flex:1}header small{opacity:.75;display:block;font-weight:400;font-size:12px}
main{max-width:980px;margin:0 auto;padding:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--pr);text-transform:uppercase;letter-spacing:.6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px}.stat b{display:block;font-size:20px}.stat span{color:var(--mu);font-size:12px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{font-size:12px;color:var(--mu);text-transform:uppercase}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}
button,input,select,textarea{font:inherit;color:var(--tx)}input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;max-width:100%}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}button.g{background:transparent;border:1px solid currentColor;color:inherit}button.d{background:var(--bad)}button:disabled{opacity:.5}header button.g{color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.upd{background:#fff4d6;color:#4d3a00;border:1px solid var(--ac);border-left-width:5px;border-radius:10px;padding:10px 12px;margin-bottom:10px;white-space:pre-wrap}.upd small{display:block;opacity:.7}
.warn{background:#fdecea;color:#7a1f16;border:1px solid var(--bad);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.login{max-width:380px;margin:12vh auto;text-align:center}.login h1{color:var(--pr)}
.mrow{display:grid;grid-template-columns:1fr repeat(3,auto);gap:10px;padding:7px 0;border-bottom:1px solid var(--bd);align-items:center}.mrow label{display:flex;gap:4px;align-items:center;font-size:13px}.mu{color:var(--mu);font-size:13px}

/* Skeleton */
.skel{position:relative;overflow:hidden;background:var(--bd);border-radius:6px;display:inline-block;vertical-align:middle}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(90deg,transparent 0,color-mix(in srgb,var(--card) 70%,transparent) 50%,transparent 100%);
  animation:shimmer 1.25s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.skel-line{height:12px;width:100%;margin:6px 0}
.skel-line.sm{height:10px}.skel-line.lg{height:18px}.skel-line.xl{height:26px}
.skel-pill{height:28px;width:90px;border-radius:999px}
.skel-btn{height:34px;width:120px;border-radius:8px}
.skel-input{height:36px;width:100%;border-radius:8px}
.skel-tab{height:32px;width:96px;border-radius:8px}
.skel-stat{height:64px;width:100%;border-radius:10px}
.skel-row{display:grid;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);align-items:center}
.skel-tbl{display:grid;gap:8px;margin-top:6px}
.skel-w{90%}.skel-w-md{60%}.skel-w-sm{40%}
</style></head><body>
<div id="app"></div>
<script>
// PASTE your Google Apps Script web app URL (ends with /exec) here:
const API_URL="https://script.google.com/macros/s/AKfycbzo18fKwQ4nbtXo_O9BgPlHGL3y96maVa9CYUgQS4azUlze96pGEKWMTtPskOqerSZ6Rg/exec";

// NOTE: Breakfast counts as HALF a meal (0.5), Lunch & Dinner count as 1 each.
const MEAL_WEIGHTS=[0.5,1,1];

let S={members:[],payments:[],buys:[],meals:{},updates:[]},
    role=null,tab="dash",loaded=false,busy=false,msg="",PW="",md=null,
    verifyingAdmin=false;

const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date()),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const canEdit=d=>d<=today()&&d>=ago(2);

/* Skeleton helpers */
const skelLine=(w="")=>`<div class="skel skel-line ${w}"></div>`;
const skelStats=()=>`<div class="grid">${Array.from({length:4}).map(()=>`<div class="skel skel-stat"></div>`).join("")}</div>`;
const skelTable=(cols=5,rows=4)=>`<div class="skel-tbl">${Array.from({length:rows}).map(()=>`<div class="skel-row" style="grid-template-columns:repeat(${cols},1fr)">${Array.from({length:cols}).map(()=>`<div class="skel skel-line"></div>`).join("")}</div>`).join("")}</div>`;
const skelTabs=()=>`<div class="tabs">${Array.from({length:6}).map(()=>`<div class="skel skel-tab"></div>`).join("")}</div>`;
const skelUpdate=()=>`<div class="upd" style="background:var(--card);border-style:dashed"><div class="skel skel-line lg skel-w-md"></div><div class="skel skel-line sm skel-w-sm" style="margin-top:8px"></div></div>`;
const skelCard=(body="")=>`<div class="card"><div class="skel skel-line lg skel-w-sm" style="margin-bottom:12px"></div>${body}</div>`;

function skelDashboard(){
  const adm=role==="admin";
  return `<header><h1>Mess Meal Manager<small>${adm?"Administrator console":"Member view"}</small></h1><button class="g" onclick="signOut()">Sign out</button></header><main>
    ${skelUpdate()}${skelUpdate()}
    ${adm?skelTabs():""}
    ${skelCard(skelStats())}
    ${skelCard(skelTable(5,4))}
  </main>`;
}

async function api(body){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});return r.json()}

async function load(){
  try{
    const r=await fetch(API_URL),j=await r.json();
    if(j.state)S=Object.assign({members:[],payments:[],buys:[],meals:{},updates:[]},j.state);
    msg="";
  }catch(e){
    msg="Could not load data. Check API_URL and that the web app is deployed to 'Anyone'.";
  }
  loaded=true;
}

async function save(){
  busy=true;msg="Saving…";render();
  try{
    const j=await api({password:PW,state:S});
    msg=j.ok?"":"Save failed: "+(j.error||"unknown error");
  }catch(e){msg="Save failed: network error. Try again."}
  busy=false;render();
}

/* Continue as Member — wait for data before switching views */
async function continueAsMember(){
  role="user";
  if(!loaded){
    render(); // shows skeleton dashboard
    await load();
  }
  render();
}

function signOut(){
  role=null;PW="";tab="dash";msg="";md=null;busy=false;verifyingAdmin=false;
  // Force reload on next sign-in if you want; keeping cache is fine:
  render();
}

function calc(){
  const tb=S.buys.reduce((a,b)=>a+b.amt,0);
  const rows=S.members.map(m=>{
    let meals=0;
    Object.values(S.meals).forEach(d=>{
      const arr=d[m.id]||[0,0,0];
      meals += (arr[0]?MEAL_WEIGHTS[0]:0) + (arr[1]?MEAL_WEIGHTS[1]:0) + (arr[2]?MEAL_WEIGHTS[2]:0);
    });
    const paid=S.payments.filter(p=>p.mid===m.id).reduce((a,p)=>a+p.amt,0);
    return{m,meals,paid};
  });
  const tm=rows.reduce((a,r)=>a+r.meals,0),rate=tm?tb/tm:0;
  rows.forEach(r=>{r.cost=rate*r.meals;r.refund=r.paid-r.cost});
  return{tb,tm,rate,rows};
}

function report(c){
  return `<div class="tw"><table>
    <tr><th>Member</th><th>Meals</th><th>Overall Cost (each user)</th><th>Paid</th><th>Refund / Due</th></tr>
    ${c.rows.map(x=>`<tr><td>${esc(x.m.name)}</td><td>${fmt(x.meals)}</td><td>${fmt(x.cost)}</td><td>${fmt(x.paid)}</td><td class="${x.refund>=0?"pos":"neg"}">${x.refund>=0?"Refund ":"Due "}${fmt(Math.abs(x.refund))}</td></tr>`).join("")||'<tr><td colspan=5 class="mu">No members</td></tr>'}
  </table></div>`;
}
function summary(c){return `<div class="grid">
  <div class="stat"><span>Total buying cost</span><b>${fmt(c.tb)}</b></div>
  <div class="stat"><span>Total meals</span><b>${fmt(c.tm)}</b></div>
  <div class="stat"><span>Meal rate</span><b>${fmt(c.rate)}</b></div>
  <div class="stat"><span>Members</span><b>${S.members.length}</b></div></div>`}

function mealsTab(){
  const d=md||today(),ok=canEdit(d),cur=S.meals[d]||{};
  return `<div class="card"><h2>Daily meals</h2>
  <div class="row"><input type="date" id="md" value="${d}" max="${today()}" min="${ago(2)}" onchange="md=this.value;render()">
  <span class="mu">${ok?"Open for entry":"Locked: meals can only be added on the day or within 2 days after."} · Breakfast = ½ meal</span></div>
  ${S.members.map(m=>{const v=cur[m.id]||[0,0,0];
    return `<div class="mrow"><span>${esc(m.name)}</span>${["Breakfast (½)","Lunch","Dinner"].map((n,i)=>
      `<label><input type="checkbox" data-m="${m.id}" data-i="${i}" ${v[i]?"checked":""} ${ok?"":"disabled"}>${n}</label>`).join("")}</div>`
  }).join("")||'<p class="mu">Add members first.</p>'}
  ${ok&&S.members.length?'<div class="row" style="margin-top:12px"><button onclick="saveMeals()" '+(busy?"disabled":"")+'>Save meals for this day</button></div>':""}</div>`;
}
function saveMeals(){
  const d=$("#md").value;if(!canEdit(d))return;
  const o={};
  S.members.forEach(m=>o[m.id]=[0,1,2].map(i=>$(`[data-m="${m.id}"][data-i="${i}"]`).checked?1:0));
  S.meals[d]=o;save();
}

function membersTab(){
  return `<div class="card"><h2>Members</h2>
  <div class="row"><input id="nm" placeholder="Member name"><button onclick="addM()">Add member</button></div>
  ${S.members.map(m=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--bd);padding:6px 0"><span>${esc(m.name)}</span><button class="d" onclick="delM('${m.id}')">Remove</button></div>`).join("")||'<p class="mu">No members yet.</p>'}</div>`;
}
function addM(){const n=$("#nm").value.trim();if(!n)return;S.members.push({id:uid(),name:n});save()}
function delM(id){if(!confirm("Remove this member along with their meals and payments?"))return;
  S.members=S.members.filter(m=>m.id!==id);
  S.payments=S.payments.filter(p=>p.mid!==id);
  Object.values(S.meals).forEach(d=>delete d[id]);
  save();
}

/* Payment date is fixed to today — no manual date input */
function payTab(){
  const d=today();
  return `<div class="card"><h2>Payments</h2>
  <div class="row">
    <select id="pm">${S.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select>
    <input id="pa" type="number" min="0" step="any" placeholder="Amount">
    <input type="date" value="${d}" readonly disabled title="Date is set automatically">
    <button onclick="addP()">Add payment (today)</button>
  </div>
  <div class="tw"><table><tr><th>Date</th><th>Member</th><th>Amount</th><th></th></tr>
  ${[...S.payments].reverse().map(p=>`<tr><td>${p.date}</td><td>${esc((S.members.find(m=>m.id===p.mid)||{}).name||"-")}</td><td>${fmt(p.amt)}</td><td><button class="g" onclick="delItem('payments','${p.id}')">Delete</button></td></tr>`).join("")}
  </table></div></div>`;
}
function addP(){
  const a=parseFloat($("#pa").value);
  if(!(a>0)||!$("#pm").value)return;
  S.payments.push({id:uid(),mid:$("#pm").value,amt:a,date:today()});
  save();
}

function buyTab(){
  return `<div class="card"><h2>Buying cost</h2>
  <div class="row"><input id="bn" placeholder="Item / note"><input id="ba" type="number" min="0" step="any" placeholder="Cost"><input id="bd" type="date" value="${today()}"><button onclick="addB()">Add cost</button></div>
  <div class="tw"><table><tr><th>Date</th><th>Note</th><th>Cost</th><th></th></tr>
  ${[...S.buys].reverse().map(p=>`<tr><td>${p.date}</td><td>${esc(p.note||"-")}</td><td>${fmt(p.amt)}</td><td><button class="g" onclick="delItem('buys','${p.id}')">Delete</button></td></tr>`).join("")}
  </table></div></div>`;
}
function addB(){const a=parseFloat($("#ba").value);if(!(a>0))return;S.buys.push({id:uid(),note:$("#bn").value.trim(),amt:a,date:$("#bd").value});save()}
function delItem(k,id){S[k]=S[k].filter(x=>x.id!==id);save()}

function updTab(){
  const n=S.updates.length;
  return `<div class="card"><h2>Updates (${n}/2)</h2>
  <div class="row"><textarea id="ut" rows="2" style="flex:1;min-width:200px" placeholder="Write an update for everyone"></textarea><button onclick="addU()">Add update</button></div>
  ${n>=2?'<p class="mu">Limit reached: delete one update to add a new one.</p>':""}
  ${S.updates.map(u=>`<div class="upd">${esc(u.text)}<small>${u.date}</small><div class="row" style="margin:8px 0 0"><button class="g" onclick="editU('${u.id}')">Edit</button><button class="d" onclick="delU('${u.id}')">Delete</button></div></div>`).join("")}</div>`;
}
function addU(){const t=$("#ut").value.trim();if(!t)return;
  if(S.updates.length>=2){alert("Only 2 updates allowed. Delete one first.");return}
  S.updates.push({id:uid(),text:t,date:today()});save();}
function editU(id){const u=S.updates.find(x=>x.id===id),t=prompt("Edit update",u.text);
  if(t===null||!t.trim())return;u.text=t.trim();u.date=today();save();}
function delU(id){if(confirm("Delete this update?")){S.updates=S.updates.filter(u=>u.id!==id);save();}}

function login(){
  return `<div class="login card"><h1>Mess Meal Manager</h1>
  <p class="mu">Track meals, costs and refunds for your mess.</p>
  <button style="width:100%;margin-bottom:14px" onclick="continueAsMember()">Continue as Member (view only)</button>
  <hr style="border:0;border-top:1px solid var(--bd)">
  <p class="mu" style="margin-top:14px">Administrator sign-in</p>
  <div class="row" style="justify-content:center">
    <input id="pw" type="password" placeholder="Admin password" onkeydown="if(event.key==='Enter')adminLogin()">
    <button onclick="adminLogin()" ${busy?"disabled":""}>Sign in</button>
  </div>
  <div class="neg">${esc(msg)}</div></div>`;
}

/* 1. Verify password (no skeleton here — just disable button)
   2. If OK → role=admin, then load data with skeleton dashboard shown. */
async function adminLogin(){
  const p=$("#pw").value;if(!p)return;
  busy=true;msg="";verifyingAdmin=true;render();
  try{
    const j=await api({action:"check",password:p});
    if(j.ok){
      PW=p;role="admin";loaded=false;  // force skeleton dashboard during initial fetch
      render();                        // draws skeleton
      await load();                    // fetch data
      render();                        // draws real dashboard
    } else {
      msg="Incorrect password.";
    }
  }catch(e){
    msg="Network error. Check API_URL.";
  }
  busy=false;verifyingAdmin=false;render();
}

function render(){
  const a=$("#app");

  // Not signed in → show login (button disabled while verifying)
  if(!role){
    a.innerHTML = login();
    return;
  }

  // Signed in but data not loaded → skeleton dashboard
  if(!loaded){
    a.innerHTML = skelDashboard() + (msg?`<main><div class="warn">${esc(msg)}</div></main>`:"");
    return;
  }

  const c=calc(),adm=role==="admin";
  const tabs=[["dash","Dashboard"],["upd","Updates"],["meals","Meals"],["members","Members"],["pay","Payments"],["buy","Buying cost"]];

  a.innerHTML = `<header>
    <h1>Mess Meal Manager<small>${adm?"Administrator console":"Member view"}</small></h1>
    <button class="g" onclick="signOut()">Sign out</button>
  </header><main>
  ${msg?`<div class="warn">${esc(msg)}</div>`:""}
  ${(!adm||tab==="dash")?S.updates.map(u=>`<div class="upd"><b>Update</b>${esc(u.text)? " · ":""}${esc(u.text)}<small>${u.date}</small></div>`).join(""):""}
  ${adm?`<div class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}</div>`:""}
  ${!adm||tab==="dash"?`
    <div class="card"><h2>Overview</h2>${summary(c)}</div>
    <div class="card"><h2>Overall cost &amp; refund</h2>${report(c)}</div>`:""}
  ${adm&&tab==="upd"?updTab():""}
  ${adm&&tab==="meals"?mealsTab():""}
  ${adm&&tab==="members"?membersTab():""}
  ${adm&&tab==="pay"?payTab():""}
  ${adm&&tab==="buy"?buyTab():""}
  </main>`;
}

render();

// Background refresh for members (and admin when not busy)
setInterval(()=>{if(role!=="admin"&&!busy){load().then(render)}},30000);
</script></body></html>
