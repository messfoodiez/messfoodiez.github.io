async function api(body){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});return r.json()}

async function load(){
  try{
    const r=await fetch(API_URL),j=await r.json();
    if(j.state)S=Object.assign({members:[],payments:[],buys:[],meals:{},updates:[],calculation:null,calculationHistory:[],monthCalculations:{},chartSettings:{metric:"meals",period:"all"}},j.state);
    S.chartSettings=Object.assign({metric:"meals",period:"all"},S.chartSettings||{});
    if(S.calculation&&(!Array.isArray(S.calculationHistory)||!S.calculationHistory.length)){S.calculationHistory=[Object.assign({id:uid(),type:"overall",month:null},JSON.parse(JSON.stringify(S.calculation)))];}
    msg="";
  }catch(e){
    msg="Could not load data. Check API_URL and that the web app is deployed to 'Anyone'.";
  }
  loaded=true;
}

async function save(){
  busy=true;msg="Saving…";render();
  try{
    const j=await api({password:PW,state:S});
    msg=j.ok?"":"Save failed: "+(j.error||"unknown error");
  }catch(e){msg="Save failed: network error. Try again."}
  busy=false;render();
}

/* Continue as Member — wait for data before switching views */
async function continueAsMember(){
  role="user";
  if(!loaded){
    render(); // shows skeleton dashboard
    await load();
  }
  render();
}

function signOut(){
  role=null;PW="";tab="dash";msg="";md=null;busy=false;verifyingAdmin=false;
  // Force reload on next sign-in if you want; keeping cache is fine:
  render();
}

function buildCalculation(month=null){
  const inMonth=d=>!month||(typeof d==="string"&&d.slice(0,7)===month);
  const buys=S.buys.filter(b=>inMonth(b.date));
  const tb=buys.reduce((a,b)=>a+(Number(b.amt)||0),0);
  const mealDates=Object.entries(S.meals).filter(([d])=>inMonth(d));
  const rows=S.members.map(m=>{
    let meals=0;
    mealDates.forEach(([,d])=>{
      const arr=d[m.id]||[0,0,0];
      meals+=(arr[0]?MEAL_WEIGHTS[0]:0)+(arr[1]?MEAL_WEIGHTS[1]:0)+(arr[2]?MEAL_WEIGHTS[2]:0);
    });
    const paid=S.payments.filter(p=>p.mid===m.id&&inMonth(p.date)).reduce((a,p)=>a+(Number(p.amt)||0),0);
    return {mid:m.id,name:m.name,meals,paid};
  });
  const tm=rows.reduce((a,r)=>a+r.meals,0),rate=tm?tb/tm:0;
  rows.forEach(r=>{r.cost=rate*r.meals;r.refund=r.paid-r.cost});
  return {id:uid(),type:month?"monthly":"overall",month:month||null,tb,tm,rate,rows,calculatedAt:new Date().toISOString()};
}

function computeCalculation(){return buildCalculation(null)}

/* Overall totals and member balances are always live; Calculate only saves a snapshot. */
function calc(){
  const live=buildCalculation(null);
  const rows=live.rows.map(r=>({m:{id:r.mid,name:r.name},meals:r.meals,paid:r.paid,cost:r.cost,refund:r.refund}));
  return {tb:live.tb,tm:live.tm,rate:live.rate,rows,calculated:true,calculatedAt:S.calculation?.calculatedAt||null,live:true};
}

function addHistory(snapshot){
  if(!Array.isArray(S.calculationHistory))S.calculationHistory=[];
  S.calculationHistory.unshift(JSON.parse(JSON.stringify(snapshot)));
  // Keep the most recent 100 snapshots to keep the saved state manageable.
  S.calculationHistory=S.calculationHistory.slice(0,100);
}

function confirmCalculate(){
  if(role!=="admin")return;
  if(!confirm("Are You Sure?"))return;
  S.calculation=computeCalculation();
  addHistory(S.calculation);
  save();
}

function monthLabel(month){
  if(!month)return "All-time";
  const [y,m]=month.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
}

function calculateMonth(){
  if(role!=="admin")return;
  const month=$("#reportMonth")?.value;
  if(!month){alert("Choose a month first.");return}
  if(!confirm(`Are You Sure? Calculate the report for ${monthLabel(month)}?`))return;
  const snapshot=buildCalculation(month);
  if(!S.monthCalculations||typeof S.monthCalculations!=="object")S.monthCalculations={};
  S.monthCalculations[month]=snapshot;
  addHistory(snapshot);
  save();
}

function monthDates(month){
  const [yy,mm]=month.split("-").map(Number),last=new Date(yy,mm,0).getDate();
  const end=month===today().slice(0,7)?Number(today().slice(8,10)):last;
  return Array.from({length:end},(_,i)=>`${month}-${String(i+1).padStart(2,"0")}`);
}
function dayHasMeals(date){
  const d=S.meals[date]; if(!d||typeof d!=="object")return false;
  return Object.values(d).some(a=>Array.isArray(a)&&a.some(Boolean));
}
function missingRecords(month){
  return monthDates(month).map(date=>({date,meal:dayHasMeals(date),expense:S.buys.some(b=>b.date===date)}))
    .filter(x=>!x.meal||!x.expense);
}
function rawMonthSummary(month){
  const c=buildCalculation(month),dates=monthDates(month),missing=missingRecords(month);
  return {month,tb:c.tb,tm:c.tm,rate:c.rate,paid:c.rows.reduce((a,r)=>a+r.paid,0),mealDays:dates.filter(dayHasMeals).length,
    expenseDays:dates.filter(d=>S.buys.some(b=>b.date===d)).length,missing};
}
function monthShift(month,delta){const [y,m]=month.split("-").map(Number);const d=new Date(y,m-1+delta,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}

function showReminderNow(){
  if(role!=="admin")return;
  const t=today(),month=t.slice(0,7),parts=[];
  if(!dayHasMeals(t))parts.push("Today's meals have not been entered.");
  if(!S.buys.some(b=>b.date===t))parts.push("No buying-cost/expense entry is recorded for today (this may be normal).");
  const tomorrow=new Date();tomorrow.setDate(tomorrow.getDate()+1);
  if(tomorrow.getMonth()!==new Date().getMonth()&&!((S.monthCalculations||{})[month]))parts.push("Month-end is here: calculate and save the final monthly report.");
  alert(parts.length?parts.join("\n\n"):"No reminders right now. All set for today.");
}
function runAdminReminders(){
  if(role!=="admin"||!loaded)return;
  const t=today(),month=t.slice(0,7),key="messReminder:"+t;
  if(sessionStorage.getItem(key))return;
  const parts=[];
  if(!dayHasMeals(t))parts.push("Reminder: enter today's meals.");
  const d=new Date(),lastDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  if(!((S.monthCalculations||{})[month])&&d.getDate()===lastDay)parts.push("Month-end reminder: calculate and save this month's final report.");
  if(parts.length){setTimeout(()=>{if(role==="admin")alert(parts.join("\n\n"));},350);}
  sessionStorage.setItem(key,"1");
}
function downloadMonthlyCsv(month){
  const c=buildCalculation(month),sum=rawMonthSummary(month);
  const rows=[["Month",month],["Total buying cost",sum.tb],["Total meals",sum.tm],["Meal rate",sum.rate],["Total payments",sum.paid],["Days with meals",sum.mealDays],["Days with buying cost",sum.expenseDays],["Member","Meals","Cost","Paid","Refund / Due"],...c.rows.map(r=>[r.name,r.meals,r.cost,r.paid,r.refund])];
  const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));a.download=`mess-summary-${month}.csv`;a.click();URL.revokeObjectURL(a.href);
}

const CHART_METRICS={
  meals:{label:"Meals by member",kind:"members",field:"meals",title:"Meal share by member",unit:"meals"},
  paid:{label:"Payments by member",kind:"members",field:"paid",title:"Payments by member",unit:"currency"},
  cost:{label:"Overall cost by member",kind:"members",field:"cost",title:"Overall cost by member",unit:"currency"},
  refund:{label:"Refund balance by member",kind:"members",field:"refundPositive",title:"Positive balance by member",unit:"currency"},
  buying:{label:"Buying cost by item",kind:"buys",field:"amt",title:"Buying cost by item",unit:"currency"}
};
function chartValues(metric,period){
  const cfg=CHART_METRICS[metric]||CHART_METRICS.meals;
  if(cfg.kind==="buys"){
    const rows=S.buys.filter(b=>period==="all"||String(b.date||"").slice(0,7)===period).map((b,i)=>({label:(b.note||"Buying cost")+(S.buys.filter(x=>x.id===b.id).length>1?"":""),value:Number(b.amt)||0}));
    // Add an index to repeated item names so each expense entry remains inspectable.
    const seen={}; rows.forEach(r=>{seen[r.label]=(seen[r.label]||0)+1;if(seen[r.label]>1)r.label+=" ("+seen[r.label]+")";});
    return {title:cfg.title,unit:cfg.unit,rows:rows.filter(r=>r.value>0)};
  }
  const c=buildCalculation(period==="all"?null:period);
  let rows=c.rows.map(r=>({label:r.name,value:Math.max(0,Number(cfg.field==="refundPositive"?r.refund:r[cfg.field])||0)}));
  if(metric==="refund") rows=rows.filter(r=>r.value>0);
  return {title:cfg.title,unit:cfg.unit,rows:rows.filter(r=>r.value>0)};
}
function chartsTab(){
  const cfg=S.chartSettings||{metric:"meals",period:"all"};
  const month=today().slice(0,7),period=cfg.period||"all";

    ${data.rows.length?`<div class="chart-wrap"><canvas id="pieChartCanvas" aria-label="${esc(data.title)} pie chart" role="img"></canvas></div>`:`<div class="report-empty">There is no recorded data for this chart and period yet.</div>`}
    <p class="chart-note">Hover or tap a slice to see its label and value. ${data.unit==="currency"?"Amounts use the same currency units as your records.":"Breakfast counts as half a meal."}</p>

  return `<div class="card"><h2>Members</h2>
  <div class="row"><input id="nm" placeholder="Member name" aria-label="Member name"><button onclick="addM()">Add member</button></div>
  ${S.members.map(m=>`<div class="member-list-row"><span class="member-name">${esc(m.name)}</span><button class="d remove-small" onclick="delM('${m.id}')">Remove</button></div>`).join("")||'<p class="mu">No members yet.</p>'}</div>`;
}
function delM(id){if(!confirm("Are you Sure?"))return;
  S.members=S.members.filter(m=>m.id!==id);
  S.payments=S.payments.filter(p=>p.mid!==id);
  Object.values(S.meals).forEach(d=>delete d[id]);
  save();
}
function addM(){const n=$("#nm").value.trim();if(!n)return;S.members.push({id:uid(),name:n});save()}

/* Payment date is fixed to today — no manual date input */
function payTab(){
  const d=today();
  return `<div class="card"><h2>Payments</h2>
  <div class="row">
    <select id="pm">${S.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select>
    <input id="pa" type="number" min="0" step="any" placeholder="Amount">
    <input type="date" value="${d}" readonly disabled title="Date is set automatically">
    <button onclick="addP()">Add payment (today)</button>
  </div>
  <div class="tw"><table><tr><th>Date</th><th>Member</th><th>Amount</th><th></th></tr>
  ${[...S.payments].reverse().map(p=>`<tr><td data-label="Date">${p.date}</td><td data-label="Member">${esc((S.members.find(m=>m.id===p.mid)||{}).name||"-")}</td><td data-label="Amount">${fmt(p.amt)}</td><td data-label="Action"><button class="g" onclick="delItem('payments','${p.id}')">Delete</button></td></tr>`).join("")}
  </table></div></div>`;
}
function addP(){
  const a=parseFloat($("#pa").value);
  if(!(a>0)||!$("#pm").value)return;
  S.payments.push({id:uid(),mid:$("#pm").value,amt:a,date:today()});
  save();
}

function buyTab(){
  return `<div class="card"><h2>Buying cost</h2>
  <div class="row"><input id="bn" placeholder="Item / note"><input id="ba" type="number" min="0" step="any" placeholder="Cost"><input id="bd" type="date" value="${today()}" readonly disabled title="Date is set automatically to today"><button onclick="addB()">Add cost (today)</button></div>
  <div class="tw"><table><tr><th>Date</th><th>Note</th><th>Cost</th><th></th></tr>
  ${[...S.buys].reverse().map(p=>`<tr><td data-label="Date">${p.date}</td><td data-label="Item / note">${esc(p.note||"-")}</td><td data-label="Cost">${fmt(p.amt)}</td><td data-label="Action"><button class="g" onclick="delItem('buys','${p.id}')">Delete</button></td></tr>`).join("")}
  </table></div></div>`;
}
function addB(){const a=parseFloat($("#ba").value);if(!(a>0))return;S.buys.push({id:uid(),note:$("#bn").value.trim(),amt:a,date:today()});save()}
function delItem(k,id){S[k]=S[k].filter(x=>x.id!==id);save()}

function updTab(){
  const n=S.updates.length;
  return `<div class="card"><h2>Updates (${n}/2)</h2>
  <div class="row"><textarea id="ut" rows="2" style="flex:1;min-width:200px" placeholder="Write an update for everyone"></textarea><button onclick="addU()">Add update</button></div>
  ${n>=2?'<p class="mu">Limit reached: delete one update to add a new one.</p>':""}
  ${S.updates.map(u=>`<div class="upd">${esc(u.text)}<small>${u.date}</small><div class="row" style="margin:8px 0 0"><button class="g" onclick="editU('${u.id}')">Edit</button><button class="d" onclick="delU('${u.id}')">Delete</button></div></div>`).join("")}</div>`;
}
function addU(){const t=$("#ut").value.trim();if(!t)return;
  if(S.updates.length>=2){alert("Only 2 updates allowed. Delete one first.");return}
  S.updates.push({id:uid(),text:t,date:today()});save();}
function editU(id){const u=S.updates.find(x=>x.id===id),t=prompt("Edit update",u.text);
  if(t===null||!t.trim())return;u.text=t.trim();u.date=today();save();}
function delU(id){if(confirm("Delete this update?")){S.updates=S.updates.filter(u=>u.id!==id);save();}}

function login(){
  return `<div class="login card">
  <p class="mu" style="font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px">MESS MANAGEMENT</p>
  <h1>Welcome to your mess.</h1>
  <p class="mu" style="margin:0 0 22px">A simpler way to track daily meals, shared costs and member balances.</p>
  <button style="width:100%;margin-bottom:14px" onclick="continueAsMember()">View dashboard as member <span aria-hidden="true">→</span></button>
  <hr style="border:0;border-top:1px solid var(--bd)">
  <p class="mu" style="margin:0 0 12px;font-weight:750">Administrator sign-in</p>
  <div class="row" style="justify-content:center">
    <input id="pw" type="password" autocomplete="current-password" placeholder="Enter admin password" aria-label="Admin password" onkeydown="if(event.key==='Enter')adminLogin()">
    <button onclick="adminLogin()" ${busy?"disabled":""}>Sign in</button>
  </div>
  <div class="neg" role="status">${esc(msg)}</div></div>`;
}

/* 1. Verify password (no skeleton here — just disable button)
   2. If OK → role=admin, then load data with skeleton dashboard shown. */
async function adminLogin(){
  const p=$("#pw").value;if(!p)return;
  busy=true;msg="";verifyingAdmin=true;render();
  try{
    const j=await api({action:"check",password:p});
    if(j.ok){
      PW=p;role="admin";loaded=false;  // force skeleton dashboard during initial fetch
      render();                        // draws skeleton
      await load();                    // fetch data
      render();                        // draws real dashboard
    } else {
      msg="Incorrect password.";
    }
  }catch(e){
    msg="Network error. Check API_URL.";
  }
  busy=false;verifyingAdmin=false;render();
}

function render(){
  const a=$("#app");

  // Not signed in → show login (button disabled while verifying)
  if(!role){
    a.innerHTML = login();
    return;
  }

  // Signed in but data not loaded → skeleton dashboard
  if(!loaded){
    a.innerHTML = skelDashboard() + (msg?`<main><div class="warn">${esc(msg)}</div></main>`:"");
    return;
  }

  const c=calc(),adm=role==="admin";
  const tabs=[["dash","Dashboard"],["upd","Updates"],["meals","Meals"],["members","Members"],["pay","Payments"],["buy","Buying Cost"],["reports","Monthly Reports"],["charts","Charts"]];
  const visibleTabs=adm?tabs:[["dash","Dashboard"],["charts","Charts"]];

  a.innerHTML = `<header>
    <h1>Mess Meal Manager<small>${adm?"Administrator console":"Member view"}</small></h1>
    <button class="g" onclick="signOut()">Sign out</button>
  </header><main>
  ${msg?`<div class="warn">${esc(msg)}</div>`:""}
  ${(!adm||tab==="dash")?S.updates.map(u=>`<div class="upd"><b>Update</b>${esc(u.text)? " · ":""}${esc(u.text)}<small>${u.date}</small></div>`).join(""):""}
  ${`<div class="tabs">${visibleTabs.map(t=>`<button class="${tab===t[0]?"on":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}</div>`}
  ${tab==="dash"?`
    <div class="card"><h2>Overview</h2>${summary(c)}</div>
    <div class="card"><div class="section-head"><h2 class="overall-title">Overall Cost</h2>${adm?'<button class="calculate-badge" onclick="confirmCalculate()" title="Recalculate meal rate, overall cost and member balances">Calculate</button>':""}</div>${report(c)}</div>`:""}
  ${adm&&tab==="upd"?updTab():""}
  ${adm&&tab==="meals"?mealsTab():""}
  ${adm&&tab==="members"?membersTab():""}
  ${adm&&tab==="pay"?payTab():""}
  ${adm&&tab==="buy"?buyTab():""}
  ${adm&&tab==="reports"?monthlyReportsTab():""}
  ${tab==="charts"?chartsTab():""}
  </main>`;
  drawPieChart();
  if(adm)runAdminReminders();
}

render();

// Background refresh for members (and admin when not busy)
setInterval(()=>{if(role!=="admin"&&!busy){load().then(render)}},30000);
</script></body></html>
