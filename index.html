<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mess Meal Manager</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb">
<style>
:root{--bg:#eef4ff;--surface:#fff;--ink:#0f1b3a;--muted:#6b7a99;--line:#dde7f7;--line2:#eaf0fb;--blue:#2563eb;--blue2:#3b82f6;--bluewash:#e6efff;--soft:#f4f8ff;--green:#12a37f;--red:#e0485f;--amber:#f0a928;--shadow:0 10px 30px rgba(37,99,235,.08);--radius:20px;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-image:radial-gradient(900px 400px at 85% -10%,color-mix(in srgb,var(--blue) 14%,transparent),transparent),radial-gradient(700px 360px at -5% 0,color-mix(in srgb,var(--blue2) 10%,transparent),transparent);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;color:var(--ink)}button{cursor:pointer;border:0}
.shell{max-width:1200px;margin:auto;padding:20px 24px 40px;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.identity{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 8px 20px color-mix(in srgb,var(--blue) 35%,transparent)}
.identity h1{font-size:18px;letter-spacing:-.4px;margin:0}.identity p{margin:0;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.tools{display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow);transition:.2s}.iconbtn:hover{transform:translateY(-1px)}
.navwrap{display:flex;gap:4px;overflow-x:auto;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:22px;scrollbar-width:none;box-shadow:var(--shadow);position:sticky;top:8px;z-index:5;backdrop-filter:blur(10px)}.navwrap::-webkit-scrollbar{display:none}
.navbtn{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;transition:.2s}.navbtn i{font-style:normal;font-size:15px}.navbtn:hover{color:var(--ink);background:var(--soft)}
.navbtn.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 35%,transparent)}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 18px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase}.heading h2{font-size:27px;line-height:1.15;letter-spacing:-.9px;margin:3px 0 4px}.heading p{color:var(--muted);margin:0;font-size:12.5px;max-width:560px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:12.5px;font-weight:750;box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 30%,transparent);transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.soft{background:var(--bluewash);color:var(--blue);box-shadow:none}.btn.ghost{background:var(--surface);color:var(--muted);box-shadow:none;border:1px solid var(--line)}.btn.danger{background:color-mix(in srgb,var(--red) 12%,var(--surface));color:var(--red);box-shadow:none}.btn.tiny{padding:6px 10px;font-size:11px;border-radius:9px}.btn.calc{background:linear-gradient(135deg,#17a97a,#0e7d5b);box-shadow:0 6px 16px rgba(14,125,91,.25)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px;color:#fff;background:linear-gradient(135deg,#1d4ed8,#3b82f6 60%,#60a5fa);box-shadow:0 18px 40px color-mix(in srgb,var(--blue) 35%,transparent);display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}.hero:before{width:260px;height:260px;right:-60px;top:-110px}.hero:after{width:160px;height:160px;right:140px;bottom:-100px}
.hero small{opacity:.8;font-size:12px;font-weight:600}.hero .big{font-size:44px;font-weight:850;letter-spacing:-1.8px;line-height:1.1;margin:4px 0}.hero .sub{opacity:.85;font-size:12px}
.hero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}.hero .mini div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px;backdrop-filter:blur(6px)}.hero .mini span{display:block;font-size:10px;opacity:.8}.hero .mini b{font-size:17px;letter-spacing:-.4px;overflow-wrap:anywhere}
.hero>div{position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:650}.stat-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--bluewash)}
.stat strong{display:block;font-size:24px;letter-spacing:-.7px;margin:10px 0 0;overflow-wrap:anywhere}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0;margin-top:16px}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panelhead h3{font-size:14px;margin:0;letter-spacing:-.2px}.panelhead p{font-size:11px;color:var(--muted);margin:2px 0 0}.subtle{color:var(--muted);font-size:11.5px}
.tablewrap{overflow:auto;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:750;padding:10px 10px;background:var(--soft);white-space:nowrap}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:13px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;white-space:nowrap}tbody tr{transition:.15s}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--soft)}
.person{display:flex;align-items:center;gap:10px;font-weight:700}
.av{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
.amount{font-weight:800;font-variant-numeric:tabular-nums}.pos{color:var(--green);font-weight:750}.neg{color:var(--red);font-weight:750}
.pill{display:inline-block;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:800}.pill.pos{background:color-mix(in srgb,var(--green) 14%,var(--surface))}.pill.neg{background:color-mix(in srgb,var(--red) 13%,var(--surface))}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:5px;min-width:80px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.status{display:inline-block;border-radius:20px;padding:4px 10px;background:color-mix(in srgb,var(--green) 13%,var(--surface));color:var(--green);font-size:10px;font-weight:800}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:12.5px}.empty b{display:block;font-size:30px;margin-bottom:6px;filter:grayscale(.2)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.control,.field input,.field select,textarea.control{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;outline:none;max-width:100%;transition:.2s}
.control:focus,.field input:focus,.field select:focus{border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 15%,transparent)}
.search{min-width:200px}
.summarystrip{display:flex;gap:10px;flex-wrap:wrap}
.summarybox{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow)}.summarybox span{display:block;color:var(--muted);font-size:10.5px;font-weight:650}.summarybox strong{display:block;font-size:19px;margin-top:3px;letter-spacing:-.4px}
.announcement{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}.announcement:last-child{border:0}
.announceicon{width:36px;height:36px;border-radius:12px;background:var(--bluewash);color:var(--blue);display:grid;place-items:center;flex:0 0 auto}
.announcement .body{min-width:0;flex:1}.announcement p{font-size:13px;margin:0 0 3px;white-space:pre-wrap;overflow-wrap:anywhere}.date{font-size:10.5px;color:var(--muted)}.rowactions{display:flex;gap:6px;margin-top:8px}
.member-list-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line2)}.member-list-row:last-child{border-bottom:0}.member-name{font-weight:700;overflow-wrap:anywhere;min-width:0;display:flex;align-items:center;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(120px,1fr) repeat(3,auto);gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);align-items:center}
.mrow>span{font-weight:700;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}
.mrow label{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:650;cursor:pointer;padding:8px 12px;background:var(--soft);border:1px solid var(--line);border-radius:11px;white-space:nowrap;transition:background-color .12s,border-color .12s,color .12s}
.mrow label.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 11%,var(--surface));color:var(--green)}
input[type=checkbox]{accent-color:var(--green);width:17px;height:17px;margin:0}
.modalbg{display:none;position:fixed;inset:0;background:#0a1226aa;backdrop-filter:blur(6px);z-index:20;align-items:center;justify-content:center;padding:16px}
.modal{width:min(440px,100%);background:var(--surface);border-radius:24px;padding:24px;box-shadow:0 30px 80px #0a122655;animation:pop .25s ease}@keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px)}}
.modal h3{margin:0 0 3px;font-size:18px}.modal .hint{color:var(--muted);font-size:12px;margin-bottom:14px}
.field{margin:12px 0}.field label{display:block;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.5px;margin-bottom:5px}.field input,.field select{width:100%}
.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.report-controls{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.report-controls label,.chart-controls label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:11px;font-weight:750}
.chart-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0 0 16px}
.chart-wrap{position:relative;width:100%;max-width:760px;height:clamp(300px,55vw,440px);margin:0 auto}
.note{font-size:11.5px;color:var(--muted);margin:12px 0 0}
.report-empty{border:1.5px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--muted);background:var(--soft)}
.login{width:min(440px,100% - 8px);margin:clamp(30px,9vh,100px) auto;padding:36px;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 80px color-mix(in srgb,var(--blue) 18%,transparent);position:relative;overflow:hidden}
.login:before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--blue),var(--blue2),#93c5fd)}
.login .mark{margin-bottom:16px}.login h1{font-size:28px;letter-spacing:-.05em;margin:0 0 8px;line-height:1.1}.login .btn{width:100%;min-height:48px;font-size:13px}
.login .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.login input{width:100%;min-height:46px;font-size:14px}.login hr{border:0;border-top:1px solid var(--line);margin:22px 0}.mu{color:var(--muted)}
.skel{position:relative;overflow:hidden;background:var(--line);border-radius:14px;display:block}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--surface) 70%,transparent),transparent);animation:shimmer 1.25s infinite}@keyframes shimmer{100%{transform:translateX(100%)}}
.skel-stat{height:92px}.skel-tab{height:36px;width:100px;flex:none}.skel-line{height:14px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 18px;border-radius:14px;font-weight:650;font-size:12.5px;box-shadow:0 14px 34px rgba(0,0,0,.3);z-index:30;animation:pop .25s ease;display:flex;gap:8px;align-items:center}.toast.err{background:var(--red);color:#fff}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:16px}.hero{grid-template-columns:1fr}}
@media(max-width:640px){.shell{padding:12px 12px 96px}.heading{flex-direction:column;align-items:flex-start}.heading h2{font-size:23px}.heading .btn{align-self:stretch}.hero{padding:20px;border-radius:22px}.hero .big{font-size:36px}.panel{padding:14px}.search{min-width:0;width:100%}
.navwrap{position:fixed;top:auto;bottom:max(10px,env(safe-area-inset-bottom));left:10px;right:10px;margin:0;z-index:15;border-radius:20px;padding:6px;box-shadow:0 14px 40px rgba(20,30,70,.25);justify-content:space-around}.navbtn{flex-direction:column;gap:2px;padding:7px 11px;font-size:10px}.navbtn i{font-size:18px}
.mrow{grid-template-columns:1fr 1fr 1fr}.mrow>span{grid-column:1/-1}.mrow label{padding:8px 6px;justify-content:center;font-size:11px;gap:5px}.login{padding:26px 20px}.login .row{grid-template-columns:1fr}.toast{bottom:100px}.stat strong{font-size:20px}}

/* ===== Motion & polish layer ===== */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.2,.8,.2,1)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px}
body::before,body::after{content:"";position:fixed;z-index:-1;width:50vmax;height:50vmax;border-radius:50%;pointer-events:none}
body::before{top:-22vmax;right:-14vmax;background:radial-gradient(circle,color-mix(in srgb,var(--blue2) 30%,transparent),transparent 65%)}
body::after{bottom:-26vmax;left:-16vmax;background:radial-gradient(circle,rgba(34,211,238,.22),transparent 65%)}
@keyframes drift{to{transform:translate(-6vmax,5vmax) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes float{50%{transform:translate(-18px,14px) scale(1.08)}}
@keyframes gradmove{50%{background-position:100% 50%}}
@keyframes ping{to{transform:scale(3.2);opacity:0}}
@keyframes ripple{to{transform:scale(14);opacity:0}}
@keyframes tick{50%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes slidebar{to{background-position:-200% 0}}
/* entrance: one orchestrated reveal per screen */
.enter>*{animation:rise .65s var(--out) both;animation-delay:var(--d,0ms)}
.enter>.hero{animation:rise .8s var(--out) both}
.enter tbody tr{animation:rise .5s var(--out) both;animation-delay:calc(var(--d,0ms) + 280ms)}
.login.enter{animation:none}.login.enter>*{animation:rise .6s var(--out) both;animation-delay:calc(var(--d,0ms) + 80ms)}
.login.shake{animation:shake .45s}
/* brand mark + live dot */
.mark{animation:bob 4s ease-in-out infinite}.login .mark{width:64px;height:64px;font-size:30px;border-radius:20px}
.dot{position:relative}.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--green);animation:ping 1.8s ease-out infinite}
.login:before{background:linear-gradient(90deg,var(--blue),var(--blue2),#93c5fd,var(--blue2),var(--blue));background-size:200% 100%;animation:slidebar 3s linear infinite}
/* buttons */
.btn,.navbtn,.iconbtn{position:relative;overflow:hidden;isolation:isolate}
.btn{transition:transform .3s var(--spring),box-shadow .3s,filter .2s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.94);transition-duration:.1s}
.btn:not(.soft):not(.ghost):not(.danger):hover{box-shadow:0 12px 26px color-mix(in srgb,var(--blue) 42%,transparent)}
.btn.calc:hover{box-shadow:0 12px 26px rgba(14,125,91,.4)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--out)}
.btn:hover::before{transform:translateX(120%)}
.btn.soft::before,.btn.ghost::before,.btn.danger::before{background:linear-gradient(110deg,transparent 30%,color-mix(in srgb,var(--blue) 14%,transparent) 50%,transparent 70%)}
.btn span[aria-hidden]{transition:transform .3s var(--spring)}.btn:hover span[aria-hidden]{transform:translateX(5px)}
.btn:disabled::before{display:none}.btn:disabled::after{content:"";width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;order:-1}
.rip{position:absolute;z-index:-1;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
.btn.soft .rip,.btn.ghost .rip,.btn.danger .rip,.navbtn .rip{background:color-mix(in srgb,var(--blue) 28%,transparent)}
/* nav with sliding pill */
.navbtn{z-index:1}.navbtn.active{background:transparent;box-shadow:none;color:#fff}.navbtn.active i{animation:bob .6s var(--spring)}
.navbtn i{transition:transform .3s var(--spring)}.navbtn:hover i{transform:scale(1.2) rotate(-6deg)}
.navpill{position:absolute;top:5px;bottom:5px;left:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 35%,transparent);z-index:0;pointer-events:none}
.navpill.go{transition:transform .5s var(--spring),width .5s var(--spring)}
/* cards */
.summarybox,.stat{transition:transform .35s var(--spring),box-shadow .3s}
.summarybox:hover,.stat:hover{transform:translateY(-4px);box-shadow:0 18px 36px color-mix(in srgb,var(--blue) 16%,transparent)}
.hero:before{animation:float 9s ease-in-out infinite}.hero:after{animation:float 11s ease-in-out infinite reverse}
.hero .mini div{transition:transform .3s var(--spring),background .2s}.hero .mini div:hover{transform:translateY(-3px) scale(1.04);background:rgba(255,255,255,.26)}
tbody tr:hover{box-shadow:inset 3px 0 0 var(--blue)}
.announcement{transition:transform .25s var(--out)}.announcement:hover{transform:translateX(4px)}
.empty b{display:block;animation:bob 3s ease-in-out infinite}
.field:focus-within label{color:var(--blue)}
/* meal toggles */
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:background-color .12s,border-color .12s;cursor:pointer}
input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
input[type=checkbox]::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .15s ease-out}
input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}input[type=checkbox]:disabled{opacity:.45;cursor:not-allowed}
.mrow label{user-select:none}.mrow label:active{background:var(--bluewash)}
/* modal + toast */
.modalbg{animation:fadebg .25s}@keyframes fadebg{from{opacity:0}}
.modal{animation:modalin .5s cubic-bezier(.34,1.4,.5,1)}@keyframes modalin{from{opacity:0;transform:translateY(30px) scale(.92)}}
.toast{animation:toastin .45s var(--spring)}@keyframes toastin{from{opacity:0;transform:translate(-50%,20px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
.toast.out{animation:toastout .3s forwards}@keyframes toastout{to{opacity:0;transform:translate(-50%,10px)}}
.toast.saving::before{content:"";width:14px;height:14px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.toast .tick{width:20px;height:20px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:12px;animation:tick .5s var(--spring)}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:40;background:var(--c);animation:cf .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(calc(var(--x)*1.15),calc(var(--y) + 140px)) rotate(var(--r));opacity:0}}
@media(max-width:640px){.modalbg{align-items:flex-end}.modal{border-radius:26px 26px 0 0;padding-bottom:max(24px,env(safe-area-inset-bottom));animation:sheet .45s var(--out)}@keyframes sheet{from{transform:translateY(100%)}}.navpill{top:6px;bottom:6px;border-radius:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style></head><body>
<div class="shell" id="app"></div>
<div class="modalbg" id="modalbg"><div class="modal"><h3 id="modalTitle"></h3><div class="hint" id="modalHint"></div><div id="modalBody"></div><div class="modalactions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveModal()">Save record</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
try{document.documentElement.dataset.theme=localStorage.getItem("messTheme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}
const API_URL="https://script.google.com/macros/s/AKfycbz3JUxgJhZ-bCrSExvRWTXkPgXIV3uoaBmfElIJEQnGnrSb4gYoDCI83IshTEFxsyiXQg/exec";
const MEAL_WEIGHTS=[0.5,1,1];
const DEF=()=>({members:[],payments:[],buys:[],meals:{},updates:[],calculation:null,calculationHistory:[],monthCalculations:{},chartSettings:{metric:"meals",period:"all",type:"pie"}});
let S=DEF(),role=null,rm="",loadOk=false,saveQueued=false,tab="dash",loaded=false,busy=false,msg="",PW="",md=null,verifyingAdmin=false,pieChart=null,modalKind="",myChart=null,pq="",bq="",ps="new",bs="new";
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date()),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const canEdit=d=>d<=today()&&d>=ago(2);
const memName=id=>(S.members.find(m=>m.id===id)||{}).name||"-";
const AVC=["#2563eb","#0ea5a4","#3b82f6","#1d4ed8","#0284c7","#4f46e5","#0891b2","#6366f1"];
const av=n=>{n=String(n||"?");let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;const p=n.trim().split(/\s+/);return `<span class="av" style="background:${AVC[h%AVC.length]}">${esc(((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase())}</span>`};
/* ---------- API ---------- */
async function api(body){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});return r.json()}
async function load(q){
  try{
    const r=await fetch(API_URL,{cache:"no-store"});if(!r.ok)throw new Error("http");const j=await r.json();if(j&&j.error)throw new Error(j.error);
    if(j&&j.state)S=Object.assign(DEF(),j.state);else if(!loadOk)S=DEF();
    ["members","payments","buys","updates","calculationHistory"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
    ["meals","monthCalculations"].forEach(k=>{if(!S[k]||typeof S[k]!=="object"||Array.isArray(S[k]))S[k]={}});
    S.chartSettings=Object.assign({metric:"meals",period:"all",type:"pie"},S.chartSettings||{});
    if(S.calculation&&(!Array.isArray(S.calculationHistory)||!S.calculationHistory.length)){S.calculationHistory=[Object.assign({id:uid(),type:"overall",month:null},JSON.parse(JSON.stringify(S.calculation)))];}
    loadOk=true;
  }catch(e){loadOk=false;if(!q)toast("Could not load data. Check your connection.","err")}
  loaded=true;return loadOk;
}
async function retryLoad(){loaded=false;render();await load();render()}
async function save(){
  if(!loadOk){toast("Data isn't loaded, so saving is blocked to protect your sheet. Tap Retry.","err");return}
  if(busy){saveQueued=true;return}
  busy=true;msg="Saving…";render();
  let ok=false;
  try{const j=await api({password:PW,state:S});ok=!!j.ok;if(!ok)toast("Save failed: "+(j.error||"unknown error"),"err")}
  catch(e){toast("Save failed: network error. Changes were reverted.","err")}
  msg="";busy=false;
  if(ok)flash("Saved");else await load(true);
  render();
  if(saveQueued){saveQueued=false;if(ok)save()}
}
let qsT=null;function quietSave(){clearTimeout(qsT);qsT=setTimeout(async()=>{if(busy||!loadOk)return;try{const j=await api({password:PW,state:S});if(!j.ok)throw 0}catch(e){toast("Could not sync chart view","err")}},600)}
function flash(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
async function continueAsMember(){role="user";if(!loaded){render();await load()}render()}
function signOut(){role=null;PW="";tab="dash";msg="";md=null;myChart=null;busy=false;verifyingAdmin=false;loaded=false;loadOk=false;S=DEF();pq="";bq="";rm="";render()}
/* ---------- Calculation ---------- */
function buildCalculation(month=null){
  const inMonth=d=>!month||(typeof d==="string"&&d.slice(0,7)===month);
  const tb=S.buys.filter(b=>inMonth(b.date)).reduce((a,b)=>a+(Number(b.amt)||0),0);
  const mealDates=Object.entries(S.meals).filter(([d])=>inMonth(d));
  const rows=S.members.map(m=>{
    let meals=0;
    mealDates.forEach(([,d])=>{const arr=d[m.id]||[0,0,0];meals+=(arr[0]?MEAL_WEIGHTS[0]:0)+(arr[1]?MEAL_WEIGHTS[1]:0)+(arr[2]?MEAL_WEIGHTS[2]:0)});
    const paid=S.payments.filter(p=>p.mid===m.id&&inMonth(p.date)).reduce((a,p)=>a+(Number(p.amt)||0),0);
    return {mid:m.id,name:m.name,meals,paid};
  });
  const tm=rows.reduce((a,r)=>a+r.meals,0),rate=tm?tb/tm:0;
  rows.forEach(r=>{r.cost=rate*r.meals;r.refund=r.paid-r.cost});
  return {id:uid(),type:month?"monthly":"overall",month:month||null,tb,tm,rate,rows,calculatedAt:new Date().toISOString()};
}
function computeCalculation(){return buildCalculation(null)}
function calc(){
  const live=buildCalculation(null);
  const rows=live.rows.map(r=>({m:{id:r.mid,name:r.name},meals:r.meals,paid:r.paid,cost:r.cost,refund:r.refund}));
  return {tb:live.tb,tm:live.tm,rate:live.rate,rows,calculated:true,calculatedAt:S.calculation?.calculatedAt||null,live:true};
}
function addHistory(s){if(!Array.isArray(S.calculationHistory))S.calculationHistory=[];S.calculationHistory.unshift(JSON.parse(JSON.stringify(s)));S.calculationHistory=S.calculationHistory.slice(0,100)}
async function confirmCalculate(){if(role!=="admin")return;if(!await dlg({title:"Calculate overall report?",body:"Saves a new snapshot of the all-time calculation.",ok:"Calculate"}))return;S.calculation=computeCalculation();addHistory(S.calculation);save()}
function monthLabel(month){if(!month)return "All-time";const [y,m]=month.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})}
function monthShift(month,delta){const [y,m]=month.split("-").map(Number);const d=new Date(y,m-1+delta,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}
async function calculateMonth(){
  if(role!=="admin")return;
  const month=$("#reportMonth")?.value||rm;
  if(!month){toast("Choose a month first.","err");return}
  if(!await dlg({title:`Calculate ${monthLabel(month)}?`,body:"Saves a snapshot using only the chosen month meals, purchases and payments.",ok:"Calculate"}))return;
  const snapshot=buildCalculation(month);
  if(!S.monthCalculations||typeof S.monthCalculations!=="object")S.monthCalculations={};
  S.monthCalculations[month]=snapshot;addHistory(snapshot);save();
}
/* ---------- Layout helpers ---------- */
function pageTitle(k,t,s,a=""){return `<div class="heading"><div>${k?`<div class="eyebrow">${k}</div>`:""}<h2>${t}</h2><p>${s}</p></div>${a}</div>`}
function stat(l,v,i){return `<div class="stat"><div class="stat-top"><span>${l}</span><div class="stat-icon">${i}</div></div><strong>${v}</strong></div>`}
function sbox(l,v){return `<div class="summarybox"><span>${l}</span><strong>${v}</strong></div>`}
function updList(admin){
  if(!S.updates.length)return '<div class="empty"><b>📣</b>No updates yet</div>';
  return S.updates.map(u=>`<div class="announcement"><div class="announceicon">✦</div><div class="body"><p>${esc(u.text)}</p><span class="date">${esc(u.date)}</span>${admin?`<div class="rowactions"><button class="btn soft tiny" onclick="editU('${u.id}')">Edit</button><button class="btn danger tiny" onclick="delU('${u.id}')">Delete</button></div>`:""}</div></div>`).join("");
}
/* ---------- Dashboard ---------- */
function summary(c){return `<section class="hero"><div><small>Current meal rate</small><div class="big">${fmt(c.rate)}</div></div>
 <div class="mini"><div><span>Buying cost</span><b>${fmt(c.tb)}</b></div><div><span>Total meals</span><b>${fmt(c.tm)}</b></div><div><span>Members</span><b>${S.members.length}</b></div></div></section>`}
function report(c){
    return `<div class="tablewrap"><table><thead><tr><th>Member</th><th>Meals</th><th>Overall Cost</th><th>Paid</th><th>Refund / Due</th></tr></thead><tbody>

/* ---------- Updates ---------- */
function updTab(){
  const n=S.updates.length;

  `<div class="panel"><div class="toolbar"><textarea class="control" id="ut" rows="2" style="flex:1;min-width:200px;resize:vertical" placeholder="Write an update for everyone"></textarea><button class="btn" onclick="addU()">＋ Add update</button></div>

/* ---------- Meals ---------- */

  const d=md||today(),ok=canEdit(d),cur=S.meals[d]||{};

  `<div class="panel"><div class="toolbar"><input class="control search" id="nm" placeholder="Member name" aria-label="Member name" onkeydown="if(event.key==='Enter')addM()"><button class="btn" onclick="addM()">＋ Add member</button></div>

}
async function delM(id){if(!await dlg({title:"Remove this member?",body:"Their meals and payments will be deleted too.",ok:"Remove",danger:true}))return;S.members=S.members.filter(m=>m.id!==id);S.payments=S.payments.filter(p=>p.mid!==id);Object.values(S.meals).forEach(d=>delete d[id]);save()}

function sortList(list,s){const a=[...list];return a.sort((x,y)=>s==="high"?(y.amt-x.amt):s==="old"?String(x.date).localeCompare(String(y.date)):String(y.date).localeCompare(String(x.date)))}
function payTable(){
  const q=pq.toLowerCase();

  return `<div class="tablewrap"><table><thead><tr><th>Member</th><th>Date</th><th>Payment note</th><th>Amount</th><th></th></tr></thead><tbody>
  ${list.map(p=>`<tr><td><div class="person">${av(memName(p.mid))}${esc(memName(p.mid))}</div></td><td>${esc(p.date)}</td><td>${esc(p.note||"—")}</td><td class="amount pos">${fmt(p.amt)}</td><td><button class="btn danger tiny" onclick="delItem('payments','${p.id}')">Delete</button></td></tr>`).join("")||'<tr><td colspan="5"><div class="empty"><b>💳</b>No payment records yet</div></td></tr>'}
  </tbody></table></div>`;
}
function payTab(){

function countUp(el,key){
  const t=el.textContent.trim();if(RM||!/^-?[\d,]+(\.\d+)?$/.test(t)||!(1.5).toLocaleString().includes("."))return;
  const to=parseFloat(t.replace(/,/g,"")),dec=(t.split(".")[1]||"").length,from=prevN.has(key)?prevN.get(key):0;prevN.set(key,to);

  (function step(n){const p=Math.min(1,(n-s)/900),e=1-Math.pow(1-p,4);el.textContent=p<1?f(from+(to-from)*e):t;if(p<1)requestAnimationFrame(step)})(s);
}

function dlg(o){return new Promise(res=>{

let fxC,fxX,fxW,fxH,fxP=[],fxRun=false;
function fxInit(){fxC=document.createElement("canvas");fxC.id="fx";document.body.prepend(fxC);fxX=fxC.getContext("2d");fxSize();addEventListener("resize",fxSize);document.addEventListener("visibilitychange",fxGo);fxGo()}
function fxSize(){fxW=fxC.width=innerWidth;fxH=fxC.height=innerHeight;fxP=Array.from({length:Math.round(Math.min(46,fxW*fxH/32000))},()=>({x:Math.random()*fxW,y:Math.random()*fxH,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:1+Math.random()*2}))}
function fxGo(){if(fxRun||!PREF.fx||RM||document.hidden)return;fxRun=true;requestAnimationFrame(fxLoop)}
function fxLoop(){
  if(!PREF.fx||document.hidden){fxRun=false;fxX.clearRect(0,0,fxW,fxH);return}
  fxX.clearRect(0,0,fxW,fxH);const col=(ACCENTS[PREF.accent]||ACCENTS.blue)[1];fxX.fillStyle=col;fxX.strokeStyle=col;
  for(let i=0;i<fxP.length;i++){const p=fxP[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>fxW)p.vx*=-1;if(p.y<0||p.y>fxH)p.vy*=-1;
    fxX.globalAlpha=.5;fxX.beginPath();fxX.arc(p.x,p.y,p.r,0,6.283);fxX.fill();
    for(let j=i+1;j<fxP.length;j++){const q=fxP[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;if(d<14400){fxX.globalAlpha=(1-d/14400)*.25;fxX.beginPath();fxX.moveTo(p.x,p.y);fxX.lineTo(q.x,q.y);fxX.stroke()}}}
  fxX.globalAlpha=1;requestAnimationFrame(fxLoop);
}

function allDates(){const s=new Set(Object.keys(S.meals));S.buys.forEach(b=>b.date&&s.add(b.date));S.payments.forEach(p=>p.date&&s.add(p.date));return [...s].filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort()}
function inPeriod(p){if(!p||p==="all")return()=>true;if(p==="last7"){const a=ago(6);return d=>String(d||"")>=a}if(p==="last30"){const a=ago(29);return d=>String(d||"")>=a}return d=>String(d||"").slice(0,7)===p}

function dayInfo(d){const day=S.meals[d]||{};let b=0,l=0,di=0,people=0;S.members.forEach(m=>{const a=day[m.id];if(Array.isArray(a)){if(a[0])b++;if(a[1])l++;if(a[2])di++;if(a.some(Boolean))people++}});
  return {d,b,l,di,people,units:b*MEAL_WEIGHTS[0]+l*MEAL_WEIGHTS[1]+di*MEAL_WEIGHTS[2],buy:sumBy(S.buys.filter(x=>x.date===d),x=>x.amt),pay:sumBy(S.payments.filter(x=>x.date===d),x=>x.amt)}}
function calcR(pred){
  const tb=sumBy(S.buys.filter(b=>pred(b.date)),b=>b.amt),md=Object.entries(S.meals).filter(([d])=>pred(d));
  const rows=S.members.map(m=>{let meals=0,bk=0,lu=0,dn=0;
    md.forEach(([,d])=>{const a=d[m.id]||[0,0,0];if(a[0]){bk++;meals+=MEAL_WEIGHTS[0]}if(a[1]){lu++;meals+=MEAL_WEIGHTS[1]}if(a[2]){dn++;meals+=MEAL_WEIGHTS[2]}});
    return {id:m.id,name:m.name,meals,bk,lu,dn,paid:sumBy(S.payments.filter(p=>p.mid===m.id&&pred(p.date)),p=>p.amt)}});
  const tm=sumBy(rows,r=>r.meals),rate=tm?tb/tm:0;rows.forEach(r=>{r.cost=rate*r.meals;r.refund=r.paid-r.cost});
  return {tb,tm,rate,rows};
}

    else if(k==="bak")backupJSON();
    else if(k==="res"){close(true);restoreJSON()}
    else if(k==="save"){const me=bg.querySelector("#sMe");PREF.me=me?me.value:PREF.me;LS.set("messAccent",PREF.accent);LS.set("messMe",PREF.me);applyAccent();close(false);render();toast("Settings saved")}
  });
  document.body.appendChild(bg);ovClose=close0;
}
/* ---------- topbar ---------- */
function topbar(adm){
  return `<header class="topbar"><div class="identity"><div><h1>Mess Meal Manager</h1><p><span class="dot"></span>${adm?"Administrator console":"Member view"}</p></div></div>
  <div class="tools"><button class="btn ghost" onclick="openSettings()" aria-label="Settings">⚙️</button><button class="btn ghost" onclick="toggleTheme()" aria-label="Toggle dark mode">${document.documentElement.dataset.theme==="dark"?"☀️":"🌙"}</button><button class="btn ghost" onclick="signOut()">Sign out</button></div></header>`;
}
/* ---------- meals tab ---------- */
function mealsTab(){
  const d=md||today(),ok=canEdit(d),cur=S.meals[d]||{},n=S.members.filter(m=>(cur[m.id]||[]).some(Boolean)).length;
  const chips=[0,1,2].map(k=>{const dd=ago(k);return `<button class="chip ${dd===d?"on":""}" onclick="md='${dd}';render()">${["Today","Yesterday","2 days ago"][k]}${dayHasMeals(dd)?'<i class="ok"></i>':""}</button>`}).join("");
  return pageTitle("DAILY RECORDS","Meals","Tick breakfast, lunch and dinner for each member.")+
  `<div class="chips" style="margin-bottom:14px">${chips}</div>
  <div class="summarystrip">${sbox("Date",esc(d))}<div class="summarybox"><span>Members with meals</span><strong id="mealCount">${n} / ${S.members.length}</strong></div>${sbox("Status",ok?"Open":"Locked")}</div>
  <div class="panel"><div class="toolbar"><input class="control" type="date" id="md" value="${d}" max="${today()}" onchange="md=this.value;render()">
  <span class="subtle" id="mealHint">${ok?"Open for entry":"🔒 Locked: meals can only be added on the day or within 2 days after."}</span>${ok&&S.members.length?'<span style="display:flex;gap:6px"><button class="btn soft tiny" onclick="setAllMeals(1)">Select all</button><button class="btn ghost tiny" onclick="setAllMeals(0)">Clear all</button></span>':""}</div>
  ${S.members.map(m=>{const v=cur[m.id]||[0,0,0];
    return `<div class="mrow"><span>${av(m.name)}${esc(m.name)}${ok?`<button class="btn ghost tiny allbtn" onclick="rowAll('${m.id}')">All 3</button>`:""}</span>${["Breakfast","Lunch","Dinner"].map((nm,i)=>`<label class="${v[i]?"on":""}"><input type="checkbox" data-m="${m.id}" data-i="${i}" ${v[i]?"checked":""} ${ok?"":"disabled"}>${nm}</label>`).join("")}</div>`
  }).join("")||'<div class="empty"><b>👥</b>Add members first.</div>'}
  ${ok&&S.members.length?'<div style="margin-top:16px"><button class="btn" onclick="saveMeals()" '+(busy?"disabled":"")+'>Save meals for this day</button></div>':""}</div>`;
}

applyAccent();fxInit();
render();
</script></body></html>
