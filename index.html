<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mess Meal Manager</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb">
<style>
:root{--bg:#eef4ff;--surface:#fff;--ink:#0f1b3a;--muted:#6b7a99;--line:#dde7f7;--line2:#eaf0fb;--blue:#2563eb;--blue2:#3b82f6;--bluewash:#e6efff;--soft:#f4f8ff;--green:#12a37f;--red:#e0485f;--amber:#f0a928;--shadow:0 10px 30px rgba(37,99,235,.08);--radius:20px;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-image:radial-gradient(900px 400px at 85% -10%,color-mix(in srgb,var(--blue) 14%,transparent),transparent),radial-gradient(700px 360px at -5% 0,color-mix(in srgb,var(--blue2) 10%,transparent),transparent);background-repeat:no-repeat}
button,input,select,textarea{font:inherit;color:var(--ink)}button{cursor:pointer;border:0}
.shell{max-width:1200px;margin:auto;padding:20px 24px 40px;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.identity{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 8px 20px color-mix(in srgb,var(--blue) 35%,transparent)}
.identity h1{font-size:18px;letter-spacing:-.4px;margin:0}.identity p{margin:0;color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 25%,transparent)}
.tools{display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:16px;box-shadow:var(--shadow);transition:.2s}.iconbtn:hover{transform:translateY(-1px)}
.navwrap{display:flex;gap:4px;overflow-x:auto;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:22px;scrollbar-width:none;box-shadow:var(--shadow);position:sticky;top:8px;z-index:5;backdrop-filter:blur(10px)}.navwrap::-webkit-scrollbar{display:none}
.navbtn{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:transparent;color:var(--muted);font-size:12.5px;font-weight:700;transition:.2s}.navbtn i{font-style:normal;font-size:15px}.navbtn:hover{color:var(--ink);background:var(--soft)}
.navbtn.active{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 35%,transparent)}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 18px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase}.heading h2{font-size:27px;line-height:1.15;letter-spacing:-.9px;margin:3px 0 4px}.heading p{color:var(--muted);margin:0;font-size:12.5px;max-width:560px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:12.5px;font-weight:750;box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 30%,transparent);transition:.2s}.btn:hover{transform:translateY(-1px);filter:brightness(1.06)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.soft{background:var(--bluewash);color:var(--blue);box-shadow:none}.btn.ghost{background:var(--surface);color:var(--muted);box-shadow:none;border:1px solid var(--line)}.btn.danger{background:color-mix(in srgb,var(--red) 12%,var(--surface));color:var(--red);box-shadow:none}.btn.tiny{padding:6px 10px;font-size:11px;border-radius:9px}.btn.calc{background:linear-gradient(135deg,#17a97a,#0e7d5b);box-shadow:0 6px 16px rgba(14,125,91,.25)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:26px;color:#fff;background:linear-gradient(135deg,#1d4ed8,#3b82f6 60%,#60a5fa);box-shadow:0 18px 40px color-mix(in srgb,var(--blue) 35%,transparent);display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}.hero:before{width:260px;height:260px;right:-60px;top:-110px}.hero:after{width:160px;height:160px;right:140px;bottom:-100px}
.hero small{opacity:.8;font-size:12px;font-weight:600}.hero .big{font-size:44px;font-weight:850;letter-spacing:-1.8px;line-height:1.1;margin:4px 0}.hero .sub{opacity:.85;font-size:12px}
.hero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}.hero .mini div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px;backdrop-filter:blur(6px)}.hero .mini span{display:block;font-size:10px;opacity:.8}.hero .mini b{font-size:17px;letter-spacing:-.4px;overflow-wrap:anywhere}
.hero>div{position:relative;z-index:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:650}.stat-icon{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--bluewash)}
.stat strong{display:block;font-size:24px;letter-spacing:-.7px;margin:10px 0 0;overflow-wrap:anywhere}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0;margin-top:16px}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panelhead h3{font-size:14px;margin:0;letter-spacing:-.2px}.panelhead p{font-size:11px;color:var(--muted);margin:2px 0 0}.subtle{color:var(--muted);font-size:11.5px}
.tablewrap{overflow:auto;border-radius:12px}table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:750;padding:10px 10px;background:var(--soft);white-space:nowrap}th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:13px 10px;border-bottom:1px solid var(--line2);font-size:12.5px;white-space:nowrap}tbody tr{transition:.15s}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--soft)}
.person{display:flex;align-items:center;gap:10px;font-weight:700}
.av{width:32px;height:32px;border-radius:11px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:800;flex:none}
.amount{font-weight:800;font-variant-numeric:tabular-nums}.pos{color:var(--green);font-weight:750}.neg{color:var(--red);font-weight:750}
.pill{display:inline-block;border-radius:20px;padding:4px 10px;font-size:11px;font-weight:800}.pill.pos{background:color-mix(in srgb,var(--green) 14%,var(--surface))}.pill.neg{background:color-mix(in srgb,var(--red) 13%,var(--surface))}
.bar{height:6px;border-radius:6px;background:var(--line);margin-top:5px;min-width:80px;overflow:hidden}.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.status{display:inline-block;border-radius:20px;padding:4px 10px;background:color-mix(in srgb,var(--green) 13%,var(--surface));color:var(--green);font-size:10px;font-weight:800}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:12.5px}.empty b{display:block;font-size:30px;margin-bottom:6px;filter:grayscale(.2)}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.control,.field input,.field select,textarea.control{border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:13px;outline:none;max-width:100%;transition:.2s}
.control:focus,.field input:focus,.field select:focus{border-color:var(--blue);background:var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--blue) 15%,transparent)}
.search{min-width:200px}
.summarystrip{display:flex;gap:10px;flex-wrap:wrap}
.summarybox{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow)}.summarybox span{display:block;color:var(--muted);font-size:10.5px;font-weight:650}.summarybox strong{display:block;font-size:19px;margin-top:3px;letter-spacing:-.4px}
.announcement{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}.announcement:last-child{border:0}
.announceicon{width:36px;height:36px;border-radius:12px;background:var(--bluewash);color:var(--blue);display:grid;place-items:center;flex:0 0 auto}
.announcement .body{min-width:0;flex:1}.announcement p{font-size:13px;margin:0 0 3px;white-space:pre-wrap;overflow-wrap:anywhere}.date{font-size:10.5px;color:var(--muted)}.rowactions{display:flex;gap:6px;margin-top:8px}
.member-list-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line2)}.member-list-row:last-child{border-bottom:0}.member-name{font-weight:700;overflow-wrap:anywhere;min-width:0;display:flex;align-items:center;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(120px,1fr) repeat(3,auto);gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);align-items:center}
.mrow>span{font-weight:700;display:flex;align-items:center;gap:10px;overflow-wrap:anywhere}
.mrow label{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:650;cursor:pointer;padding:8px 12px;background:var(--soft);border:1px solid var(--line);border-radius:11px;white-space:nowrap;transition:background-color .12s,border-color .12s,color .12s}
.mrow label.on{border-color:var(--green);background:color-mix(in srgb,var(--green) 11%,var(--surface));color:var(--green)}
input[type=checkbox]{accent-color:var(--green);width:17px;height:17px;margin:0}
.modalbg{display:none;position:fixed;inset:0;background:#0a1226aa;backdrop-filter:blur(6px);z-index:20;align-items:center;justify-content:center;padding:16px}
.modal{width:min(440px,100%);background:var(--surface);border-radius:24px;padding:24px;box-shadow:0 30px 80px #0a122655;animation:pop .25s ease}@keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px)}}
.modal h3{margin:0 0 3px;font-size:18px}.modal .hint{color:var(--muted);font-size:12px;margin-bottom:14px}
.field{margin:12px 0}.field label{display:block;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.5px;margin-bottom:5px}.field input,.field select{width:100%}
.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.report-controls{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.report-controls label,.chart-controls label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:11px;font-weight:750}
.chart-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0 0 16px}
.chart-wrap{position:relative;width:100%;max-width:760px;height:clamp(300px,55vw,440px);margin:0 auto}
.note{font-size:11.5px;color:var(--muted);margin:12px 0 0}
.report-empty{border:1.5px dashed var(--line);border-radius:16px;padding:26px;text-align:center;color:var(--muted);background:var(--soft)}
.login{width:min(440px,100% - 8px);margin:clamp(30px,9vh,100px) auto;padding:36px;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 80px color-mix(in srgb,var(--blue) 18%,transparent);position:relative;overflow:hidden}
.login:before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--blue),var(--blue2),#93c5fd)}
.login .mark{margin-bottom:16px}.login h1{font-size:28px;letter-spacing:-.05em;margin:0 0 8px;line-height:1.1}.login .btn{width:100%;min-height:48px;font-size:13px}
.login .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.login input{width:100%;min-height:46px;font-size:14px}.login hr{border:0;border-top:1px solid var(--line);margin:22px 0}.mu{color:var(--muted)}
.skel{position:relative;overflow:hidden;background:var(--line);border-radius:14px;display:block}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--surface) 70%,transparent),transparent);animation:shimmer 1.25s infinite}@keyframes shimmer{100%{transform:translateX(100%)}}
.skel-stat{height:92px}.skel-tab{height:36px;width:100px;flex:none}.skel-line{height:14px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#172033;color:#fff;padding:11px 18px;border-radius:14px;font-weight:650;font-size:12.5px;box-shadow:0 14px 34px rgba(0,0,0,.3);z-index:30;animation:pop .25s ease;display:flex;gap:8px;align-items:center}.toast.err{background:var(--red);color:#fff}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{padding:16px}.hero{grid-template-columns:1fr}}
@media(max-width:640px){.shell{padding:12px 12px 96px}.heading{flex-direction:column;align-items:flex-start}.heading h2{font-size:23px}.heading .btn{align-self:stretch}.hero{padding:20px;border-radius:22px}.hero .big{font-size:36px}.panel{padding:14px}.search{min-width:0;width:100%}
.navwrap{position:fixed;top:auto;bottom:max(10px,env(safe-area-inset-bottom));left:10px;right:10px;margin:0;z-index:15;border-radius:20px;padding:6px;box-shadow:0 14px 40px rgba(20,30,70,.25);justify-content:space-around}.navbtn{flex-direction:column;gap:2px;padding:7px 11px;font-size:10px}.navbtn i{font-size:18px}
.mrow{grid-template-columns:1fr 1fr 1fr}.mrow>span{grid-column:1/-1}.mrow label{padding:8px 6px;justify-content:center;font-size:11px;gap:5px}.login{padding:26px 20px}.login .row{grid-template-columns:1fr}.toast{bottom:100px}.stat strong{font-size:20px}}

/* ===== Motion & polish layer ===== */
:root{--spring:cubic-bezier(.34,1.56,.64,1);--out:cubic-bezier(.2,.8,.2,1)}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px}
body::before,body::after{content:"";position:fixed;z-index:-1;width:50vmax;height:50vmax;border-radius:50%;pointer-events:none}
body::before{top:-22vmax;right:-14vmax;background:radial-gradient(circle,color-mix(in srgb,var(--blue2) 30%,transparent),transparent 65%)}
body::after{bottom:-26vmax;left:-16vmax;background:radial-gradient(circle,rgba(34,211,238,.22),transparent 65%)}
@keyframes drift{to{transform:translate(-6vmax,5vmax) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes float{50%{transform:translate(-18px,14px) scale(1.08)}}
@keyframes gradmove{50%{background-position:100% 50%}}
@keyframes ping{to{transform:scale(3.2);opacity:0}}
@keyframes ripple{to{transform:scale(14);opacity:0}}
@keyframes tick{50%{transform:scale(1.07)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes slidebar{to{background-position:-200% 0}}
/* entrance: one orchestrated reveal per screen */
.enter>*{animation:rise .65s var(--out) both;animation-delay:var(--d,0ms)}
.enter>.hero{animation:rise .8s var(--out) both}
.enter tbody tr{animation:rise .5s var(--out) both;animation-delay:calc(var(--d,0ms) + 280ms)}
.login.enter{animation:none}.login.enter>*{animation:rise .6s var(--out) both;animation-delay:calc(var(--d,0ms) + 80ms)}
.login.shake{animation:shake .45s}
/* brand mark + live dot */
.mark{animation:bob 4s ease-in-out infinite}.login .mark{width:64px;height:64px;font-size:30px;border-radius:20px}
.dot{position:relative}.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--green);animation:ping 1.8s ease-out infinite}
.login:before{background:linear-gradient(90deg,var(--blue),var(--blue2),#93c5fd,var(--blue2),var(--blue));background-size:200% 100%;animation:slidebar 3s linear infinite}
/* buttons */
.btn,.navbtn,.iconbtn{position:relative;overflow:hidden;isolation:isolate}
.btn{transition:transform .3s var(--spring),box-shadow .3s,filter .2s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.94);transition-duration:.1s}
.btn:not(.soft):not(.ghost):not(.danger):hover{box-shadow:0 12px 26px color-mix(in srgb,var(--blue) 42%,transparent)}
.btn.calc:hover{box-shadow:0 12px 26px rgba(14,125,91,.4)}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s var(--out)}
.btn:hover::before{transform:translateX(120%)}
.btn.soft::before,.btn.ghost::before,.btn.danger::before{background:linear-gradient(110deg,transparent 30%,color-mix(in srgb,var(--blue) 14%,transparent) 50%,transparent 70%)}
.btn span[aria-hidden]{transition:transform .3s var(--spring)}.btn:hover span[aria-hidden]{transform:translateX(5px)}
.btn:disabled::before{display:none}.btn:disabled::after{content:"";width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;order:-1}
.rip{position:absolute;z-index:-1;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
.btn.soft .rip,.btn.ghost .rip,.btn.danger .rip,.navbtn .rip{background:color-mix(in srgb,var(--blue) 28%,transparent)}
/* nav with sliding pill */
.navbtn{z-index:1}.navbtn.active{background:transparent;box-shadow:none;color:#fff}.navbtn.active i{animation:bob .6s var(--spring)}
.navbtn i{transition:transform .3s var(--spring)}.navbtn:hover i{transform:scale(1.2) rotate(-6deg)}
.navpill{position:absolute;top:5px;bottom:5px;left:0;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--blue2));box-shadow:0 6px 16px color-mix(in srgb,var(--blue) 35%,transparent);z-index:0;pointer-events:none}
.navpill.go{transition:transform .5s var(--spring),width .5s var(--spring)}
/* cards */
.summarybox,.stat{transition:transform .35s var(--spring),box-shadow .3s}
.summarybox:hover,.stat:hover{transform:translateY(-4px);box-shadow:0 18px 36px color-mix(in srgb,var(--blue) 16%,transparent)}
.hero:before{animation:float 9s ease-in-out infinite}.hero:after{animation:float 11s ease-in-out infinite reverse}
.hero .mini div{transition:transform .3s var(--spring),background .2s}.hero .mini div:hover{transform:translateY(-3px) scale(1.04);background:rgba(255,255,255,.26)}
tbody tr:hover{box-shadow:inset 3px 0 0 var(--blue)}
.announcement{transition:transform .25s var(--out)}.announcement:hover{transform:translateX(4px)}
.empty b{display:block;animation:bob 3s ease-in-out infinite}
.field:focus-within label{color:var(--blue)}
/* meal toggles */
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;transition:background-color .12s,border-color .12s;cursor:pointer}
input[type=checkbox]:checked{background:var(--green);border-color:var(--green)}
input[type=checkbox]::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .15s ease-out}
input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}input[type=checkbox]:disabled{opacity:.45;cursor:not-allowed}
.mrow label{user-select:none}.mrow label:active{background:var(--bluewash)}
/* modal + toast */
.modalbg{animation:fadebg .25s}@keyframes fadebg{from{opacity:0}}
.modal{animation:modalin .5s cubic-bezier(.34,1.4,.5,1)}@keyframes modalin{from{opacity:0;transform:translateY(30px) scale(.92)}}
.toast{animation:toastin .45s var(--spring)}@keyframes toastin{from{opacity:0;transform:translate(-50%,20px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
.toast.out{animation:toastout .3s forwards}@keyframes toastout{to{opacity:0;transform:translate(-50%,10px)}}
.toast.saving::before{content:"";width:14px;height:14px;border:2px solid #fff;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.toast .tick{width:20px;height:20px;border-radius:50%;background:var(--green);display:grid;place-items:center;font-size:12px;animation:tick .5s var(--spring)}
.cf{position:fixed;width:8px;height:12px;border-radius:2px;pointer-events:none;z-index:40;background:var(--c);animation:cf .95s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cf{to{transform:translate(calc(var(--x)*1.15),calc(var(--y) + 140px)) rotate(var(--r));opacity:0}}
@media(max-width:640px){.modalbg{align-items:flex-end}.modal{border-radius:26px 26px 0 0;padding-bottom:max(24px,env(safe-area-inset-bottom));animation:sheet .45s var(--out)}@keyframes sheet{from{transform:translateY(100%)}}.navpill{top:6px;bottom:6px;border-radius:14px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

</style></head><body>
<div class="shell" id="app"></div>
<div class="modalbg" id="modalbg"><div class="modal"><h3 id="modalTitle"></h3><div class="hint" id="modalHint"></div><div id="modalBody"></div><div class="modalactions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveModal()">Save record</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
try{document.documentElement.dataset.theme=localStorage.getItem("messTheme")||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light")}catch(e){}
const API_URL="https://script.google.com/macros/s/AKfycbyeEFNwCWYiNGrHQ1HJ03GCp01aTGHJk8W6-jIzyCswecSlQXuMibNyk7F7h0-l3Uy1/exec";
const DEFAULT_MESS="";      /* optional: a mess code that a bare link (no ?m=) opens. Leave empty to show the "find your mess" screen. */
let MESS=null;              /* {code,name} of the mess currently open */
let booted=false;           /* render() stays idle until bootMess() has chosen a mess */
const qs=()=>"?m="+encodeURIComponent(MESS?MESS.code:"")+"&v="+encodeURIComponent(typeof myVoter==="function"?myVoter():"");
const MEAL_WEIGHTS=[0.5,1,1];
const DEF=()=>({members:[],payments:[],buys:[],meals:{},guests:[],reactions:{},requests:[],polls:[],comments:{},ratings:{},bazar:[],carry:{},settings:null,managerMid:"",updates:[],calculation:null,calculationHistory:[],monthCalculations:{},chartSettings:{metric:"meals",period:"all",type:"pie"}});
let S=DEF(),role=null,rm="",loadOk=false,saveQueued=false,tab="dash",loaded=false,busy=false,msg="",PW="",md=null,verifyingAdmin=false,pieChart=null,modalKind="",myChart=null,pq="",bq="",ps="new",bs="new";
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date()),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const canEdit=d=>d<=today()&&d>=ago(2);
const memName=id=>(S.members.find(m=>m.id===id)||{}).name||"-";
const AVC=["#2563eb","#0ea5a4","#3b82f6","#1d4ed8","#0284c7","#4f46e5","#0891b2","#6366f1"];
const av=n=>{n=String(n||"?");let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;const p=n.trim().split(/\s+/);return `<span class="av" style="background:${AVC[h%AVC.length]}">${esc(((p[0]||"?")[0]+(p[1]?p[1][0]:"")).toUpperCase())}</span>`};
/* ---------- API ---------- */
async function api(body){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({mess:MESS?MESS.code:undefined},body))});return r.json()}
async function load(q){
  try{
    const r=await fetch(API_URL+qs(),{cache:"no-store"});if(!r.ok)throw new Error("http");const j=await r.json();if(j&&j.error)throw new Error(j.error);if(j&&j.mess&&MESS&&j.mess.name&&j.mess.name!==MESS.name){MESS.name=j.mess.name;rememberMess(j.mess);document.title=MESS.name}
    if(j&&j.state)S=Object.assign(DEF(),j.state);else if(!loadOk)S=DEF();
    ["members","payments","buys","updates","calculationHistory","guests","requests"].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
    ["meals","monthCalculations","reactions"].forEach(k=>{if(!S[k]||typeof S[k]!=="object"||Array.isArray(S[k]))S[k]={}});
    S.chartSettings=Object.assign({metric:"meals",period:"all",type:"pie"},S.chartSettings||{});
    if(S.calculation&&(!Array.isArray(S.calculationHistory)||!S.calculationHistory.length)){S.calculationHistory=[Object.assign({id:uid(),type:"overall",month:null},JSON.parse(JSON.stringify(S.calculation)))];}
    loadOk=true;
  }catch(e){loadOk=false;if(!q)toast("Could not load data. Check your connection.","err")}
  loaded=true;return loadOk;
}
async function retryLoad(){loaded=false;render();await load();render()}
async function save(){
  if(!loadOk){toast("Data isn't loaded, so saving is blocked to protect your sheet. Tap Retry.","err");return}
  if(busy){saveQueued=true;return}
  busy=true;msg="Saving…";render();
  let ok=false;
  try{const j=await api({password:PW,state:S});ok=!!j.ok;if(!ok)toast("Save failed: "+(j.error||"unknown error"),"err")}
  catch(e){toast("Save failed: network error. Changes were reverted.","err")}
  msg="";busy=false;
  if(ok)flash("Saved");else await load(true);
  render();
  if(saveQueued){saveQueued=false;if(ok)save()}
  return ok;
}
let qsT=null;function quietSave(){clearTimeout(qsT);qsT=setTimeout(async()=>{if(busy||!loadOk)return;try{const j=await api({password:PW,state:S});if(!j.ok)throw 0}catch(e){toast("Could not sync chart view","err")}},600)}
function flash(t){const e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
async function continueAsMember(){role="user";if(!loaded){render();await load()}render()}
function signOut(){role=null;PW="";tab="dash";msg="";md=null;myChart=null;busy=false;verifyingAdmin=false;loaded=false;loadOk=false;S=DEF();pq="";bq="";rm="";render()}
/* ---------- Calculation ---------- */
/* ---------- Guest meal helpers ---------- */
const gUnits=g=>Math.max(0,Number(g.count)||0)*((g.breakfast?MEAL_WEIGHTS[0]:0)+(g.lunch?MEAL_WEIGHTS[1]:0)+(g.dinner?MEAL_WEIGHTS[2]:0));
function guestShare(pred){const by={};let shared=0;(S.guests||[]).forEach(g=>{if(!pred(g.date))return;const u=gUnits(g);if(!g.mid||g.mid==="none")shared+=u;else by[g.mid]=(by[g.mid]||0)+u});const n=S.members.length;return {by,per:n?shared/n:0}}
function guestOn(d,id){const n=S.members.length;let u=0;(S.guests||[]).forEach(g=>{if(g.date!==d)return;if(g.mid===id)u+=gUnits(g);else if((!g.mid||g.mid==="none")&&n)u+=gUnits(g)/n});return u}
function guestUnitsOn(d){return (S.guests||[]).filter(g=>g.date===d).reduce((a,g)=>a+gUnits(g),0)}
function buildCalculation(month=null){
  const inMonth=d=>!month||(typeof d==="string"&&d.slice(0,7)===month);
  const tb=S.buys.filter(b=>inMonth(b.date)).reduce((a,b)=>a+(Number(b.amt)||0),0);
  const mealDates=Object.entries(S.meals).filter(([d])=>inMonth(d));
  const GS=guestShare(inMonth);
  const rows=S.members.map(m=>{
    let meals=0;
    mealDates.forEach(([,d])=>{const arr=d[m.id]||[0,0,0];meals+=(arr[0]?MEAL_WEIGHTS[0]:0)+(arr[1]?MEAL_WEIGHTS[1]:0)+(arr[2]?MEAL_WEIGHTS[2]:0)});
    meals+=(GS.by[m.id]||0)+GS.per;
    const paid=S.payments.filter(p=>p.mid===m.id&&inMonth(p.date)).reduce((a,p)=>a+(Number(p.amt)||0),0);
    return {mid:m.id,name:m.name,meals,paid};
  });
  const tm=rows.reduce((a,r)=>a+r.meals,0),rate=tm?tb/tm:0;
  rows.forEach(r=>{r.cost=rate*r.meals;r.refund=r.paid-r.cost});
  return {id:uid(),type:month?"monthly":"overall",month:month||null,tb,tm,rate,rows,calculatedAt:new Date().toISOString()};
}
function computeCalculation(){return buildCalculation(null)}
function calc(){
  const live=buildCalculation(null);
  const rows=live.rows.map(r=>({m:{id:r.mid,name:r.name},meals:r.meals,paid:r.paid,cost:r.cost,refund:r.refund}));
  return {tb:live.tb,tm:live.tm,rate:live.rate,rows,calculated:true,calculatedAt:S.calculation?.calculatedAt||null,live:true};
}
function addHistory(s){if(!Array.isArray(S.calculationHistory))S.calculationHistory=[];S.calculationHistory.unshift(JSON.parse(JSON.stringify(s)));S.calculationHistory=S.calculationHistory.slice(0,100)}
async function confirmCalculate(){if(role!=="admin")return;if(!await dlg({title:"Calculate overall report?",body:"Saves a new snapshot of the all-time calculation.",ok:"Calculate"}))return;S.calculation=computeCalculation();addHistory(S.calculation);save()}
function monthLabel(month){if(!month)return "All-time";const [y,m]=month.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})}
function monthShift(month,delta){const [y,m]=month.split("-").map(Number);const d=new Date(y,m-1+delta,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}
async function calculateMonth(){
  if(role!=="admin")return;
  const month=$("#reportMonth")?.value||rm;
  if(!month){toast("Choose a month first.","err");return}
  if(!await dlg({title:`Calculate ${monthLabel(month)}?`,body:"Saves a snapshot using only the chosen month meals, purchases and payments.",ok:"Calculate"}))return;
  const snapshot=buildCalculation(month);
  if(!S.monthCalculations||typeof S.monthCalculations!=="object")S.monthCalculations={};
  S.monthCalculations[month]=snapshot;addHistory(snapshot);save();
}
/* ---------- Layout helpers ---------- */
function pageTitle(k,t,s,a=""){return `<div class="heading"><div>${k?`<div class="eyebrow">${k}</div>`:""}<h2>${t}</h2><p>${s}</p></div>${a}</div>`}

function sbox(l,v){return `<div class="summarybox"><span>${l}</span><strong>${v}</strong></div>`}
function updList(admin){
  if(!S.updates.length)return '<div class="empty"><b>📣</b>No updates yet</div>';
  return S.updates.map(u=>`<div class="announcement"><div class="announceicon">✦</div><div class="body"><p>${esc(u.text)}</p><span class="date">${esc(u.date)}</span>${admin?"":reactBar(u.id)}${admin?`<div class="rowactions"><button class="btn soft tiny" onclick="editU('${u.id}')">Edit</button><button class="btn danger tiny" onclick="delU('${u.id}')">Delete</button></div>`:""}</div></div>`).join("");
}

function summary(c){return `<section class="hero"><div><small>Current meal rate</small><div class="big">${fmt(c.rate)}</div></div>
 <div class="mini"><div><span>Buying cost</span><b>${fmt(c.tb)}</b></div><div><span>Total meals</span><b>${fmt(c.tm)}</b></div><div><span>Members</span><b>${S.members.length}</b></div></div></section>`}

  </tbody></table></div><p class="note">Live totals...</p>`;
}
function dashTab(c,adm){

/* ---------- Updates ---------- */
function updTab(){
  const n=S.updates.length;
  return pageTitle("MESS BOARD",`Updates (${n}/3)`,"Important messages shared with all members.")+
  `<div class="panel"><div class="toolbar"><textarea class="control utbox" id="ut" rows="3" placeholder="Write an update for everyone"></textarea><button class="btn" onclick="addU()">＋ Add update</button></div>

function addU(){const t=$("#ut").value.trim();if(!t)return;if(S.updates.length>=3){toast("Only 3 updates allowed. Delete one first.","err");return}S.updates.push({id:uid(),text:t,date:today()});save()}
async function editU(id){const u=S.updates.find(x=>x.id===id);if(!u)return;const t=await dlg({title:"Edit update",body:"Ctrl+Enter to save.",text:u.text,ok:"Save"});if(!t)return;u.text=t;u.date=today();save()}
async function delU(id){if(await dlg({title:"Delete this update?",body:"Members will no longer see it.",ok:"Delete",danger:true})){S.updates=S.updates.filter(u=>u.id!==id);save()}}
/* ---------- Meals ---------- */
function mealsTab(){
  const d=md||today(),ok=canEdit(d),cur=S.meals[d]||{};
  const n=S.members.filter(m=>(cur[m.id]||[]).some(Boolean)).length;
  return pageTitle("DAILY RECORDS","Meals","Tick breakfast, lunch and dinner for each member.")+
  `<div class="summarystrip">${sbox("Date",esc(d))}<div class="summarybox"><span>Members with meals</span><strong id="mealCount">${n} / ${S.members.length}</strong></div>${sbox("Status",ok?"Open":"Locked")}</div>
  <div class="panel"><div class="toolbar"><input class="control" type="date" id="md" value="${d}" max="${today()}" min="${ago(2)}" onchange="md=this.value;render()">
  <span class="subtle" id="mealHint">${ok?"Open for entry":"🔒 Locked: meals can only be added on the day or within 2 days after."}</span>${ok&&S.members.length?'<span style="display:flex;gap:6px"><button class="btn soft tiny" onclick="setAllMeals(1)">Select all</button><button class="btn ghost tiny" onclick="setAllMeals(0)">Clear all</button></span>':""}</div>
  ${S.members.map(m=>{const v=cur[m.id]||[0,0,0];
    return `<div class="mrow"><span>${av(m.name)}${esc(m.name)}</span>${["Breakfast","Lunch","Dinner"].map((n,i)=>`<label class="${v[i]?"on":""}"><input type="checkbox" data-m="${m.id}" data-i="${i}" ${v[i]?"checked":""} ${ok?"":"disabled"}>${n}</label>`).join("")}</div>`
  }).join("")||'<div class="empty"><b>👥</b>Add members first.</div>'}
  ${ok&&S.members.length?'<div style="margin-top:16px"><button class="btn" onclick="saveMeals()" '+(busy?"disabled":"")+'>Save meals for this day</button></div>':""}</div>`;
}

  const d=$("#md").value;if(!canEdit(d))return;
  const o={};
  S.members.forEach(m=>o[m.id]=[0,1,2].map(i=>$(`[data-m="${m.id}"][data-i="${i}"]`).checked?1:0));
  S.meals[d]=o;save();
}

function membersTab(){
  return pageTitle("PEOPLE","Members",`${S.members.length} in your mess.`)+
  `<div class="panel"><div class="toolbar"><input class="control search" id="nm" placeholder="Member name" aria-label="Member name" onkeydown="if(event.key==='Enter')addM()"><button class="btn" onclick="addM()">＋ Add member</button></div>
  ${S.members.map(m=>`<div class="member-list-row"><span class="member-name" style="cursor:pointer" onclick="openMember('${m.id}')">${av(m.name)}${esc(m.name)}</span><button class="btn danger tiny" onclick="delM('${m.id}')">Remove</button></div>`).join("")||'<div class="empty"><b>👥</b>No members yet.</div>'}</div>`;
}

function openModal(k){
  if(k==="payment"&&!S.members.length){toast("Add members first.","err");return}
  modalKind=k;
  $("#modalTitle").textContent=k==="payment"?"Add a payment":"Add buying cost";
  $("#modalHint").textContent=k==="payment"?"Record a member deposit or advance. Date is set to today.":"Add a grocery or kitchen purchase. Date is set to today.";

function countUp(el,key){

  const to=parseFloat(t.replace(/,/g,"")),dec=(t.split(".")[1]||"").length,from=prevN.has(key)?prevN.get(key):0;prevN.set(key,to);

let fxC,fxX,fxW,fxH,fxP=[],fxRun=false;
function fxInit(){fxC=document.createElement("canvas");fxC.id="fx";document.body.prepend(fxC);fxX=fxC.getContext("2d");fxSize();addEventListener("resize",fxSize);document.addEventListener("visibilitychange",fxGo);fxGo()}
function fxSize(){fxW=fxC.width=innerWidth;fxH=fxC.height=innerHeight;fxP=Array.from({length:Math.round(Math.min(46,fxW*fxH/32000))},()=>({x:Math.random()*fxW,y:Math.random()*fxH,vx:(Math.random()-.5)*.35,vy:(Math.random()-.5)*.35,r:1+Math.random()*2}))}
function fxGo(){if(fxRun||!PREF.fx||RM||document.hidden)return;fxRun=true;requestAnimationFrame(fxLoop)}
function fxLoop(){
  if(!PREF.fx||document.hidden){fxRun=false;fxX.clearRect(0,0,fxW,fxH);return}
  fxX.clearRect(0,0,fxW,fxH);const col=(ACCENTS[PREF.accent]||ACCENTS.blue)[1];fxX.fillStyle=col;fxX.strokeStyle=col;
  for(let i=0;i<fxP.length;i++){const p=fxP[i];p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>fxW)p.vx*=-1;if(p.y<0||p.y>fxH)p.vy*=-1;
    fxX.globalAlpha=.5;fxX.beginPath();fxX.arc(p.x,p.y,p.r,0,6.283);fxX.fill();
    for(let j=i+1;j<fxP.length;j++){const q=fxP[j],dx=p.x-q.x,dy=p.y-q.y,d=dx*dx+dy*dy;if(d<14400){fxX.globalAlpha=(1-d/14400)*.25;fxX.beginPath();fxX.moveTo(p.x,p.y);fxX.lineTo(q.x,q.y);fxX.stroke()}}}
  fxX.globalAlpha=1;requestAnimationFrame(fxLoop);
}

function inPeriod(p){if(!p||p==="all")return()=>true;if(p==="last7"){const a=ago(6);return d=>String(d||"")>=a}if(p==="last30"){const a=ago(29);return d=>String(d||"")>=a}return d=>String(d||"").slice(0,7)===p}

  return {d,b,l,di,people,units:b*MEAL_WEIGHTS[0]+l*MEAL_WEIGHTS[1]+di*MEAL_WEIGHTS[2]+guestUnitsOn(d),buy:sumBy(S.buys.filter(x=>x.date===d),x=>x.amt),pay:sumBy(S.payments.filter(x=>x.date===d),x=>x.amt)}}
function calcR(pred){
  const tb=sumBy(S.buys.filter(b=>pred(b.date)),b=>b.amt),md=Object.entries(S.meals).filter(([d])=>pred(d));
  const GS=guestShare(pred);

    md.forEach(([,d])=>{const a=d[m.id]||[0,0,0];if(a[0]){bk++;meals+=MEAL_WEIGHTS[0]}if(a[1]){lu++;meals+=MEAL_WEIGHTS[1]}if(a[2]){dn++;meals+=MEAL_WEIGHTS[2]}});
    meals+=(GS.by[m.id]||0)+GS.per;
    return {id:m.id,name:m.name,meals,bk,lu,dn,paid:sumBy(S.payments.filter(p=>p.mid===m.id&&pred(p.date)),p=>p.amt)}});
  const tm=sumBy(rows,r=>r.meals),rate=tm?tb/tm:0;rows.forEach(r=>{r.cost=rate*r.meals;r.refund=r.paid-r.cost});

  const d=md||today(),ok=canEdit(d),cur=S.meals[d]||{},n=S.members.filter(m=>(cur[m.id]||[]).some(Boolean)).length;
  const chips=[0,1,2].map(k=>{const dd=ago(k);return `<button class="chip ${dd===d?"on":""}" onclick="md='${dd}';render()">${["Today","Yesterday","2 days ago"][k]}${dayHasMeals(dd)?'<i class="ok"></i>':""}</button>`}).join("");
  return pageTitle("DAILY RECORDS","Meals","Tick breakfast, lunch and dinner for each member.")+
  `<div class="chips" style="margin-bottom:14px">${chips}</div>
  <div class="summarystrip">${sbox("Date",esc(d))}<div class="summarybox"><span>Members with meals</span><strong id="mealCount">${n} / ${S.members.length}</strong></div>${sbox("Status",ok?"Open":"Locked")}</div>
  <div class="panel"><div class="toolbar"><input class="control" type="date" id="md" value="${d}" max="${today()}" onchange="md=this.value;render()">
  <span class="subtle" id="mealHint">${ok?"Open for entry":"🔒 Locked: meals can only be added on the day or within 2 days after."}</span>${ok&&S.members.length?'<span style="display:flex;gap:6px"><button class="btn soft tiny" onclick="openGuest()">＋ Guest meal</button><button class="btn soft tiny" onclick="setAllMeals(1)">Select all</button><button class="btn ghost tiny" onclick="setAllMeals(0)">Clear all</button></span>':""}</div>
  ${S.members.map(m=>{const v=cur[m.id]||[0,0,0];
    return `<div class="mrow"><span>${av(m.name)}${esc(m.name)}${offBadge(m.id,d)}${ok?`<button class="btn ghost tiny allbtn" onclick="rowAll('${m.id}')">All 3</button>`:""}</span>${["Breakfast","Lunch","Dinner"].map((nm,i)=>`<label class="${v[i]?"on":""}"><input type="checkbox" data-m="${m.id}" data-i="${i}" ${v[i]?"checked":""} ${ok?"":"disabled"}>${nm}</label>`).join("")}</div>`
  }).join("")||'<div class="empty"><b>👥</b>Add members first.</div>'}
  ${ok&&S.members.length?'<div style="margin-top:16px"><button class="btn" onclick="saveMeals()" '+(busy?"disabled":"")+'>Save meals for this day</button></div>':""}${guestDayList(d,ok)}</div>`;
}


/* ---------- Guest meals ---------- */
const MEAL_NAMES=["Breakfast","Lunch","Dinner"];
function guestLabel(g){const k=["breakfast","lunch","dinner"];return MEAL_NAMES.filter((n,i)=>g[k[i]]).join(", ")}
function guestDayList(d,ok){
  const l=(S.guests||[]).filter(g=>g.date===d);if(!l.length)return"";
  return `<div class="glabel" style="margin-top:20px">Guest meals on this day</div>`+l.map(g=>`<div class="srow" style="cursor:default"><span>${g.count} guest${g.count>1?"s":""} · ${esc(guestLabel(g))} · ${!g.mid||g.mid==="none"?"Shared equally":esc(memName(g.mid))}</span>${ok?`<button class="btn danger tiny" onclick="delGuest('${g.id}')">Remove</button>`:""}</div>`).join("");
}
function delGuest(id){if(role!=="admin")return;undoable("Guest meal removed",()=>{S.guests=(S.guests||[]).filter(g=>g.id!==id);save()})}
function openGuest(){
  if(role!=="admin")return;
  const d=($("#md")||{}).value||md||today();
  if(!canEdit(d)){toast("Guest meals can only be added on the day or within 2 days after.","err");return}
  if(!S.members.length){toast("Add members first.","err");return}
  if(!loadOk){toast("Data isn't loaded yet. Tap Retry first.","err");return}
  if(busy){toast("Please wait, saving in progress.","err");return}
  if($("#mealHint.dirty")){toast("Save the meals for this day first, then add guest meals.","err");return}
  const bg=document.createElement("div");bg.className="modalbg";bg.style.display="flex";
  const box=document.createElement("div");box.className="modal";box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");bg.appendChild(box);
  let count=1,fl=[0,0,0],working=false;
  const close=()=>{document.removeEventListener("keydown",kd,true);bg.remove()};
  const kd=e=>{if(e.key==="Escape"&&!working){e.stopPropagation();close()}};
  const tog=e=>{const i=e.target;if(i.matches&&i.matches("input[type=checkbox],input[type=radio]")){if(i.type==="radio")box.querySelectorAll(".gwho label").forEach(l=>l.classList.remove("on"));i.closest("label").classList.toggle("on",i.checked)}};
  box.addEventListener("change",tog);
  function step1(){
    box.innerHTML=`<h3>Guest meal</h3><div class="hint">Date: ${esc(d)}</div>
    <div class="field"><label>HOW MANY GUESTS?</label><input id="gCount" type="number" inputmode="numeric" min="1" max="50" step="1" value="${count}"></div>
    <div class="field"><label>MEAL TYPE</label><div class="gchips">${MEAL_NAMES.map((n,i)=>`<label class="${fl[i]?"on":""}"><input type="checkbox" data-gi="${i}" ${fl[i]?"checked":""}>${n}</label>`).join("")}</div></div>
    <div class="modalactions"><button class="btn ghost" data-a="x">Cancel</button><button class="btn" data-a="next">Submit</button></div>`;
    setTimeout(()=>{const c=box.querySelector("#gCount");if(c){c.focus();c.select()}},40);
  }
  function step2(){
    const sum=`${count} guest${count>1?"s":""} · ${MEAL_NAMES.filter((n,i)=>fl[i]).join(", ")}`;
    box.innerHTML=`<h3>Whose guest?</h3><div class="hint">${esc(sum)}</div>
    <div class="gwho">${S.members.map(m=>`<label><input type="radio" name="gw" value="${m.id}">${av(m.name)}${esc(m.name)}</label>`).join("")}<label><input type="radio" name="gw" value="none"><span>None of them <small style="color:var(--muted);font-weight:600">· cost shared equally by all ${S.members.length} members</small></span></label></div>
    <div class="modalactions"><button class="btn ghost" data-a="back">Back</button><button class="btn" data-a="go">Confirm</button></div>`;
  }
  async function finish(){
    const r=box.querySelector('input[name="gw"]:checked');
    if(!r){toast("Choose whose guest it is, or None of them.","err");return}
    if(busy){toast("Please wait, saving in progress.","err");return}
    const mid=r.value;if(mid!=="none"&&!S.members.some(m=>m.id===mid)){toast("Member not found.","err");return}
    const g={id:uid(),date:d,count,breakfast:fl[0],lunch:fl[1],dinner:fl[2],mid};
    if(!Array.isArray(S.guests))S.guests=[];
    S.guests.push(g);
    close();
    const ok=await save();
    if(!ok){S.guests=(S.guests||[]).filter(x=>x.id!==g.id);render()}
  }
  box.addEventListener("click",e=>{
    const a=e.target.closest("[data-a]");if(!a||working)return;
    const k=a.dataset.a;
    if(k==="x")close();
    else if(k==="back")step1();
    else if(k==="go")finish();
    else if(k==="next"){
      const c=parseInt(box.querySelector("#gCount").value,10);
      const f=[0,1,2].map(i=>box.querySelector(`[data-gi="${i}"]`).checked?1:0);
      if(!(c>=1&&c<=50)){toast("Enter a guest count between 1 and 50.","err");return}
      if(!f.some(Boolean)){toast("Choose at least one meal type.","err");return}
      count=c;fl=f;step2();
    }
  });
  box.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="gCount"){e.preventDefault();box.querySelector('[data-a="next"]').click()}});
  bg.addEventListener("click",e=>{if(e.target===bg&&!working)close()});
  document.addEventListener("keydown",kd,true);
  step1();document.body.appendChild(bg);
}

/* ---------- Reactions on updates ---------- */
const REACTS=["👍","❤️","💯","😂","🤩","😭"];
const RCOL=["#3b82f6","#f43f5e","#f97316","#eab308","#a855f7","#06b6d4"];
const DEV=(()=>{let v=LS.get("messDev","");if(!/^[A-Za-z0-9_-]{4,32}$/.test(v)){v=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);LS.set("messDev",v)}return v})();
/* A reaction is saved under the member's id when they've said who they are, otherwise under this device's id ("None of them"). */
const myVoter=()=>PREF.me&&S.members.some(m=>m.id===PREF.me)?PREF.me:DEV;
function reactBtns(id){
  const r=(S.reactions&&S.reactions[id])||{},adm=role==="admin",me=myVoter();
  return REACTS.map((e,i)=>{const v=Array.isArray(r[e])?r[e]:[],n=v.length,cnt=n?`<b>${n}</b>`:"";
    return adm
      ?`<button class="rx adm" type="button" data-r="${i}" style="--rc:${RCOL[i]}" data-tip="Hold for 2 seconds to see who reacted" aria-label="${e} ${n} reaction${n===1?"":"s"}. Hold for 2 seconds to see who reacted">${e}${cnt}</button>`
      :`<button class="rx ${v.includes(me)?"on":""}" type="button" style="--rc:${RCOL[i]}" onclick="react('${id}',${i})" aria-label="React ${e}">${e}${cnt}</button>`}).join("");
}
function reactBar(id){return `<div class="reacts" data-u="${id}">${reactBtns(id)}</div>`}
function refreshReacts(id){document.querySelectorAll(`.reacts[data-u="${id}"]`).forEach(el=>{el.innerHTML=reactBtns(id)})}
/* "Who are you?" popup. Resolves to a member id, "none", or null (cancelled). */
function askWho(){return new Promise(res=>{
  const bg=document.createElement("div");bg.className="modalbg";bg.style.display="flex";
  bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" style="max-height:92vh;overflow:auto"><h3>👋 Who are you?</h3><div class="hint">Pick your name so your reaction is saved under it. You can change this anytime in Settings.</div><div class="whol">${S.members.map(m=>`<button type="button" class="whor" data-w="${esc(m.id)}">${av(m.name)}<span>${esc(m.name)}</span></button>`).join("")}<button type="button" class="whor" data-w="none"><span class="whoi">🙈</span><span>None of them<small>React without a name</small></span></button></div><div class="modalactions"><button class="btn ghost" type="button" data-w="">Cancel</button></div></div>`;
  let closed=false;
  const done=v=>{if(closed)return;closed=true;document.removeEventListener("keydown",kd,true);bg.remove();res(v)};
  const kd=e=>{if(e.key==="Escape"){e.stopPropagation();done(null)}};
  bg.addEventListener("click",e=>{const b=e.target.closest("[data-w]");if(b)done(b.dataset.w===""?null:b.dataset.w);else if(e.target===bg)done(null)});
  document.addEventListener("keydown",kd,true);document.body.appendChild(bg);
})}
async function react(id,i){
  if(role==="admin")return;
  if(!S.reactions||typeof S.reactions!=="object")S.reactions={};
  if(S.members.length&&!(PREF.me&&S.members.some(m=>m.id===PREF.me))){
    const w=await askWho();if(w===null)return;
    if(w!=="none"&&S.members.some(m=>m.id===w)){PREF.me=w;LS.set(meKey(),w);render()}
    if(!S.reactions||typeof S.reactions!=="object")S.reactions={};
  }
  const e=REACTS[i],voter=myVoter();
  const prev=JSON.stringify(S.reactions[id]||{}),cur=JSON.parse(prev);
  const had=(cur[e]||[]).includes(voter);
  Object.keys(cur).forEach(k=>{cur[k]=cur[k].filter(v=>v!==voter);if(!cur[k].length)delete cur[k]});
  if(!had)(cur[e]=cur[e]||[]).push(voter);
  S.reactions[id]=cur;refreshReacts(id);
  try{
    const j=await api({action:"react",id,emoji:e,voter});
    if(!j||!j.ok)throw new Error((j&&j.error)||"failed");
    S.reactions[id]=j.reactions||{};refreshReacts(id);
  }catch(err){S.reactions[id]=JSON.parse(prev);refreshReacts(id);toast("Could not save your reaction.","err")}
}
/* Admin: read-only reactions. Hold one for 2 seconds to see who reacted. */
async function pullReactions(){
  try{const r=await fetch(API_URL+qs(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();
    const x=j&&j.state&&j.state.reactions;
    if(x&&typeof x==="object"&&!Array.isArray(x)){S.reactions=x;document.querySelectorAll(".reacts[data-u]").forEach(el=>refreshReacts(el.dataset.u))}}catch(e){}
}
setInterval(()=>{if(role==="admin"&&loaded&&loadOk&&tab==="dash"&&!document.hidden)pullReactions()},30000);
function reactorsHTML(id,i){
  const e=REACTS[i],raw=((S.reactions||{})[id]||{})[e],list=[...new Set(Array.isArray(raw)?raw:[])];
  const named=list.filter(v=>S.members.some(m=>m.id===v)),unk=list.length-named.length,total=list.length;
  const rows=named.map(v=>{const nm=memName(v);return `<div class="whor static">${av(nm)}<span>${esc(nm)}</span></div>`}).join("")+(unk?`<div class="whor static"><span class="whoi">❔</span><span>Unknown${unk>1?" × "+unk:""}<small>Didn't pick a name</small></span></div>`:"");
  return `<div class="rxhead"><span class="rxbig" style="--rc:${RCOL[i]}">${e}</span><div><h3 style="font-size:18px">Who reacted</h3><div class="hint">${total?total+(total>1?" people":" person")+" reacted with "+e:"No one has reacted with "+e+" yet"}</div></div></div>${total?`<div class="whol">${rows}</div>`:""}<div class="modalactions"><button class="btn ghost" type="button" data-c="1">Close</button></div>`;
}
function showReactors(id,i){
  tipEl.style.opacity=0;
  const bg=document.createElement("div");bg.className="modalbg";bg.style.display="flex";
  const box=document.createElement("div");box.className="modal";box.setAttribute("role","dialog");box.setAttribute("aria-modal","true");bg.appendChild(box);
  const paint=()=>{box.innerHTML=reactorsHTML(id,i)},t0=Date.now();paint();
  const close=()=>{document.removeEventListener("keydown",kd,true);bg.remove()};
  const kd=e=>{if(e.key==="Escape"){e.stopPropagation();close()}};
  bg.addEventListener("click",e=>{if(Date.now()-t0<450)return;if(e.target===bg||e.target.closest("[data-c]"))close()});
  document.addEventListener("keydown",kd,true);document.body.appendChild(bg);
  pullReactions().then(()=>{if(bg.isConnected)paint()});
}
let hold=null;
function holdStop(){if(!hold)return;clearTimeout(hold.t);hold.el.classList.remove("holding");hold=null}
document.addEventListener("pointerdown",e=>{
  const b=role==="admin"&&e.target.closest?e.target.closest(".rx.adm"):null;if(!b)return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  holdStop();const u=b.closest(".reacts").dataset.u,i=+b.dataset.r;
  b.classList.add("holding");
  hold={el:b,x:e.clientX,y:e.clientY,t:setTimeout(()=>{const el=hold&&hold.el;if(el)el.classList.remove("holding");hold=null;if(navigator.vibrate)try{navigator.vibrate(25)}catch(_){}showReactors(u,i)},2000)};
});
document.addEventListener("pointermove",e=>{if(hold&&(Math.abs(e.clientX-hold.x)>10||Math.abs(e.clientY-hold.y)>10))holdStop()});
["pointerup","pointercancel","dragstart"].forEach(t=>document.addEventListener(t,holdStop));
document.addEventListener("contextmenu",e=>{if(e.target.closest&&e.target.closest(".rx.adm"))e.preventDefault()});

/* ---------- Meal-off and guest requests ---------- */
const ahead=n=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const reqMeals=r=>MEAL_NAMES.filter((n,i)=>r[["breakfast","lunch","dinner"][i]]).join(", ");
const reqChip=st=>`<span class="rqst ${st==="approved"?"ok":st==="rejected"?"no":""}">${st==="approved"?"Approved":st==="rejected"?"Rejected":"Pending"}</span>`;
function reqBlock(r){if(r.type!=="guest"||canEdit(r.date))return"";return r.date>today()?"Opens on "+nice(r.date):"Expired"}
const REQ_MEALS=[["breakfast","🌅","Breakfast","#f59e0b"],["lunch","☀️","Lunch","#12a37f"],["dinner","🌙","Dinner","#6366f1"]];
const reqMealChips=r=>`<div class="rqmeals">${REQ_MEALS.filter(m=>r[m[0]]).map(m=>`<span class="rqmeal" style="--mc:${m[3]}">${m[1]} ${m[2]}</span>`).join("")}</div>`;
const dayNice=d=>new Date(d+"T00:00:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const relDay=d=>{const n=Math.round((new Date(d+"T00:00:00")-new Date(today()+"T00:00:00"))/864e5);return n===0?"Today":n===1?"Tomorrow":n===-1?"Yesterday":n>0?"In "+n+" days":(-n)+" days ago"};
function timeAgo(t){const ms=Date.parse(t);if(!ms)return"";const m=Math.max(0,(Date.now()-ms)/60000);if(m<1)return"just now";if(m<60)return Math.floor(m)+"m ago";const h=m/60;if(h<24)return Math.floor(h)+"h ago";const d=Math.floor(h/24);return d<30?d+"d ago":nice(String(t).slice(0,10))}
const reqWho=r=>r.type==="guest"?`👥 ${r.count} guest${r.count>1?"s":""}`:"🚫 Meal off";
let reqView="pending";
function setReqView(v){reqView=v==="history"?"history":"pending";const el=$("#reqPanel");if(el)el.innerHTML=reqInner()}
function rqCard(r){
  const guest=r.type==="guest",b=reqBlock(r),ago_=timeAgo(r.createdAt);
  const note=b?`<div class="rqwarn">🔒 ${b==="Expired"?"This date is outside the 2-day window, so it can only be rejected.":esc(b)+". You can approve it then."}</div>`
    :`<div class="rqhint">${guest?"Approving adds this guest meal to that day.":canEdit(r.date)?"Approving turns these meals off for that day.":"Approving saves it and shows an “Off” badge on that day."}</div>`;
  return `<div class="rqcard ${guest?"guest":"off"}" data-rq="${esc(r.id)}">
  <div class="rqtop">${av(memName(r.mid))}<div class="rqwho"><b>${esc(memName(r.mid))}</b>${ago_?`<small>Requested ${esc(ago_)}</small>`:""}</div><span class="rqtype">${reqWho(r)}</span></div>
  <div class="rqmeta"><span class="rqdate">📅 ${esc(dayNice(r.date))}<i>${esc(relDay(r.date))}</i></span>${reqMealChips(r)}</div>
  ${note}
  <div class="rqact"><button class="btn calc ${b?"locked":""}" type="button" ${b?'aria-disabled="true"':`onclick="reqAct('${esc(r.id)}','approve')"`}>✓ Approve</button><button class="btn danger" type="button" onclick="reqAct('${esc(r.id)}','reject')">✕ Reject</button></div></div>`;
}
function rqRow(r){
  return `<div class="rqrow ${r.type==="guest"?"guest":"off"}">${av(memName(r.mid))}<div class="rqrw"><b>${esc(memName(r.mid))}</b><small>${reqWho(r)} · ${esc(reqMeals(r))} · ${esc(nice(r.date))}</small></div>${reqChip(r.status)}</div>`;
}
function reqInner(){
  const adm=role==="admin",all=(Array.isArray(S.requests)?S.requests:[]).slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  if(adm){
    const pend=all.filter(r=>r.status==="pending"),done=all.filter(r=>r.status!=="pending"),hist=reqView==="history";

  <div class="modalactions"><button class="btn ghost" data-a="x">Cancel</button><button class="btn" data-a="go">Send request</button></div></div>`;
  let sending=false;
  const close=()=>{document.removeEventListener("keydown",kd,true);bg.remove()};
  const kd=e=>{if(e.key==="Escape"&&!sending){e.stopPropagation();close()}};

    if(a.dataset.a==="x"){close();return}
    const mid=bg.querySelector("#rqMe").value,date=bg.querySelector("#rqDate").value;
    const f=[0,1,2].map(i=>bg.querySelector(`[data-ri="${i}"]`).checked?1:0);
    const count=guest?parseInt(bg.querySelector("#rqCount").value,10):0;
    if(!mid){toast("Choose your name.","err");return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<ago(2)||date>ahead(7)){toast("Choose a date from 2 days ago to 7 days ahead.","err");return}
    if(guest&&!(count>=1&&count<=50)){toast("Enter a guest count between 1 and 50.","err");return}
    if(!f.some(Boolean)){toast("Choose at least one meal.","err");return}
    sending=true;a.disabled=true;a.textContent="Sending…";
    try{
      const j=await api({action:"request",req:{type,mid,date,count,breakfast:f[0],lunch:f[1],dinner:f[2]}});

      close();render();flash("Request sent");
    }catch(err){sending=false;a.disabled=false;a.textContent="Send request";toast("Could not send request. "+(err.message||""),"err")}
  });

async function reqAct(id,act){
  if(role!=="admin"||busy)return;
  const sel=()=>document.querySelector(`[data-rq="${CSS.escape(id)}"]`),c0=sel();if(c0)c0.classList.add("working");
  try{await reqActRun(id,act)}finally{const c=sel();if(c)c.classList.remove("working")}
}
async function reqActRun(id,act){
  if(role!=="admin"||busy)return;
  const r=(S.requests||[]).find(x=>x.id===id);if(!r||r.status!=="pending")return;
  const yes=act==="approve";let saved=false;
  if(yes){
    if(r.type==="guest"){
      if(!canEdit(r.date)){toast("Guest meals can only be added on the day or within 2 days after.","err");return}
      if(!S.members.some(m=>m.id===r.mid)){toast("This member no longer exists.","err");return}
      if(!Array.isArray(S.guests))S.guests=[];
      if(!S.guests.some(g=>g.req===id))S.guests.push({id:uid(),date:r.date,count:r.count,breakfast:r.breakfast?1:0,lunch:r.lunch?1:0,dinner:r.dinner?1:0,mid:r.mid,req:id});
      if(!await save()){S.guests=(S.guests||[]).filter(g=>g.req!==id);render();return}
      saved=true;
    }else if(canEdit(r.date)){
      const a=(S.meals[r.date]||{})[r.mid],K=["breakfast","lunch","dinner"];
      if(Array.isArray(a)&&K.some((k,i)=>r[k]&&a[i])){K.forEach((k,i)=>{if(r[k])a[i]=0});if(!await save())return;saved=true}
    }
  }
  try{
    const j=await api({action:"reqStatus",password:PW,id,status:yes?"approved":"rejected"});
    if(!j||!j.ok)throw new Error((j&&j.error)||"failed");
    const x=(S.requests||[]).find(q=>q.id===id);if(x)x.status=yes?"approved":"rejected";
    render();if(!saved)flash(yes?"Approved":"Rejected");
  }catch(err){toast("Could not update the request. "+(err.message||""),"err")}
}

/* ---------- fixed meals + carry forward ---------- */
function fixedFor(m,month,st){
  if(!st.fixedEnabled)return 0;
  const j=DATE_OK(m.joined)?m.joined:"";if(!j)return st.fixedMeals;
  const jm=j.slice(0,7);if(jm>month)return 0;
  if(jm===month&&st.lateEnabled!==false)return st.lateFixed;
  return st.fixedMeals;
}
function dataMonths(){const s=new Set();Object.keys(S.meals).forEach(d=>s.add(d.slice(0,7)));S.buys.forEach(b=>b.date&&s.add(String(b.date).slice(0,7)));return [...s].filter(x=>/^\d{4}-\d{2}$/.test(x)).sort()}
/* month=null: all-time (fixed meals applied month by month). Live numbers on the dashboard stay actual-meal based. */
function buildFixed(month=null){
  const st=settings(),base=buildCalculation(month),months=month?[month]:dataMonths(),per=months.map(m=>month?base:buildCalculation(m)),cin=month?((S.carry||{})[month]||{}):{};
  const rows=S.members.map(m=>{
    const b=base.rows.find(r=>r.mid===m.id)||{meals:0,paid:0};let billed=0;
    per.forEach((p,i)=>{const a=(p.rows.find(r=>r.mid===m.id)||{}).meals||0;billed+=Math.max(a,fixedFor(m,months[i],st))});
    if(!months.length)billed=b.meals;
    const carry=Number(cin[m.id])||0;
    return {mid:m.id,name:m.name,actual:b.meals,meals:billed,fixedApplied:billed>b.meals+1e-9,paid:b.paid+carry,carry};
  });
  const tm=rows.reduce((a,r)=>a+r.meals,0),rate=tm?base.tb/tm:0;
  rows.forEach(r=>{r.cost=rate*r.meals;r.refund=r.paid-r.cost});
  return {id:uid(),type:month?"monthly":"overall",month:month||null,tb:base.tb,tm,rate,rows,fixed:true,calculatedAt:new Date().toISOString()};
}

}

/* ---------- 4. Mess Stories: 24-hour photo stories, love, hold-to-pause ---------- */
const STORY_VIEW_MS=10000;
const stFull=id=>"https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w1200";
const stSmall=id=>"https://drive.google.com/thumbnail?id="+encodeURIComponent(id)+"&sz=w360";
const stAlive=m=>Date.parse(m.expires)>Date.now();
const stLimits=()=>Object.assign({memberMax:4,messMax:14},S.storyStats||{});
const stLive=()=>(S.stories||[]).filter(stAlive);
function stLeft(m){const ms=Date.parse(m.expires)-Date.now();if(ms<=0)return"expired";const h=Math.floor(ms/36e5),mn=Math.floor(ms%36e5/6e4);return h?h+"h "+mn+"m left":Math.max(1,mn)+"m left"}
function stQuota(){const L=stLimits(),live=stLive(),me=myVoter();return{L,all:live.length,mine:live.filter(m=>m.voter===me).length}}
const seenKey=()=>"messStory:"+(MESS?MESS.code:"")+":"+myVoter();
const SEEN=()=>{try{return new Set(JSON.parse(LS.get(seenKey(),"[]")))}catch(e){return new Set()}};
const seenAdd=ids=>{const s=SEEN();ids.forEach(i=>s.add(i));LS.set(seenKey(),JSON.stringify([...s].slice(-300)))};
function storyGroups(){
  const by={},list=[],seen=SEEN();
  stLive().sort((a,b)=>a.at<b.at?-1:1).forEach(m=>{if(!by[m.voter]){by[m.voter]={voter:m.voter,name:m.name,items:[]};list.push(by[m.voter])}by[m.voter].items.push(m)});
  const unseen=g=>g.items.some(m=>!seen.has(m.id))?1:0;
  return list.sort((a,b)=>(unseen(b)-unseen(a))||b.items[b.items.length-1].at.localeCompare(a.items[a.items.length-1].at));
}
function storiesRow(){
  const g=storyGroups(),seen=SEEN(),me=myVoter();
  const add=`<button class="story add" type="button" onclick="storyAdd()" aria-label="Add story"><span class="sring"><span class="sav">＋</span></span><small>Add story</small></button>`;
  return add+g.map(x=>{const last=x.items[x.items.length-1],all=x.items.every(m=>seen.has(m.id));
    return `<button class="story ${all?"seen":""}" type="button" onclick="openStory('${esc(x.voter)}')"><span class="sring"><span class="sface">${av(x.name)}<img src="${stSmall(last.fileId)}" alt="" loading="lazy" onerror="this.remove()"></span>${x.items.length>1?`<b class="scount">${x.items.length}</b>`:""}</span><small>${esc(x.voter===me?"Your story":x.name.split(" ")[0])}</small></button>`}).join("");
}
const storiesPanel=()=>`<div class="panel"><div class="panelhead"><div><h3>Mess Stories</h3></div></div><div class="stories">${storiesRow()}</div></div>`;
const refreshStories=()=>{document.querySelectorAll(".stories").forEach(e=>{e.innerHTML=storiesRow()})};
setInterval(()=>{if(!document.querySelector(".stv"))refreshStories()},60000);

/* --- add stories --- */
let stBusy=false;
async function storyAdd(){
  if(stBusy)return;
  const me=await ensureWho();if(!me)return;
  if(!S.members.some(m=>m.id===me)){toast("Choose who you are first, then add your story.","err");return}
  const q=stQuota(),room=Math.min(q.L.memberMax-q.mine,q.L.messMax-q.all);
  if(room<=0){toast(q.L.memberMax-q.mine<=0?"You already have "+q.L.memberMax+" stories live.":"Your mess already has "+q.L.messMax+" stories live.","err");return}
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";inp.multiple=room>1;
  inp.onchange=()=>{const fs=[...inp.files].filter(f=>/^image\//.test(f.type));if(!fs.length)return;if(fs.length>room)toast("Only "+room+" more allowed right now, using the first "+room+".");stCompose(me,fs.slice(0,room))};
  inp.click();
}
const stCompress=f=>new Promise((res,rej)=>{
  if(f.size>30e6)return rej(new Error("That photo is too large"));
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{URL.revokeObjectURL(url);const sc=Math.min(1,1280/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    let q=.82,d;do{d=cv.toDataURL("image/jpeg",q);q-=.12}while(d.length*.75>1.9*1024*1024&&q>.2);
    d.length*.75>2*1024*1024?rej(new Error("Photo must be 2 MB or smaller")):res(d)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("Could not read that photo"))};img.src=url});
async function stCompose(me,files){
  const bg=document.createElement("div");bg.className="modalbg";bg.style.display="flex";document.body.appendChild(bg);
  bg.innerHTML=`<div class="modal"><h3>New story</h3><div class="hint">Preparing photos…</div></div>`;
  const out=[];for(const f of files){try{out.push({d:await stCompress(f),cap:""})}catch(e){toast(e.message,"err")}}
  if(!out.length){bg.remove();return}
  let busy=false,closed=false;
  const kd=e=>{if(e.key==="Escape"&&!busy){e.stopPropagation();close()}};
  const close=()=>{if(closed)return;closed=true;document.removeEventListener("keydown",kd,true);bg.remove()};
  const paint=msg=>{bg.innerHTML=`<div class="modal" role="dialog" aria-modal="true" style="max-height:92vh;overflow:auto"><h3>New story</h3><div class="hint">Your mess can see it for 24 hours, then it is deleted automatically.</div>
    <div class="stcomp">${out.map((o,i)=>`<div class="stc"><img src="${o.d}" alt=""><input class="control" maxlength="120" placeholder="Caption (optional)" value="${esc(o.cap)}" data-i="${i}" ${busy?"disabled":""}><button type="button" class="btn danger tiny" data-rm="${i}" aria-label="Remove photo" ${busy?"disabled":""}>✕</button></div>`).join("")}</div>
    <div class="modalactions"><button class="btn ghost" data-c="1" ${busy?"disabled":""}>Cancel</button><button class="btn" data-ok="1" ${busy?"disabled":""}>${busy?esc(msg||"Sharing…"):"Share "+out.length+" photo"+(out.length>1?"s":"")}</button></div></div>`};
  bg.addEventListener("input",e=>{const i=e.target.dataset&&e.target.dataset.i;if(i!==undefined&&out[i])out[i].cap=e.target.value});
  bg.addEventListener("click",async e=>{
    const t=e.target.closest("button");if(!t||busy){if(!t&&e.target===bg&&!busy)close();return}
    if(t.dataset.rm!==undefined){out.splice(+t.dataset.rm,1);if(!out.length)return close();paint()}
    else if(t.dataset.c)close();
    else if(t.dataset.ok){
      busy=true;stBusy=true;paint("Sharing 1/"+out.length+"…");let done=0,failed=false;
      for(const o of out){
        try{const j=await act({action:"storyPost",voter:me,caption:o.cap.trim(),image:o.d.split(",")[1]});S.stories=(S.stories||[]).concat([j.item]);done++;if(done<out.length)paint("Sharing "+(done+1)+"/"+out.length+"…")}
        catch(er){toast(er.message,"err");failed=true;break}
      }
      busy=false;stBusy=false;close();refreshStories();
      if(done)toast(done+(done>1?" stories":" story")+" shared");
      if(failed)load(true).then(refreshStories);
    }
  });
  document.addEventListener("keydown",kd,true);paint();
}

/* --- story viewer: 10 s per photo, hold to pause, love, admin swipe-down for reactions --- */
function openStory(vid,startId){
  if(document.querySelector(".stv"))return;
  const groups=storyGroups();if(!groups.some(x=>x.voter===vid))return;
  const flat=[];groups.forEach(G=>G.items.forEach(m=>flat.push({G,m})));
  const dead=new Set(),reasons=new Set(),admin=role==="admin",me=myVoter(),seen=SEEN();
  let p=startId?flat.findIndex(x=>x.m.id===startId):flat.findIndex(x=>x.G.voter===vid&&!seen.has(x.m.id));
  if(p<0)p=flat.findIndex(x=>x.G.voter===vid);if(p<0)return;
  const ov=document.createElement("div");ov.className="stv";ov.setAttribute("role","dialog");ov.setAttribute("aria-modal","true");document.body.appendChild(ov);
  const prevOverflow=document.body.style.overflow;document.body.style.overflow="hidden";
  let tm=null,rem=STORY_VIEW_MS,t0=0,running=false,loaded=false,closed=false,sheetOpen=false,armDel=false;
  const ok=k=>{const x=flat[k];return !!x&&stAlive(x.m)&&!dead.has(x.m.id)};
  const clear=()=>{clearTimeout(tm);tm=null};
  function tick(){if(closed||!loaded||reasons.size||running)return;running=true;t0=Date.now();tm=setTimeout(()=>{running=false;go(1)},rem);ov.classList.remove("paused")}
  function halt(){if(running){rem=Math.max(300,rem-(Date.now()-t0));clear();running=false}ov.classList.add("paused")}
  const hold=r=>{reasons.add(r);halt()};
  const free=r=>{reasons.delete(r);if(!reasons.size)tick()};
  function go(d){
    let k=p+d;while(k>=0&&k<flat.length&&!ok(k))k+=d;
    if(k>=flat.length)return close();
    if(k<0){if(ok(p))show();else close();return}
    p=k;show();
  }
  function paintLove(m){const b=ov.querySelector(".stlove");if(!b)return;b.classList.toggle("on",!!m.loved);b.querySelector(".h").textContent=m.loved?"❤️":"🤍";b.querySelector("b").textContent=m.loves||0}
  function show(){
    clear();running=false;loaded=false;rem=STORY_VIEW_MS;armDel=false;sheetOpen=false;reasons.delete("sheet");reasons.delete("del");
    if(!ok(p)){go(1);return}
    const{G,m}=flat[p];seenAdd([m.id]);const idx=G.items.findIndex(x=>x.id===m.id);
    ov.classList.remove("paused");
    ov.innerHTML=`<div class="stmedia"><img class="stimg" alt="" draggable="false"></div><div class="stspin"></div>
    <div class="stbars">${G.items.map((x,j)=>`<i class="${j<idx?"done":j===idx?"cur":""}"></i>`).join("")}</div>
    <div class="sthead">${av(G.name)}<div><b>${esc(G.voter===me?"Your story":G.name)}</b><small>${esc(timeAgo(m.at))} · ${esc(stLeft(m))}</small></div>${m.voter===me||admin?`<button class="stx" data-s="del" aria-label="Delete story">🗑</button>`:""}<button class="stx" data-s="x" aria-label="Close">✕</button></div>
    ${m.caption?`<div class="stcap">${esc(m.caption)}</div>`:""}
    <div class="stfoot"><button class="stlove ${m.loved?"on":""}" data-s="love" aria-label="Love this story"><span class="h">${m.loved?"❤️":"🤍"}</span><b>${m.loves||0}</b></button>${admin?`<button class="stwho" data-s="who">👀 Who reacted · swipe down</button>`:""}</div>
    <div class="stsheet" id="stSheet"><div class="shh"><i></i><b></b><button class="stx2" data-s="sx" aria-label="Close list">✕</button></div><div class="shb"></div></div>`;
    const img=ov.querySelector(".stimg");
    img.onload=()=>{if(closed||!ov.contains(img))return;loaded=true;img.classList.add("in");const sp=ov.querySelector(".stspin");if(sp)sp.remove();const b=ov.querySelector(".stbars i.cur");if(b)b.classList.add("go");if(document.hidden)reasons.add("hidden");tick()};
    img.onerror=()=>{if(closed||!ov.contains(img))return;dead.add(m.id);go(1)};
    img.src=stFull(m.fileId);
    for(let k=p+1;k<flat.length;k++)if(ok(k)){new Image().src=stFull(flat[k].m.fileId);break}
  }
  async function love(){
    const m=flat[p].m,was=!!m.loved,n=m.loves||0;
    m.loved=!was;m.loves=Math.max(0,n+(was?-1:1));paintLove(m);
    const b=ov.querySelector(".stlove");if(b&&!was){b.classList.add("pop");setTimeout(()=>b.classList.remove("pop"),260)}
    try{const j=await act({action:"storyLove",id:m.id,voter:me});m.loved=j.loved;m.loves=j.loves}
    catch(e){m.loved=was;m.loves=n;toast(e.message,"err")}
    if(!closed&&flat[p]&&flat[p].m.id===m.id)paintLove(m);
  }
  async function who(){
    if(!admin||sheetOpen)return;const m=flat[p].m;sheetOpen=true;hold("sheet");
    const sh=ov.querySelector("#stSheet"),b=sh.querySelector(".shb"),h=sh.querySelector(".shh b");sh.classList.add("open");
    h.textContent="❤️ "+(m.loves||0)+" reacted";b.innerHTML='<p class="note">Loading…</p>';
    try{const j=await adminAct({action:"storyLovers",id:m.id});if(closed||!sheetOpen||flat[p].m.id!==m.id)return;
      h.textContent="❤️ "+j.lovers.length+" reacted";
      b.innerHTML=j.lovers.length?j.lovers.map(l=>`<div class="stlr">${av(l.name)}<div><b>${esc(l.name)}</b><small>${esc(timeAgo(l.at))}</small></div><span>❤️</span></div>`).join(""):'<p class="note">No reactions yet.</p>';
    }catch(e){if(!closed&&sheetOpen)b.innerHTML='<p class="note">'+esc(e.message)+'</p>'}
  }
  function closeSheet(){if(!sheetOpen)return;sheetOpen=false;const sh=ov.querySelector("#stSheet");if(sh)sh.classList.remove("open");free("sheet")}
  async function del(btn){
    const m=flat[p].m;
    if(!armDel){armDel=true;btn.textContent="Tap again";hold("del");setTimeout(()=>{if(armDel&&!closed&&btn.isConnected){armDel=false;btn.textContent="🗑";free("del")}},3500);return}
    armDel=false;
    try{if(m.voter===me)await act({action:"storyDelete",id:m.id,voter:me});else await adminAct({action:"storyAdminDelete",id:m.id});
      S.stories=(S.stories||[]).filter(x=>x.id!==m.id);dead.add(m.id);reasons.delete("del");go(1)}
    catch(e){toast(e.message,"err");if(btn.isConnected){btn.textContent="🗑";free("del")}}
  }
  function close(){if(closed)return;closed=true;clear();document.removeEventListener("keydown",kd,true);document.removeEventListener("visibilitychange",vis);ov.remove();document.body.style.overflow=prevOverflow;refreshStories()}
  const kd=e=>{if(e.key==="Escape"){e.stopPropagation();sheetOpen?closeSheet():close()}else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key==="ArrowDown"&&admin)who()};
  const vis=()=>{document.hidden?hold("hidden"):free("hidden")};

  /* gestures: tap sides = prev/next, hold = pause (unlimited), swipe down = close (admin: who reacted) */
  let g0=null,holdT=null,held=false,swiped=false,moved=false,sh0=null;
  const unhold=()=>{if(held){held=false;ov.classList.remove("holding");free("hold")}};
  ov.addEventListener("pointerdown",e=>{
    if(e.pointerType==="mouse"&&e.button!==0)return;
    if(e.target.closest(".shh")){sh0=e.clientY;return}
    if(e.target.closest("button,.stsheet"))return;
    if(sheetOpen){closeSheet();return}
    g0={x:e.clientX,y:e.clientY};held=false;swiped=false;moved=false;
    holdT=setTimeout(()=>{held=true;ov.classList.add("holding");hold("hold")},220);
  });
  ov.addEventListener("pointermove",e=>{
    if(sh0!==null&&e.clientY-sh0>50){sh0=null;closeSheet();return}
    if(!g0||swiped)return;const dx=e.clientX-g0.x,dy=e.clientY-g0.y;
    if(Math.abs(dx)>40||Math.abs(dy)>40)moved=true;
    if(dy>70&&Math.abs(dx)<Math.abs(dy)){swiped=true;clearTimeout(holdT);unhold();if(admin)who();else close()}
  });
  ov.addEventListener("pointerup",e=>{
    sh0=null;if(!g0)return;clearTimeout(holdT);const wasHeld=held,wasSwipe=swiped,wasMoved=moved;g0=null;
    if(wasHeld){unhold();return}
    if(wasSwipe||wasMoved)return;
    go(e.clientX<ov.clientWidth*.33?-1:1);
  });
  ov.addEventListener("pointercancel",()=>{sh0=null;if(!g0)return;clearTimeout(holdT);g0=null;unhold()});
  ov.addEventListener("contextmenu",e=>e.preventDefault());
  ov.addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(!b)return;const s=b.dataset.s;
    if(s==="x")close();else if(s==="love")love();else if(s==="who")who();else if(s==="sx")closeSheet();else if(s==="del")del(b)});
  document.addEventListener("keydown",kd,true);document.addEventListener("visibilitychange",vis);
  show();
}

function buildNotifs(){
