<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Mess Meal Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f4f6fb;--surface:#fff;--ink:#172033;--muted:#7c879a;--line:#e9edf4;--line2:#f0f2f6;--blue:#5968f5;--bluewash:#eef0ff;--soft:#f8f9fd;--navbg:#e9edf6;--navhover:#f8f9fd;--green:#159b78;--red:#d95368;--shadow:0 12px 34px rgba(35,48,85,.055);--radius:18px;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--surface:#161e31;--ink:#e8edf8;--muted:#98a3b8;--line:#263148;--line2:#212b40;--blue:#8591ff;--bluewash:#202a52;--soft:#1b2439;--navbg:#1a2238;--navhover:#222c45;--green:#3dd3a6;--red:#ff8091;--shadow:0 12px 34px rgba(0,0,0,.25);color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:var(--ink)}button{cursor:pointer;border:0}
.shell{max-width:1280px;margin:auto;padding:24px 26px 34px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:23px}
.identity{display:flex;align-items:center;gap:12px}
.mark{width:44px;height:44px;border-radius:15px;background:linear-gradient(145deg,#6977ff,#4d58e8);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:850;box-shadow:0 7px 16px #5968f544}
.identity h1{font-size:19px;letter-spacing:-.4px;margin:0}.identity p{margin:1px 0 0;color:var(--muted);font-size:12px}
.navwrap{display:flex;align-items:center;gap:5px;overflow-x:auto;padding:5px;background:var(--navbg);border:1px solid var(--line);border-radius:14px;margin-bottom:25px;scrollbar-width:none}.navwrap::-webkit-scrollbar{display:none}
.navbtn{flex:0 0 auto;padding:9px 14px;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;transition:.18s}.navbtn:hover{background:var(--navhover);color:var(--ink)}.navbtn.active{background:var(--surface);color:var(--blue);box-shadow:0 3px 10px #26365b12}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 18px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase}.heading h2{font-size:25px;line-height:1.2;letter-spacing:-.8px;margin:3px 0 4px}.heading p{color:var(--muted);margin:0;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:11px;background:var(--blue);color:#fff;font-size:12px;font-weight:750;box-shadow:0 5px 12px #5968f52b;transition:.18s}.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.soft{background:var(--bluewash);color:var(--blue);box-shadow:none}.btn.ghost{background:var(--soft);color:var(--muted);box-shadow:none;border:1px solid var(--line)}.btn.danger{background:color-mix(in srgb,var(--red) 12%,var(--surface));color:var(--red);box-shadow:none}.btn.tiny{padding:6px 9px;font-size:11px;border-radius:8px}.btn.calc{background:linear-gradient(135deg,#1d9b70,#117654);box-shadow:0 5px 14px rgba(17,118,84,.2)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:650}
.stat-icon{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;font-size:15px;background:var(--bluewash);color:var(--blue)}
.stat strong{display:block;font-size:25px;letter-spacing:-.7px;margin:10px 0 1px;overflow-wrap:anywhere}.stat small{font-size:10px;color:var(--muted)}
.contentgrid{display:grid;grid-template-columns:1.35fr .85fr;gap:14px;margin-top:15px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);min-width:0;margin-bottom:14px}.contentgrid .panel{margin-bottom:0}
.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.panelhead h3{font-size:13px;margin:0}.panelhead p{font-size:10px;color:var(--muted);margin:3px 0 0}.subtle{color:var(--muted);font-size:11px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:750;padding:10px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 9px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--ink);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--soft)}
.person{display:flex;align-items:center;gap:8px;font-weight:700}
.miniavatar{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:var(--bluewash);color:var(--blue);font-size:10px;font-weight:800;flex:none}
.amount{font-weight:800;font-variant-numeric:tabular-nums}.pos{color:var(--green);font-weight:750}.neg{color:var(--red);font-weight:750}
.status{display:inline-block;border-radius:20px;padding:4px 8px;background:color-mix(in srgb,var(--green) 13%,var(--surface));color:var(--green);font-size:9px;font-weight:800}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:12px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.control,.field input,.field select,textarea.control{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:12px;outline:none;max-width:100%}
.control:focus,.field input:focus,.field select:focus{border-color:#9aa3ff;box-shadow:0 0 0 3px #6977ff17}
.search{min-width:190px}
.summarystrip{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.summarybox{flex:1;min-width:135px;background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:12px 14px}.summarybox span{display:block;color:var(--muted);font-size:10px}.summarybox strong{display:block;font-size:17px;margin-top:3px;letter-spacing:-.3px}
.announcement{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line2)}.announcement:last-child{border:0}
.announceicon{width:34px;height:34px;border-radius:11px;background:var(--bluewash);color:var(--blue);display:grid;place-items:center;flex:0 0 auto}
.announcement .body{min-width:0;flex:1}.announcement p{font-size:12px;margin:0 0 3px;white-space:pre-wrap;overflow-wrap:anywhere}.date{font-size:10px;color:var(--muted)}
.rowactions{display:flex;gap:6px;margin-top:8px}
.warn{background:color-mix(in srgb,var(--red) 10%,var(--surface));color:var(--red);border:1px solid color-mix(in srgb,var(--red) 40%,var(--line));border-radius:13px;padding:11px 15px;margin-bottom:16px;font-weight:600}
.member-list-row{display:flex;align-items:center;justify-content:flex-start;gap:18px;padding:11px 0;border-bottom:1px solid var(--line2)}.member-list-row:last-child{border-bottom:0}.member-name{font-weight:700;overflow-wrap:anywhere;min-width:0}
/* meals */
.mrow{display:grid;grid-template-columns:minmax(120px,1fr) repeat(3,auto);gap:10px;padding:12px 0;border-bottom:1px solid var(--line2);align-items:center}
.mrow>span{font-weight:700;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
.mrow label{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:650;cursor:pointer;padding:7px 10px;background:var(--soft);border:1px solid var(--line);border-radius:10px;white-space:nowrap}
.mrow label:has(input:checked){border-color:color-mix(in srgb,var(--green) 45%,var(--line));background:color-mix(in srgb,var(--green) 9%,var(--surface))}
input[type=checkbox]{accent-color:var(--blue);width:17px;height:17px;margin:0}
/* modal */
.modalbg{display:none;position:fixed;inset:0;background:#10182b66;backdrop-filter:blur(4px);z-index:10;align-items:center;justify-content:center;padding:16px}
.modal{width:min(430px,100%);background:var(--surface);border-radius:20px;padding:21px;box-shadow:0 24px 70px #10182b33}.modal h3{margin:0 0 3px;font-size:17px}.modal .hint{color:var(--muted);font-size:11px;margin-bottom:16px}
.field{margin:11px 0}.field label{display:block;font-size:10px;color:var(--muted);font-weight:750;margin-bottom:5px}.field input,.field select{width:100%;padding:10px 11px}
.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
/* reports / charts */
.report-controls{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}.report-controls label,.chart-controls label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:11px;font-weight:750}
.chart-controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:0 0 16px}
.chart-wrap{position:relative;width:100%;max-width:760px;height:clamp(300px,55vw,440px);margin:0 auto}
.note{font-size:11px;color:var(--muted);margin:12px 0 0}
.report-empty{border:1px dashed var(--line);border-radius:13px;padding:22px;text-align:center;color:var(--muted);background:var(--soft)}
/* login */
.login{width:min(440px,100% - 8px);margin:clamp(30px,9vh,100px) auto;padding:34px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px rgba(30,54,110,.13);position:relative;overflow:hidden}
.login:before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:linear-gradient(90deg,var(--blue),#f0b429)}
.login h1{font-size:26px;letter-spacing:-.045em;margin:0 0 8px}.login .btn{width:100%;min-height:46px;font-size:13px}
.login .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}.login input{width:100%;min-height:44px;font-size:14px}.login hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.mu{color:var(--muted)}
/* skeleton */
.skel{position:relative;overflow:hidden;background:var(--line);border-radius:10px;display:block}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--surface) 70%,transparent),transparent);animation:shimmer 1.25s infinite}
@keyframes shimmer{100%{transform:translateX(100%)}}
.skel-stat{height:92px}.skel-tab{height:36px;width:100px;flex:none}.skel-line{height:14px;margin:10px 0}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.contentgrid{grid-template-columns:1fr}.shell{padding:18px}}
@media(max-width:540px){.shell{padding:13px}.topbar{margin-bottom:16px}.heading{align-items:flex-start;flex-direction:column}.heading h2{font-size:22px}.heading .btn{align-self:stretch}.stats{gap:8px}.stat{padding:13px}.stat strong{font-size:21px}.panel{padding:14px}.search{min-width:0;width:100%}.mrow{grid-template-columns:1fr 1fr 1fr}.mrow>span{grid-column:1/-1}.mrow label{padding:7px 6px;justify-content:center;font-size:11px;gap:5px}.login{padding:25px 20px}.login .row{grid-template-columns:1fr}}
</style></head><body>
<div class="shell" id="app"></div>
<div class="modalbg" id="modalbg"><div class="modal"><h3 id="modalTitle"></h3><div class="hint" id="modalHint"></div><div id="modalBody"></div><div class="modalactions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveModal()">Save record</button></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
// PASTE your Google Apps Script web app URL (ends with /exec) here:
const API_URL="https://script.google.com/macros/s/AKfycbz3JUxgJhZ-bCrSExvRWTXkPgXIV3uoaBmfElIJEQnGnrSb4gYoDCI83IshTEFxsyiXQg/exec";
// NOTE: Breakfast counts as HALF a meal (0.5), Lunch & Dinner count as 1 each.
const MEAL_WEIGHTS=[0.5,1,1];
const DEF=()=>({members:[],payments:[],buys:[],meals:{},updates:[],calculation:null,calculationHistory:[],monthCalculations:{},chartSettings:{metric:"meals",period:"all",type:"pie"}});
let S=DEF(),role=null,tab="dash",loaded=false,busy=false,msg="",PW="",md=null,verifyingAdmin=false,pieChart=null,modalKind="",pq="",bq="",ps="new",bs="new";
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const fmt=n=>(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date()),ago=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const canEdit=d=>d<=today()&&d>=ago(2);
const memName=id=>(S.members.find(m=>m.id===id)||{}).name||"-";
const av=n=>"";

/* ---------- API ---------- */
async function api(body){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});return r.json()}
async function load(){
  try{
    const r=await fetch(API_URL),j=await r.json();
    if(j.state)S=Object.assign(DEF(),j.state);
    S.chartSettings=Object.assign({metric:"meals",period:"all",type:"pie"},S.chartSettings||{});
    if(S.calculation&&(!Array.isArray(S.calculationHistory)||!S.calculationHistory.length)){S.calculationHistory=[Object.assign({id:uid(),type:"overall",month:null},JSON.parse(JSON.stringify(S.calculation)))];}
    msg="";
  }catch(e){msg="Could not load data."}
  loaded=true;
}
async function save(){
  busy=true;msg="Saving…";render();
  try{const j=await api({password:PW,state:S});msg=j.ok?"":"Save failed: "+(j.error||"unknown error")}
  catch(e){msg="Save failed: network error. Try again."}
  busy=false;render();
}
async function continueAsMember(){role="user";if(!loaded){render();await load()}render()}
function signOut(){role=null;PW="";tab="dash";msg="";md=null;busy=false;verifyingAdmin=false;render()}

/* ---------- Calculation ---------- */
function buildCalculation(month=null){
  const inMonth=d=>!month||(typeof d==="string"&&d.slice(0,7)===month);
  const tb=S.buys.filter(b=>inMonth(b.date)).reduce((a,b)=>a+(Number(b.amt)||0),0);
  const mealDates=Object.entries(S.meals).filter(([d])=>inMonth(d));
  const rows=S.members.map(m=>{
    let meals=0;
    mealDates.forEach(([,d])=>{const arr=d[m.id]||[0,0,0];meals+=(arr[0]?MEAL_WEIGHTS[0]:0)+(arr[1]?MEAL_WEIGHTS[1]:0)+(arr[2]?MEAL_WEIGHTS[2]:0)});
    const paid=S.payments.filter(p=>p.mid===m.id&&inMonth(p.date)).reduce((a,p)=>a+(Number(p.amt)||0),0);
    return {mid:m.id,name:m.name,meals,paid};
  });
  const tm=rows.reduce((a,r)=>a+r.meals,0),rate=tm?tb/tm:0;
  rows.forEach(r=>{r.cost=rate*r.meals;r.refund=r.paid-r.cost});
  return {id:uid(),type:month?"monthly":"overall",month:month||null,tb,tm,rate,rows,calculatedAt:new Date().toISOString()};
}
function computeCalculation(){return buildCalculation(null)}
function calc(){
  const live=buildCalculation(null);
  const rows=live.rows.map(r=>({m:{id:r.mid,name:r.name},meals:r.meals,paid:r.paid,cost:r.cost,refund:r.refund}));
  return {tb:live.tb,tm:live.tm,rate:live.rate,rows,calculated:true,calculatedAt:S.calculation?.calculatedAt||null,live:true};
}
function addHistory(snapshot){
  if(!Array.isArray(S.calculationHistory))S.calculationHistory=[];
  S.calculationHistory.unshift(JSON.parse(JSON.stringify(snapshot)));
  S.calculationHistory=S.calculationHistory.slice(0,100);
}
function confirmCalculate(){
  if(role!=="admin")return;
  if(!confirm("Are You Sure?"))return;
  S.calculation=computeCalculation();addHistory(S.calculation);save();
}
function monthLabel(month){
  if(!month)return "All-time";
  const [y,m]=month.split("-").map(Number);
  return new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
}
function monthShift(month,delta){const [y,m]=month.split("-").map(Number);const d=new Date(y,m-1+delta,1);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`}
function calculateMonth(){
  if(role!=="admin")return;
  const month=$("#reportMonth")?.value;
  if(!month){alert("Choose a month first.");return}
  if(!confirm(`Are You Sure? Calculate the report for ${monthLabel(month)}?`))return;
  const snapshot=buildCalculation(month);
  if(!S.monthCalculations||typeof S.monthCalculations!=="object")S.monthCalculations={};
  S.monthCalculations[month]=snapshot;addHistory(snapshot);save();
}

/* ---------- Layout helpers ---------- */
function pageTitle(kicker,title,sub,action=""){return `<div class="heading"><div>${kicker?`<div class="eyebrow">${kicker}</div>`:""}<h2>${title}</h2><p>${sub}</p></div>${action}</div>`}
function stat(label,value){return `<div class="stat"><div class="stat-top"><span>${label}</span></div><strong>${value}</strong></div>`}
function sbox(l,v){return `<div class="summarybox"><span>${l}</span><strong>${v}</strong></div>`}
function updList(admin){
  if(!S.updates.length)return '<div class="empty">No updates yet</div>';
  return S.updates.map(u=>`<div class="announcement"><div class="announceicon">✦</div><div class="body"><p>${esc(u.text)}</p><span class="date">${esc(u.date)}</span>${admin?`<div class="rowactions"><button class="btn soft tiny" onclick="editU('${u.id}')">Edit</button><button class="btn danger tiny" onclick="delU('${u.id}')">Delete</button></div>`:""}</div></div>`).join("");
}

/* ---------- Dashboard ---------- */
function summary(c){return `<section class="stats">
  ${stat("Total buying cost",fmt(c.tb))}
  ${stat("Total meals",fmt(c.tm))}
  ${stat("Meal rate",fmt(c.rate))}
  ${stat("Members",S.members.length)}</section>`}
function report(c){
  return `<div class="tablewrap"><table><thead><tr><th>Member</th><th>Meals</th><th>Overall Cost</th><th>Paid</th><th>Refund / Due</th></tr></thead><tbody>
  ${c.rows.map(x=>`<tr><td><div class="person">${av(x.m.name)}${esc(x.m.name)}</div></td><td>${x.meals===null?"—":fmt(x.meals)}</td><td class="amount">${x.cost===null?"—":fmt(x.cost)}</td><td>${x.paid===null?"—":fmt(x.paid)}</td><td class="${x.refund===null?"":x.refund>=0?"pos":"neg"}">${x.refund===null?"—":(x.refund>=0?"Refund ":"Due ")+fmt(Math.abs(x.refund))}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">No members</td></tr>'}
  </tbody></table></div>
  <p class="note">Live totals and member balances are updated from all currently saved meals, payments, and buying costs. The Calculate button saves a snapshot.</p>`;
}
function dashTab(c,adm){
  return pageTitle("OVERVIEW","Dashboard",adm?"Here’s what’s happening in your mess.":"Your mess summary at a glance.")+summary(c)+
  `<div class="panel" style="margin-top:15px"><div class="panelhead"><div><h3>Mess updates</h3><p>Latest announcements</p></div></div>${updList(false)}</div>
  <div class="panel"><div class="panelhead"><div><h3>Overall Cost</h3><p>Meal rate, cost and member balances</p></div>${adm?'<button class="btn calc tiny" onclick="confirmCalculate()" title="Save a snapshot of meal rate, overall cost and member balances">Calculate</button>':""}</div>${report(c)}</div>`;
}

/* ---------- Updates (admin add / edit / delete) ---------- */
function updTab(){
  const n=S.updates.length;
  return pageTitle("MESS BOARD",`Updates (${n}/2)`,"Important messages shared with all members.")+
  `<div class="panel"><div class="toolbar"><textarea class="control" id="ut" rows="2" style="flex:1;min-width:200px;resize:vertical" placeholder="Write an update for everyone"></textarea><button class="btn" onclick="addU()">＋ Add update</button></div>
  ${n>=2?'<p class="subtle">Limit reached: delete one update to add a new one.</p>':""}${updList(true)}</div>`;
}
function addU(){const t=$("#ut").value.trim();if(!t)return;
  if(S.updates.length>=2){alert("Only 2 updates allowed. Delete one first.");return}
  S.updates.push({id:uid(),text:t,date:today()});save()}
function editU(id){const u=S.updates.find(x=>x.id===id),t=prompt("Edit update",u.text);
  if(t===null||!t.trim())return;u.text=t.trim();u.date=today();save()}
function delU(id){if(confirm("Delete this update?")){S.updates=S.updates.filter(u=>u.id!==id);save()}}

/* ---------- Meals (your entry system, new design) ---------- */
function mealsTab(){
  const d=md||today(),ok=canEdit(d),cur=S.meals[d]||{};
  return pageTitle("DAILY RECORDS","Meals","Daily breakfast, lunch and dinner records.")+
  `<div class="panel"><div class="toolbar"><input class="control" type="date" id="md" value="${d}" max="${today()}" min="${ago(2)}" onchange="md=this.value;render()">
  <span class="subtle">${ok?"Open for entry":"Locked: meals can only be added on the day or within 2 days after."}</span></div>
  ${S.members.map(m=>{const v=cur[m.id]||[0,0,0];
    return `<div class="mrow"><span>${av(m.name)}${esc(m.name)}</span>${["Breakfast","Lunch","Dinner"].map((n,i)=>`<label><input type="checkbox" data-m="${m.id}" data-i="${i}" ${v[i]?"checked":""} ${ok?"":"disabled"}>${n}</label>`).join("")}</div>`
  }).join("")||'<div class="empty">Add members first.</div>'}
  ${ok&&S.members.length?'<div style="margin-top:14px"><button class="btn" onclick="saveMeals()" '+(busy?"disabled":"")+'>Save meals for this day</button></div>':""}</div>`;
}
function saveMeals(){
  const d=$("#md").value;if(!canEdit(d))return;
  const o={};
  S.members.forEach(m=>o[m.id]=[0,1,2].map(i=>$(`[data-m="${m.id}"][data-i="${i}"]`).checked?1:0));
  S.meals[d]=o;save();
}

/* ---------- Members (name only) ---------- */
function membersTab(){
  return pageTitle("PEOPLE","Members","Member directory.")+
  `<div class="panel"><div class="toolbar"><input class="control search" id="nm" placeholder="Member name" aria-label="Member name" onkeydown="if(event.key==='Enter')addM()"><button class="btn" onclick="addM()">＋ Add member</button></div>
  ${S.members.map(m=>`<div class="member-list-row"><span class="member-name">${esc(m.name)}</span><button class="btn danger tiny" onclick="delM('${m.id}')">Remove</button></div>`).join("")||'<div class="empty">No members yet.</div>'}</div>`;
}
function delM(id){if(!confirm("Are you Sure?"))return;
  S.members=S.members.filter(m=>m.id!==id);
  S.payments=S.payments.filter(p=>p.mid!==id);
  Object.values(S.meals).forEach(d=>delete d[id]);
  save();}
function addM(){const n=$("#nm").value.trim();if(!n)return;S.members.push({id:uid(),name:n});save()}

/* ---------- Payments ---------- */
function sortList(list,s){const a=[...list];
  return a.sort((x,y)=>s==="high"?(y.amt-x.amt):s==="old"?String(x.date).localeCompare(String(y.date)):String(y.date).localeCompare(String(x.date)))}
function payTable(){
  const q=pq.toLowerCase();
  const list=sortList(S.payments,ps).filter(p=>!q||(memName(p.mid)+" "+(p.note||"")).toLowerCase().includes(q));
  return `<div class="tablewrap"><table><thead><tr><th>Member</th><th>Date</th><th>Payment note</th><th>Amount</th><th></th></tr></thead><tbody>
  ${list.map(p=>`<tr><td><div class="person">${av(memName(p.mid))}${esc(memName(p.mid))}</div></td><td>${esc(p.date)}</td><td>${esc(p.note||"—")}</td><td class="amount">${fmt(p.amt)}</td><td><button class="btn danger tiny" onclick="delItem('payments','${p.id}')">Delete</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">No payment records yet</td></tr>'}
  </tbody></table></div>`;
}
function payTab(){
  const total=S.payments.reduce((a,p)=>a+(Number(p.amt)||0),0);
  return pageTitle("","Payments","Track member deposits and keep every payment in one place.",`<button class="btn" onclick="openModal('payment')">＋ Add payment</button>`)+
  `<div class="summarystrip">${sbox("Total received",fmt(total))}${sbox("Payment entries",S.payments.length)}${sbox("Members paid",new Set(S.payments.map(x=>x.mid)).size)}</div>
  <div class="panel"><div class="panelhead"><div><h3>Payment history</h3><p>Latest member payment entries</p></div><span class="status">Updated</span></div>
  <div class="toolbar"><input class="control search" id="paySearch" placeholder="⌕  Search member or note…" value="${esc(pq)}" oninput="pq=this.value;$('#payRows').innerHTML=payTable()"><select class="control" id="paySort" onchange="ps=this.value;$('#payRows').innerHTML=payTable()"><option value="new" ${ps==="new"?"selected":""}>Newest first</option><option value="old" ${ps==="old"?"selected":""}>Oldest first</option><option value="high" ${ps==="high"?"selected":""}>Highest amount</option></select></div>
  <div id="payRows">${payTable()}</div></div>`;
}

/* ---------- Buying ---------- */
function buyTable(){
  const q=bq.toLowerCase();
  const list=sortList(S.buys,bs).filter(b=>!q||((b.note||"")+" "+(b.detail||"")).toLowerCase().includes(q));
  return `<div class="tablewrap"><table><thead><tr><th>Purchase item</th><th>Date</th><th>Details</th><th>Overall Expense</th><th></th></tr></thead><tbody>
  ${list.map(b=>`<tr><td><div class="person">${esc(b.note||"-")}</div></td><td>${esc(b.date)}</td><td>${esc(b.detail||"—")}</td><td class="amount">${fmt(b.amt)}</td><td><button class="btn danger tiny" onclick="delItem('buys','${b.id}')">Delete</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">No buying cost records yet</td></tr>'}
  </tbody></table></div>`;
}
function buyTab(){
  const total=S.buys.reduce((a,b)=>a+(Number(b.amt)||0),0);
  return pageTitle("","Buying","Record grocery purchases and follow your kitchen spending.",`<button class="btn" onclick="openModal('buy')">＋ Add buying cost</button>`)+
  `<div class="summarystrip">${sbox("Overall Expense",fmt(total))}${sbox("Purchase entries",S.buys.length)}${sbox("Average purchase",fmt(S.buys.length?total/S.buys.length:0))}</div>
  <div class="panel"><div class="panelhead"><div><h3>Buying history</h3><p>Food and kitchen purchases</p></div><span class="status">Expense log</span></div>
  <div class="toolbar"><input class="control search" id="buySearch" placeholder="⌕  Search item or note…" value="${esc(bq)}" oninput="bq=this.value;$('#buyRows').innerHTML=buyTable()"><select class="control" id="buySort" onchange="bs=this.value;$('#buyRows').innerHTML=buyTable()"><option value="new" ${bs==="new"?"selected":""}>Newest first</option><option value="old" ${bs==="old"?"selected":""}>Oldest first</option><option value="high" ${bs==="high"?"selected":""}>Highest cost</option></select></div>
  <div id="buyRows">${buyTable()}</div></div>`;
}
function delItem(k,id){if(!confirm("Delete this record?"))return;S[k]=S[k].filter(x=>x.id!==id);save()}

/* ---------- Add payment / buying modal (date is always today) ---------- */
function openModal(k){
  if(k==="payment"&&!S.members.length){alert("Add members first.");return}
  modalKind=k;
  $("#modalTitle").textContent=k==="payment"?"Add a payment":"Add buying cost";
  $("#modalHint").textContent=k==="payment"?"Record a member deposit or advance. Date is set to today.":"Add a grocery or kitchen purchase. Date is set to today.";
  $("#modalBody").innerHTML=k==="payment"
   ?`<div class="field"><label>MEMBER</label><select id="fMember">${S.members.map(m=>`<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select></div><div class="field"><label>AMOUNT</label><input id="fAmount" type="number" min="0" step="any" placeholder="Enter amount"></div><div class="field"><label>NOTE</label><input id="fNote" placeholder="e.g. Monthly payment"></div>`
   :`<div class="field"><label>ITEM NAME</label><input id="fItem" placeholder="e.g. Rice, vegetables"></div><div class="field"><label>COST</label><input id="fAmount" type="number" min="0" step="any" placeholder="Enter purchase cost"></div><div class="field"><label>NOTE</label><input id="fNote" placeholder="Optional details"></div>`;
  $("#modalbg").style.display="flex";
}
function closeModal(){$("#modalbg").style.display="none"}
function saveModal(){
  const a=parseFloat($("#fAmount").value);
  if(!(a>0)){alert("Please enter a valid amount");return}
  const note=$("#fNote").value.trim();
  if(modalKind==="payment"){
    S.payments.push({id:uid(),mid:$("#fMember").value,amt:a,date:today(),note});
  }else{
    const item=$("#fItem").value.trim();
    if(!item){alert("Please enter an item name");return}
    S.buys.push({id:uid(),note:item,detail:note,amt:a,date:today()});
  }
  closeModal();save();
}

/* ---------- Monthly reports (from your code) ---------- */
function monthlyReportsTab(){
  const month=$("#reportMonth")?.value||today().slice(0,7);
  const c=(S.monthCalculations||{})[month]||null;
  return pageTitle("FINANCIAL SUMMARY","Month-wise Reports","Choose a month to calculate a separate report using only meals, buying costs, and payments recorded in that month. Reports are saved as snapshots.")+
  `<div class="panel"><div class="report-controls"><label>Report month<input class="control" id="reportMonth" type="month" value="${esc(month)}" max="${today().slice(0,7)}" onchange="render()"></label><button class="btn calc" onclick="calculateMonth()">Calculate Month</button></div>
  ${c?`<div class="summarystrip">${sbox("Buying cost",fmt(c.tb))}${sbox("Total meals",fmt(c.tm))}${sbox("Meal rate",fmt(c.rate))}${sbox("Members",(c.rows||[]).length)}</div>
  <p class="note" style="margin:0 0 14px">${esc(monthLabel(month))} · Last calculated ${esc(new Date(c.calculatedAt).toLocaleString())}. This saved report will not change unless you calculate this month again.</p>
  <div class="tablewrap"><table><thead><tr><th>Member</th><th>Meals</th><th>Overall Cost</th><th>Paid</th><th>Refund / Due</th></tr></thead><tbody>
  ${(c.rows||[]).map(r=>`<tr><td><div class="person">${av(r.name)}${esc(r.name)}</div></td><td>${fmt(r.meals)}</td><td class="amount">${fmt(r.cost)}</td><td>${fmt(r.paid)}</td><td class="${r.refund>=0?"pos":"neg"}">${r.refund>=0?"Refund ":"Due "}${fmt(Math.abs(r.refund))}</td></tr>`).join("")||'<tr><td colspan="5" class="empty">No members</td></tr>'}
  </tbody></table></div>`:`<div class="report-empty">No saved report for ${esc(monthLabel(month))} yet. Select Calculate Month to create one.</div>`}</div>`;
}

/* ---------- Charts ---------- */
const CHART_METRICS={
  meals:{label:"Meals by member",kind:"members",field:"meals",title:"Meal share by member",unit:"meals"},
  paid:{label:"Payments by member",kind:"members",field:"paid",title:"Payments by member",unit:"currency"},
  cost:{label:"Overall cost by member",kind:"members",field:"cost",title:"Overall cost by member",unit:"currency"},
  refund:{label:"Refund balance by member",kind:"members",field:"refundPositive",title:"Positive balance by member",unit:"currency"},
  buying:{label:"Buying cost by item",kind:"buys",field:"amt",title:"Buying cost by item",unit:"currency"}
};
const PALETTE=["#6674f5","#20a784","#f1b45c","#a18ae8","#ed8294","#69b8c8","#8ccf6a","#e07b4f"];
function chartValues(metric,period){
  const cfg=CHART_METRICS[metric]||CHART_METRICS.meals;
  if(cfg.kind==="buys"){
    const rows=S.buys.filter(b=>period==="all"||String(b.date||"").slice(0,7)===period).map(b=>({label:b.note||"Buying cost",value:Number(b.amt)||0}));
    const seen={};rows.forEach(r=>{seen[r.label]=(seen[r.label]||0)+1;if(seen[r.label]>1)r.label+=" ("+seen[r.label]+")"});
    return {title:cfg.title,unit:cfg.unit,rows:rows.filter(r=>r.value>0)};
  }
  const c=buildCalculation(period==="all"?null:period);
  let rows=c.rows.map(r=>({label:r.name,value:Math.max(0,Number(cfg.field==="refundPositive"?r.refund:r[cfg.field])||0)}));
  if(metric==="refund")rows=rows.filter(r=>r.value>0);
  return {title:cfg.title,unit:cfg.unit,rows:rows.filter(r=>r.value>0)};
}
function chartsTab(c){
  const cfg=S.chartSettings||{metric:"meals",period:"all"};
  const month=today().slice(0,7),period=cfg.period||"all",ctype=cfg.type||"pie";
  const data=chartValues(cfg.metric,period),total=data.rows.reduce((a,r)=>a+r.value,0);
  const controls=role==="admin"?`<div class="chart-controls">
    <label>Information to visualize<select class="control" id="chartMetric" onchange="updateChartSettings()">${Object.keys(CHART_METRICS).map(k=>`<option value="${k}" ${cfg.metric===k?"selected":""}>${CHART_METRICS[k].label}</option>`).join("")}</select></label>
    <label>Period<select class="control" id="chartPeriod" onchange="updateChartSettings()"><option value="all" ${period==="all"?"selected":""}>All time</option><option value="${month}" ${period===month?"selected":""}>This month (${month})</option>${Array.from({length:11},(_,i)=>{const m=monthShift(month,-(i+1));return `<option value="${m}" ${period===m?"selected":""}>${esc(monthLabel(m))}</option>`}).join("")}</select></label>
    <label>Chart type<select class="control" id="chartType" onchange="updateChartSettings()">${[["pie","Pie chart"],["doughnut","Doughnut chart"],["bar","Bar chart"],["line","Line chart"]].map(t=>`<option value="${t[0]}" ${ctype===t[0]?"selected":""}>${t[1]}</option>`).join("")}</select></label>
  </div><p class="note" style="margin:0 0 14px">Your chart selection is shared with members. Change any option to publish the selected chart for everyone.</p>`:`<p class="subtle" style="margin:0 0 14px">This chart reflects the chart view selected by the administrator.</p>`;
  return pageTitle("VISUAL INSIGHTS","Charts","See how meals, payments, member costs, and buying expenses are distributed.")+
  `<div class="panel"><div class="panelhead"><div><h3>${esc(data.title)}</h3><p>${period==="all"?"All time":esc(monthLabel(period))}</p></div><span class="status">${fmt(total)}${data.unit==="meals"?" meals":""}</span></div>${controls}
  ${data.rows.length?`<div class="chart-wrap"><canvas id="pieChartCanvas" aria-label="${esc(data.title)} chart" role="img"></canvas></div>`:`<div class="report-empty">There is no recorded data for this chart and period yet.</div>`}</div>
  <div class="panel"><div class="panelhead"><h3>Quick insights</h3><span class="subtle">Current data</span></div><div class="summarystrip" style="margin:0">${sbox("Total meals",fmt(c.tm))}${sbox("Meal rate",fmt(c.rate))}</div></div>`;
}
function updateChartSettings(){
  if(role!=="admin")return;
  S.chartSettings={metric:$("#chartMetric")?.value||"meals",period:$("#chartPeriod")?.value||"all",type:$("#chartType")?.value||"pie"};save();
}
function drawPieChart(){
  if(pieChart){pieChart.destroy();pieChart=null}
  const canvas=$("#pieChartCanvas");
  if(!canvas||typeof Chart==="undefined")return;
  const cfg=S.chartSettings||{metric:"meals",period:"all"},data=chartValues(cfg.metric,cfg.period||"all");
  if(!data.rows.length)return;
  const type=cfg.type||"pie",round=type==="pie"||type==="doughnut",tc=getComputedStyle(document.body).color,gc="rgba(128,138,160,.18)";
  pieChart=new Chart(canvas,{type,data:{labels:data.rows.map(r=>r.label),datasets:[{label:data.title,data:data.rows.map(r=>r.value),
    backgroundColor:type==="line"?"rgba(102,116,245,.12)":data.rows.map((_,i)=>PALETTE[i%PALETTE.length]),
    borderColor:type==="line"?"#6674f5":round?"rgba(255,255,255,.85)":data.rows.map((_,i)=>PALETTE[i%PALETTE.length]),
    borderWidth:type==="line"?3:2,borderRadius:type==="bar"?8:0,tension:.35,fill:type==="line",pointRadius:type==="line"?4:0,pointBackgroundColor:"#6674f5"}]},
   options:{responsive:true,maintainAspectRatio:false,
    plugins:{legend:{display:round,position:"bottom",labels:{padding:16,usePointStyle:true,pointStyle:"circle",color:tc}},
     tooltip:{backgroundColor:"#202b42",padding:11,callbacks:{label:ctx=>{const val=Number(round?ctx.raw:ctx.parsed.y)||0;const sum=ctx.dataset.data.reduce((a,v)=>a+(Number(v)||0),0);const pct=sum?val/sum*100:0;return `${ctx.label}: ${fmt(val)}${data.unit==="meals"?" meals":""} (${pct.toFixed(1)}%)`}}}},
    scales:round?{}:{x:{grid:{display:false},ticks:{color:tc}},y:{beginAtZero:true,grid:{color:gc},ticks:{color:tc}}}}});
}

/* ---------- Reminders (admin) ---------- */
function dayHasMeals(date){const d=S.meals[date];if(!d||typeof d!=="object")return false;return Object.values(d).some(a=>Array.isArray(a)&&a.some(Boolean))}
function runAdminReminders(){
  if(role!=="admin"||!loaded)return;
  const t=today(),month=t.slice(0,7),key="messReminder:"+t;
  try{if(sessionStorage.getItem(key))return}catch(e){}
  const parts=[];
  if(!dayHasMeals(t))parts.push("Reminder: enter today's meals.");
  const d=new Date(),lastDay=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  if(!((S.monthCalculations||{})[month])&&d.getDate()===lastDay)parts.push("Month-end reminder: calculate and save this month's final report.");
  if(parts.length)setTimeout(()=>{if(role==="admin")alert(parts.join("\n\n"))},350);
  try{sessionStorage.setItem(key,"1")}catch(e){}
}

/* ---------- Login ---------- */
function login(){
  return `<div class="login">
  <p class="mu" style="font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px;font-size:11px">MESS MANAGEMENT</p>
  <h1>Welcome to your mess.</h1>
  <p class="mu" style="margin:0 0 22px">A simpler way to track daily meals, shared costs and member balances.</p>
  <button class="btn" onclick="continueAsMember()">View dashboard as member <span aria-hidden="true">→</span></button>
  <hr>
  <p class="mu" style="margin:0 0 12px;font-weight:750">Administrator sign-in</p>
  <div class="row">
    <input class="control" id="pw" type="password" autocomplete="current-password" placeholder="Enter admin password" aria-label="Admin password" onkeydown="if(event.key==='Enter')adminLogin()">
    <button class="btn" onclick="adminLogin()" ${busy?"disabled":""}>Sign in</button>
  </div>
  <div class="neg" role="status" style="margin-top:10px">${esc(msg)}</div></div>`;
}
async function adminLogin(){
  const p=$("#pw").value;if(!p)return;
  busy=true;msg="";verifyingAdmin=true;render();
  try{
    const j=await api({action:"check",password:p});
    if(j.ok){PW=p;role="admin";loaded=false;render();await load();render()}
    else msg="Incorrect password.";
  }catch(e){msg="Network error. Check API_URL."}
  busy=false;verifyingAdmin=false;render();
}

/* ---------- Render ---------- */
function topbar(adm){
  return `<header class="topbar"><div class="identity"><div class="mark">M</div><div><h1>Mess Meal Manager</h1><p>${adm?"Administrator console":"Member view"}</p></div></div><button class="btn ghost" onclick="signOut()">Sign out</button></header>`;
}
function skelDashboard(){
  const adm=role==="admin";
  return `${topbar(adm)}${adm?`<div class="navwrap">${Array.from({length:7}).map(()=>'<div class="skel skel-tab"></div>').join("")}</div>`:""}
  <div class="stats">${Array.from({length:4}).map(()=>'<div class="skel skel-stat"></div>').join("")}</div>
  <div class="panel" style="margin-top:15px">${Array.from({length:5}).map(()=>'<div class="skel skel-line"></div>').join("")}</div>`;
}
function render(){
  const a=$("#app");
  if(!role){a.innerHTML=login();return}
  if(!loaded){a.innerHTML=skelDashboard()+(msg?`<div class="warn">${esc(msg)}</div>`:"");return}
  const c=calc(),adm=role==="admin";
  const tabs=[["dash","Dashboard"],["upd","Updates"],["meals","Meals"],["members","Members"],["pay","Payments"],["buy","Buying"],["reports","Monthly Reports"],["charts","Charts"]];
  const visible=adm?tabs:[["dash","Dashboard"],["charts","Charts"]];
  if(!visible.some(t=>t[0]===tab))tab="dash";
  const fx=document.activeElement&&document.activeElement.id,fv=document.activeElement&&document.activeElement.value;
  a.innerHTML=`${topbar(adm)}
  ${msg?`<div class="warn">${esc(msg)}</div>`:""}
  <nav class="navwrap">${visible.map(t=>`<button class="navbtn ${tab===t[0]?"active":""}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join("")}</nav>
  <main>
  ${tab==="dash"?dashTab(c,adm):""}
  ${adm&&tab==="upd"?updTab():""}
  ${adm&&tab==="meals"?mealsTab():""}
  ${adm&&tab==="members"?membersTab():""}
  ${adm&&tab==="pay"?payTab():""}
  ${adm&&tab==="buy"?buyTab():""}
  ${adm&&tab==="reports"?monthlyReportsTab():""}
  ${tab==="charts"?chartsTab(c):""}
  </main>`;
  drawPieChart();
  if(adm)runAdminReminders();
}
render();
// Background refresh for members
setInterval(()=>{if(role!=="admin"&&role&&!busy){load().then(render)}},30000);
</script></body></html>
